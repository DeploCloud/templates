services:
  harness:
    image: harness/harness:3.3.0@sha256:c1bd76817ad7d2e7d78827653a54c55d4aec87c2777a586ebbad1ed01fc9e83f
    restart: unless-stopped
    expose:
      - 3000
    environment:
      GITNESS_URL_BASE: ${GITNESS_URL_BASE}
      GITNESS_URL_REGISTRY: ${GITNESS_URL_REGISTRY}
      GITNESS_ENCRYPTER_SECRET: ${GITNESS_ENCRYPTER_SECRET}
      GITNESS_USER_SIGNUP_ENABLED: ${GITNESS_USER_SIGNUP_ENABLED}
      GITNESS_SSH_ENABLE: ${GITNESS_SSH_ENABLE}
      GITNESS_GITSPACE_ENABLE: ${GITNESS_GITSPACE_ENABLE}
      GITNESS_BLOBSTORE_BUCKET: /data/blob
    volumes:
      - harness-data:/data

volumes:
  harness-data: {}
