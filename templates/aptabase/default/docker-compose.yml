services:
  aptabase:
    image: ghcr.io/aptabase/aptabase:main@sha256:a8fc36774685dda96f8e511d9977dc02726c712d79ca71f0febf3d7caa2361ad
    restart: unless-stopped
    expose:
      - 8080
    environment:
      BASE_URL: ${BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: Server=aptabase-db;Port=5432;User Id=aptabase;Password=${DB_PASSWORD};Database=aptabase
      CLICKHOUSE_URL: Host=aptabase-clickhouse;Port=8123;Username=aptabase;Password=${CLICKHOUSE_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
    volumes:
      # keeps login sessions valid across redeploys
      - aptabase-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      aptabase-db:
        condition: service_healthy
      aptabase-clickhouse:
        condition: service_healthy

  aptabase-db:
    image: postgres:15.20-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
    restart: unless-stopped
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: aptabase
    volumes:
      - aptabase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptabase -d aptabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  aptabase-clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3-alpine@sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - aptabase-events:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  aptabase-keys: {}
  aptabase-db: {}
  aptabase-events: {}
