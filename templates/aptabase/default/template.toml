[variables]
db_password = "${password:32}"
clickhouse_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "aptabase"
port = 8_080
host = "${domain}"

[config.env]
BASE_URL = "https://${domain}"
AUTH_SECRET = "${secret:48}"
DB_PASSWORD = "${db_password}"
CLICKHOUSE_PASSWORD = "${clickhouse_password}"
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USERNAME = ""
SMTP_PASSWORD = ""
SMTP_FROM_ADDRESS = ""
