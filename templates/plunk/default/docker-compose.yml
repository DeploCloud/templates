services:
  plunk:
    image: ghcr.io/useplunk/plunk:0.18.0@sha256:a5c2c691f0d895489e067d971fca404a70dfd19a1380295e3459c3dfe9d86e04
    restart: unless-stopped
    expose:
      - 80
    environment:
      SERVICE: all
      NODE_ENV: production
      DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@plunk-db:5432/plunk
      DIRECT_DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@plunk-db:5432/plunk
      REDIS_URL: redis://plunk-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      USE_HTTPS: "true"
      API_DOMAIN: ${API_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      API_URI: ${API_URI}
      DASHBOARD_URI: ${DASHBOARD_URI}
      LANDING_URI: ${LANDING_URI}
      WIKI_URI: ${WIKI_URI}
      AWS_SES_REGION: ${AWS_SES_REGION}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET}
      S3_ENDPOINT: http://plunk-minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_ACCESS_KEY_SECRET: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: uploads
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_FORCE_PATH_STYLE: "true"
      AUTO_PROJECT_DISABLE: ${AUTO_PROJECT_DISABLE}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      plunk-db:
        condition: service_healthy
      plunk-redis:
        condition: service_healthy
      plunk-minio:
        condition: service_healthy

  plunk-db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_DB: plunk
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plunk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plunk -d plunk"]
      interval: 10s
      timeout: 5s
      retries: 10

  plunk-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - plunk-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  plunk-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data
    expose:
      - 9000
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - plunk-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  plunk-db: {}
  plunk-redis: {}
  plunk-minio: {}
