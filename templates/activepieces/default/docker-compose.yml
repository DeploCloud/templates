services:
  activepieces:
    image: ghcr.io/activepieces/activepieces:0.93.0@sha256:151c2a4326c30a6a8086297136644da9b58072212c35bca7c87dcb5724e7d687
    restart: unless-stopped
    expose:
      - 80
    environment:
      AP_CONTAINER_TYPE: APP
      AP_EDITION: ${AP_EDITION}
      AP_ENVIRONMENT: prod
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL}
      AP_API_KEY: ${AP_API_KEY}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: activepieces-db
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_REDIS_TYPE: STANDALONE
      AP_REDIS_HOST: activepieces-redis
      AP_REDIS_PORT: "6379"
    volumes:
      - activepieces-cache:/usr/src/app/cache
    depends_on:
      activepieces-db:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy

  activepieces-worker:
    image: ghcr.io/activepieces/activepieces:0.93.0@sha256:151c2a4326c30a6a8086297136644da9b58072212c35bca7c87dcb5724e7d687
    restart: unless-stopped
    environment:
      AP_CONTAINER_TYPE: WORKER
      # Workers reach the app over the internal network, not the public URL.
      AP_FRONTEND_URL: http://activepieces
      AP_EDITION: ${AP_EDITION}
      AP_ENVIRONMENT: prod
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
    volumes:
      - activepieces-cache:/usr/src/app/cache
    depends_on:
      - activepieces

  activepieces-db:
    image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - activepieces-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  activepieces-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    volumes:
      - activepieces-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  activepieces-cache: {}
  activepieces-db: {}
  activepieces-redis: {}
