services:
  openbao:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    restart: unless-stopped
    command: server
    expose:
      - 8200
    environment:
      BAO_API_ADDR: ${BAO_API_ADDR}
      BAO_ADDR: http://127.0.0.1:8200
      BAO_LOCAL_CONFIG: >-
        {"ui": true, "cluster_addr": "http://127.0.0.1:8201",
        "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
        "storage": {"raft": {"path": "/openbao/file", "node_id": "openbao-1"}}}
    volumes:
      - openbao-data:/openbao/file
      - openbao-logs:/openbao/logs

volumes:
  openbao-data: {}
  openbao-logs: {}
