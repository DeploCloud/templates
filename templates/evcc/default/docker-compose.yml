services:
  evcc:
    image: evcc/evcc:0.319.1@sha256:b4fb63cb90710a989d4f491bd81a6505326337a22a95e82c3227fd78ffd5116d
    restart: unless-stopped
    expose:
      - 7070
    environment:
      TZ: ${TZ}
    volumes:
      - evcc-data:/root/.evcc
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7070 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  evcc-data: {}
