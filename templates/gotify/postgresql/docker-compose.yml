services:
  gotify:
    image: gotify/server:3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      gotify-db:
        condition: service_healthy
    environment:
      GOTIFY_DATABASE_DIALECT: postgres
      GOTIFY_DATABASE_CONNECTION: "host=gotify-db port=5432 user=gotify dbname=gotify password=${DB_PASSWORD} sslmode=disable"
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
      GOTIFY_SERVER_SECURECOOKIE: "true"
    volumes:
      - gotify-data:/app/data

  gotify-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: gotify
      POSTGRES_USER: gotify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotify -d gotify"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - gotify-db:/var/lib/postgresql

volumes:
  gotify-data: {}
  gotify-db: {}
