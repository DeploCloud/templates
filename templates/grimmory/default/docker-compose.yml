services:
  grimmory:
    image: grimmory/grimmory:v3.5.1@sha256:678d8e8af92f3587d4cfae28ffbe44854105ea56fed6b9590fc56b454f512585
    restart: unless-stopped
    expose:
      - 6060
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ}
      DATABASE_URL: jdbc:mariadb://grimmory-db:3306/grimmory
      DATABASE_USERNAME: grimmory
      DATABASE_PASSWORD: ${DB_PASSWORD}
    volumes:
      - grimmory-data:/app/data
      - grimmory-books:/books
      - grimmory-bookdrop:/bookdrop
    depends_on:
      grimmory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6060/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  grimmory-db:
    image: mariadb:11.4.13@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_DATABASE: grimmory
      MARIADB_USER: grimmory
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - grimmory-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  grimmory-data: {}
  grimmory-books: {}
  grimmory-bookdrop: {}
  grimmory-db: {}
