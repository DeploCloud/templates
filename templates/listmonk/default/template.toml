[variables]
db_password = "${password:32}"
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "listmonk"
port = 9_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
LISTMONK_ADMIN_USER = "admin"
LISTMONK_ADMIN_PASSWORD = "${admin_password}"
TZ = "Etc/UTC"
