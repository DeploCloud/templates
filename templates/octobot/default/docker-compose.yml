services:
  octobot:
    image: drakkarsoftware/octobot:2.1.1@sha256:415d93a9d676817bbe52fcd2a8d47fba146f04392e8a24651e4a432abdbf4628
    restart: unless-stopped
    expose:
      - 5001
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - octobot-user:/octobot/user
      - octobot-tentacles:/octobot/tentacles
      - octobot-logs:/octobot/logs
      - octobot-backtesting:/octobot/backtesting
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://127.0.0.1:5001 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  octobot-user: {}
  octobot-tentacles: {}
  octobot-logs: {}
  octobot-backtesting: {}
