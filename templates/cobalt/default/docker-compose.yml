services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1@sha256:28540f81d2cffbd9d089c08438e39a7689a7cee7e9a5b0f60de93a22d19f5dbe
    init: true
    read_only: true
    restart: unless-stopped
    expose:
      - 9000
    environment:
      API_URL: ${API_URL}
      API_PORT: ${API_PORT}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
