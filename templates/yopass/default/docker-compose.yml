services:
  yopass:
    image: jhaals/yopass:16.2.0@sha256:6e245cd019198164117a77a01b8c5e0437b639e261fa6cacd0c54d5ea732cd53
    restart: unless-stopped
    expose:
      - 1337
    environment:
      DATABASE: memcached
      MEMCACHED: yopass-memcached:11211
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - yopass-memcached

  yopass-memcached:
    image: memcached:1.6.45-alpine@sha256:084fb554292d1447bc2c68b80c2331b98834514f56c866bc21a61be3c2ee376d
    restart: unless-stopped
