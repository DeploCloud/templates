services:
  typecho:
    image: joyqi/typecho:1.3.0-php8.2-apache@sha256:195752c1174219f8a12c56c8c93809cc7e14b327e21dba3fdb4d81384e598fbd
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - typecho-app:/app
    environment:
      TYPECHO_INSTALL: "1"
      TYPECHO_LANG: en_US
      TYPECHO_DB_ADAPTER: Pdo_Mysql
      TYPECHO_DB_HOST: typecho-db
      TYPECHO_DB_PORT: "3306"
      TYPECHO_DB_DATABASE: typecho
      TYPECHO_DB_USER: typecho
      TYPECHO_DB_PASSWORD: ${TYPECHO_DB_PASSWORD}
      TYPECHO_DB_NEXT: keep
      TYPECHO_SITE_URL: ${TYPECHO_SITE_URL}
      TYPECHO_USER_NAME: ${TYPECHO_USER_NAME}
      TYPECHO_USER_PASSWORD: ${TYPECHO_USER_PASSWORD}
      TYPECHO_USER_MAIL: ${TYPECHO_USER_MAIL}
    depends_on:
      typecho-db:
        condition: service_healthy

  typecho-db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    volumes:
      - typecho-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: typecho
      MYSQL_USER: typecho
      MYSQL_PASSWORD: ${TYPECHO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  typecho-app: {}
  typecho-db: {}
