[variables]
admin_email = "${email}"
admin_password = "${password:24}"
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "apache-answer"
port = 80
host = "${domain}"

[config.env]
AUTO_INSTALL = "true"
DB_TYPE = "postgres"
DB_HOST = "apache-answer-db:5432"
DB_NAME = "answer"
DB_USERNAME = "answer"
DB_PASSWORD = "${db_password}"
LANGUAGE = "en_US"
SITE_NAME = "Apache Answer"
SITE_URL = "https://${domain}"
CONTACT_EMAIL = "${admin_email}"
ADMIN_NAME = "admin"
ADMIN_PASSWORD = "${admin_password}"
ADMIN_EMAIL = "${admin_email}"
EXTERNAL_CONTENT_DISPLAY = "ask_before_display"
