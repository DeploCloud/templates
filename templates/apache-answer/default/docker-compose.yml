services:
  apache-answer:
    image: apache/answer:2.0.3@sha256:0863470d8293294b899f8b39a373df6d6250c3f3e412ea0e483924b41e23428f
    restart: unless-stopped
    expose:
      - 80
    environment:
      AUTO_INSTALL: "${AUTO_INSTALL}"
      DB_TYPE: "${DB_TYPE}"
      DB_FILE: "${DB_FILE}"
      LANGUAGE: "${LANGUAGE}"
      SITE_NAME: "${SITE_NAME}"
      SITE_URL: "${SITE_URL}"
      CONTACT_EMAIL: "${CONTACT_EMAIL}"
      ADMIN_NAME: "${ADMIN_NAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      EXTERNAL_CONTENT_DISPLAY: "${EXTERNAL_CONTENT_DISPLAY}"
    volumes:
      - apache-answer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  apache-answer-data: {}
