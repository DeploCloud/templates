services:
  label-studio:
    image: heartexlabs/label-studio:1.23.2@sha256:afcc516a22775a39d0d66f4c2ddc95d01be3e3d3862b21fcf4f9de34b4ad4e12
    restart: unless-stopped
    expose:
      - 8080
    environment:
      LABEL_STUDIO_HOST: "${LABEL_STUDIO_HOST}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS}"
      LABEL_STUDIO_USERNAME: "${LABEL_STUDIO_USERNAME}"
      LABEL_STUDIO_PASSWORD: "${LABEL_STUDIO_PASSWORD}"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "${LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK}"
    volumes:
      - label-studio-data:/label-studio/data

volumes:
  label-studio-data: {}
