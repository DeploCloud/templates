[variables]
admin_password = "${password:24}"
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "label-studio"
port = 8_080
host = "${domain}"

[config.env]
POSTGRE_NAME = "labelstudio"
POSTGRE_USER = "labelstudio"
POSTGRE_PASSWORD = "${db_password}"
LABEL_STUDIO_HOST = "https://${domain}"
CSRF_TRUSTED_ORIGINS = "https://${domain}"
LABEL_STUDIO_USERNAME = "admin@localhost"
LABEL_STUDIO_PASSWORD = "${admin_password}"
LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK = "true"
