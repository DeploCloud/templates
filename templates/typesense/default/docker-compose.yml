services:
  typesense:
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    restart: unless-stopped
    expose:
      - 8108
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: ${TYPESENSE_DATA_DIR}
    volumes:
      - typesense-data:/data

volumes:
  typesense-data: {}
