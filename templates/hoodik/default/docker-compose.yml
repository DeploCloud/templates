services:
  hoodik:
    image: hudik/hoodik:v2.6.1@sha256:d793b3b5e8631f2462fdb1ea0ca62d3b96cafefcab437afdf1003b3e7e9be193
    restart: unless-stopped
    expose:
      - 5443
    environment:
      DATA_DIR: /data
      APP_URL: ${APP_URL}
      SSL_DISABLED: "true"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - hoodik-data:/data

volumes:
  hoodik-data: {}
