services:
  memos:
    image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 5230
    environment:
      MEMOS_PORT: ${MEMOS_PORT}
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL}
      MEMOS_DATA: /var/opt/memos
      MEMOS_DRIVER: postgres
      MEMOS_DSN: ${MEMOS_DSN}
    volumes:
      - memos-data:/var/opt/memos

  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: memos
      POSTGRES_USER: memos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memos -d memos"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - memos-database:/var/lib/postgresql/data

volumes:
  memos-data: {}
  memos-database: {}
