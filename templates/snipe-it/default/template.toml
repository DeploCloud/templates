[variables]
app_key = "${password:32}"
db_password = "${password:32}"
db_root_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "snipe-it"
port = 80
host = "${domain}"

[config.env]
APP_KEY = "${app_key}"
APP_URL = "https://${domain}"
APP_TIMEZONE = "UTC"
APP_LOCALE = "en-US"
APP_TRUSTED_PROXIES = "REMOTE_ADDR"
APP_TRUSTED_HEADERS = "HEADER_X_FORWARDED_FOR,HEADER_X_FORWARDED_HOST,HEADER_X_FORWARDED_PORT,HEADER_X_FORWARDED_PROTO"
DB_DATABASE = "snipeit"
DB_USERNAME = "snipeit"
DB_PASSWORD = "${db_password}"
DB_ROOT_PASSWORD = "${db_root_password}"
MAIL_MAILER = "log"
MAIL_HOST = "null"
MAIL_PORT = "587"
MAIL_USERNAME = "null"
MAIL_PASSWORD = "null"
MAIL_FROM_ADDR = "noreply@${domain}"
MAIL_FROM_NAME = "Snipe-IT"
