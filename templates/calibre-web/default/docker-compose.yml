services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls406@sha256:b206b791d77b731203fb47b5733d055c8d4ebd7c9fa59a4569a5d6a2b3ebda54
    restart: unless-stopped
    expose:
      - 8083
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - calibre-web-config:/config

volumes:
  calibre-web-config: {}
