services:
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    expose:
      - 3200
      - 4317
      - 4318
    volumes:
      # the image runs as 10001 and owns /var/tempo
      - tempo-data:/var/tempo
      - ./tempo.yaml:/etc/tempo.yaml:ro

volumes:
  tempo-data: {}
