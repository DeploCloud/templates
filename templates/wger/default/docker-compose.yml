x-wger: &wger
  image: wger/server:2.7.0@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04
  restart: unless-stopped
  environment:
    SECRET_KEY: ${SECRET_KEY}
    SITE_URL: ${SITE_URL}
    CSRF_TRUSTED_ORIGINS: ${SITE_URL}
    X_FORWARDED_PROTO_HEADER_SET: "True"
    TIME_ZONE: ${TIME_ZONE}
    TZ: ${TIME_ZONE}
    PS_DATABASE_URI: ${PS_DATABASE_URI}
    PS_STORAGE_PG_URI: ${PS_STORAGE_PG_URI}
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
    ALLOW_GUEST_USERS: "False"
    DJANGO_DEBUG: "False"
    DJANGO_PERFORM_MIGRATIONS: "True"
    DJANGO_CLEAR_STATIC_FIRST: "False"
    DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
    DJANGO_CACHE_LOCATION: redis://wger-redis:6379/1
    DJANGO_CACHE_TIMEOUT: "1296000"
    DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
    USE_CELERY: "True"
    CELERY_BROKER: redis://wger-redis:6379/2
    CELERY_BACKEND: redis://wger-redis:6379/2
    CELERY_WORKER_CONCURRENCY: "4"
    SYNC_EXERCISES_CELERY: "True"
    SYNC_EXERCISE_IMAGES_CELERY: "True"
    SYNC_EXERCISE_VIDEOS_CELERY: "True"
    SYNC_INGREDIENTS_CELERY: "True"
    CACHE_API_EXERCISES_CELERY: "True"
    CACHE_API_EXERCISES_CELERY_FORCE_UPDATE: "True"
    EXERCISE_CACHE_TTL: "2419200"
    # Traefik and the bundled nginx sit in front of gunicorn
    AXES_IPWARE_PROXY_COUNT: "1"
    AXES_IPWARE_META_PRECEDENCE_ORDER: HTTP_X_FORWARDED_FOR,REMOTE_ADDR
    NUMBER_OF_PROXIES: "2"
    WGER_USE_GUNICORN: "True"
    GUNICORN_CMD_ARGS: --workers 3 --threads 2 --worker-class gthread --timeout 240

services:
  wger:
    <<: *wger
    # JWT keys are RSA, so they are generated once and kept on the keys volume
    command:
      - bash
      - -c
      - |
        set -e
        keys=/home/wger/db/jwt.env
        [ -s "$$keys" ] || python3 manage.py generate-jwt-keys | grep '^JWT_' > "$$keys"
        set -a; . "$$keys"; set +a
        python3 manage.py setup-powersync-storage
        exec /home/wger/entrypoint.sh
    expose:
      - 8000
    volumes:
      - wger-static:/home/wger/static
      - wger-media:/home/wger/media
      - wger-keys:/home/wger/db
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8000/api/v2/version/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      wger-db:
        condition: service_healthy
      wger-redis:
        condition: service_healthy

  wger-celery-worker:
    <<: *wger
    command: /start-worker
    volumes:
      - wger-static:/home/wger/static:ro
      - wger-media:/home/wger/media
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      wger:
        condition: service_healthy

  wger-celery-beat:
    <<: *wger
    command: /start-beat
    volumes:
      - wger-beat:/home/wger/beat
    depends_on:
      wger-celery-worker:
        condition: service_healthy

  wger-powersync:
    image: journeyapps/powersync-service:1.29.1@sha256:4c6c2c4312e7339206dfbc5cc385ae2a6e29e2908fa0b2a2d669f07f3c959635
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    expose:
      - 8080
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_DATABASE_URI: ${PS_DATABASE_URI}
      PS_STORAGE_PG_URI: ${PS_STORAGE_PG_URI}
      PS_PORT: "8080"
      PS_JWKS_URL: http://wger:8000/api/v2/powersync-keys
    volumes:
      - ./powersync.yaml:/config/powersync.yaml:ro
      - ./sync_rules.yaml:/config/sync_rules.yaml:ro
    depends_on:
      wger-db:
        condition: service_healthy
      wger:
        condition: service_healthy

  wger-nginx:
    image: nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wger-static:/wger/static:ro
      - wger-media:/wger/media:ro
    depends_on:
      - wger
      - wger-powersync

  wger-db:
    image: postgres:15.17-alpine@sha256:09e4f20b14ddb3dfe3a0c825b206032aaf8f28300ba2070c0b60fc1c10c6abc7
    restart: unless-stopped
    shm_size: 256mb
    # PowerSync replicates through logical decoding
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wger
      TZ: ${TIME_ZONE}
    volumes:
      - wger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U wger -d wger"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wger-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    volumes:
      - wger-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wger-static: {}
  wger-media: {}
  wger-keys: {}
  wger-beat: {}
  wger-db-data: {}
  wger-redis-data: {}
