[variables]
oauth_domain = "oauth.${domain}"

[[config.domains]]
serviceName = "gmail-cleaner"
port = 8_766
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "gmail-cleaner-oauth"
port = 80
host = "${oauth_domain}"

[[config.mounts]]
filePath = "credentials.json"
content = """{
  "web": {
    "client_id": "REPLACE_WITH_YOUR_CLIENT_ID.apps.googleusercontent.com",
    "client_secret": "REPLACE_WITH_YOUR_CLIENT_SECRET",
    "auth_uri": "https://accounts.google.com/o/oauth2/auth",
    "token_uri": "https://oauth2.googleapis.com/token",
    "redirect_uris": ["http://${oauth_domain}:80/"]
  }
}
"""

[[config.mounts]]
filePath = "Caddyfile"
content = """
{
	admin off
	auto_https off
}

:80 {
	reverse_proxy gmail-cleaner:8767
	handle_errors 502 {
		respond "No Google sign-in is in progress. Click Sign In in Gmail Cleaner first." 404
	}
}
"""

[config.env]
OAUTH_HOST = "${oauth_domain}"
