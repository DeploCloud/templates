x-storage: &storage
  CELLD_BUCKET: openseo
  S3_ENDPOINT: http://openseo-storage:9000
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}

services:
  openseo:
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      openseo-runtime:
        condition: service_healthy
      crawl-gateway:
        condition: service_started

  openseo-runtime:
    image: ghcr.io/every-app/open-seo-standalone:0.1.30@sha256:2b2dd143b86157e700938ddfcfefda2a8286fa1d75e2d9052b930ea4b694f323
    restart: unless-stopped
    # Upstream runs init.sh in a sidecar sharing this network namespace; here it runs in-process instead.
    command:
      - sh
      - -c
      - |
        sh /opt/standalone/run.sh & pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        sh /opt/standalone/init.sh || { kill -TERM $$pid; wait $$pid; exit 1; }
        wait $$pid; wait $$pid
    environment:
      <<: *storage
      CELLD_MAX_RSS_MB: "1536"
      CELLD_MAX_RESIDENT_CELLS: "64"
      CELLD_V8_HEAP_LIMIT_MB: "256"
      CELLD_MAX_REQUEST_BODY_BYTES: "33554432"
      RUST_LOG: warn,cell_console=info
      AUTH_MODE: password
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY}
      TREG_API_TOKEN: ${TREG_API_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      CONTEXT_API_KEY: ${CONTEXT_API_KEY}
      CRAWLER_ACCESS_SECRET: ${CRAWLER_ACCESS_SECRET}
    mem_limit: 2g
    stop_grace_period: 60s
    volumes:
      - openseo-runtime:/data
      - openseo-config:/config
    depends_on:
      openseo-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 5

  # Unprefixed: the app's generated configuration calls http://crawl-gateway:8090.
  crawl-gateway:
    image: ghcr.io/every-app/open-seo-standalone:0.1.30@sha256:2b2dd143b86157e700938ddfcfefda2a8286fa1d75e2d9052b930ea4b694f323
    restart: unless-stopped
    command: ["node", "/opt/standalone/crawl-gateway.mjs"]
    volumes:
      - openseo-config:/config:ro
    depends_on:
      openseo-runtime:
        condition: service_healthy

  openseo-storage:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - openseo-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  openseo-runtime: {}
  openseo-config: {}
  openseo-storage: {}
