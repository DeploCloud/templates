services:
  beelzebub:
    image: m4r10/beelzebub:v3.10.0@sha256:243bf4b8888c44fff2680779d3c166a50fced2a0c2a5a49deb65baf9d4be7bbb
    restart: unless-stopped
    expose:
      - 8080
    environment:
      BEELZEBUB_LOGGING_LOGS_PATH: /logs/beelzebub.log
    volumes:
      - beelzebub-logs:/logs
      - ./wordpress.yaml:/configurations/services/wordpress.yaml:ro

volumes:
  beelzebub-logs: {}
