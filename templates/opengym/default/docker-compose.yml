services:
  opengym:
    image: ghcr.io/duartesantos8/opengym-web:1.4.5@sha256:e621677554302a0e1745e3b8c90acddc7d7149e118c4d683d51c13aa88f47d27
    restart: unless-stopped
    expose:
      - 8080
    environment:
      NGINX_PORT: "8080"
      BACKEND: opengym-api
      PORT: "3000"
    depends_on:
      opengym-api:
        condition: service_healthy

  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.5@sha256:397c83e9ac33a413bc8f21e66b2e55038100fc7f9da900d80be28b30fbb12ea8
    restart: unless-stopped
    expose:
      - 3000
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      RP_ID: ${RP_ID}
      ORIGIN: ${ORIGIN}
      RP_NAME: ${RP_NAME}
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN}
      INVITE_ONLY: ${INVITE_ONLY}
    volumes:
      - opengym-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  opengym-data: {}
