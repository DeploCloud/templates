services:
  affine:
    image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    restart: unless-stopped
    expose:
      - 3010
    environment:
      REDIS_SERVER_HOST: ${REDIS_SERVER_HOST}
      REDIS_SERVER_PORT: ${REDIS_SERVER_PORT}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - affine-storage:/root/.affine/storage
      - ./config.json:/root/.affine/config/config.json:ro
    depends_on:
      affine-migration:
        condition: service_completed_successfully
      affine-redis:
        condition: service_healthy
      affine-db:
        condition: service_healthy

  affine-migration:
    image: ghcr.io/toeverything/affine:0.27.4@sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
    restart: "no"
    command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
    environment:
      REDIS_SERVER_HOST: ${REDIS_SERVER_HOST}
      REDIS_SERVER_PORT: ${REDIS_SERVER_PORT}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-db:
        condition: service_healthy

  affine-redis:
    image: redis:latest@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    restart: unless-stopped
    volumes:
      - affine-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  affine-db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: ${AFFINE_DB_PASSWORD}
      POSTGRES_DB: affine
    volumes:
      - affine-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affine -d affine"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  affine-storage: {}
  affine-redis: {}
  affine-postgres: {}
