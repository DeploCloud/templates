x-gramps-web: &gramps-web
  image: ghcr.io/gramps-project/grampsweb:26.11.3@sha256:bf672745c0428ec37f398f51a89e07a0dabe4f2abc1038fd0952e358ae0228a3
  restart: unless-stopped
  environment:
    GRAMPSWEB_TREE: Gramps Web
    GRAMPSWEB_BASE_URL: https://${DOMAIN}
    GRAMPSWEB_SECRET_KEY: ${SECRET_KEY}
    GRAMPSWEB_BACKUP_DIR: /app/backups
    GRAMPSWEB_PROXY_FIX_X_FOR: "1"
    GRAMPSWEB_CELERY_CONFIG__broker_url: redis://gramps-web-redis:6379/0
    GRAMPSWEB_CELERY_CONFIG__result_backend: redis://gramps-web-redis:6379/0
    GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://gramps-web-redis:6379/1
    GUNICORN_NUM_WORKERS: "2"
  volumes:
    - gramps-web-users:/app/users
    - gramps-web-index:/app/indexdir
    - gramps-web-thumb-cache:/app/thumbnail_cache
    - gramps-web-cache:/app/cache
    - gramps-web-db:/root/.gramps/grampsdb
    - gramps-web-media:/app/media
    - gramps-web-backups:/app/backups
    - gramps-web-tmp:/tmp

services:
  gramps-web:
    <<: *gramps-web
    expose:
      - 5000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      gramps-web-redis:
        condition: service_healthy

  # Waits for the web service so the two entrypoints never migrate the user database at once.
  gramps-web-celery:
    <<: *gramps-web
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2
    depends_on:
      gramps-web:
        condition: service_healthy
      gramps-web-redis:
        condition: service_healthy

  gramps-web-redis:
    image: valkey/valkey:9.2.0-alpine@sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - gramps-web-redis:/data

volumes:
  gramps-web-users: {}
  gramps-web-index: {}
  gramps-web-thumb-cache: {}
  gramps-web-cache: {}
  gramps-web-db: {}
  gramps-web-media: {}
  gramps-web-backups: {}
  gramps-web-tmp: {}
  gramps-web-redis: {}
