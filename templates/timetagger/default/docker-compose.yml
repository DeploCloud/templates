services:
  timetagger:
    image: ghcr.io/almarklein/timetagger:v26.1.3@sha256:04797c616a25760ee94b352273535a516881ca820e507aee9abf7a63e5768502
    restart: unless-stopped
    # Credentials need a bcrypt hash, so it is derived from the generated password at start.
    command:
      - /bin/sh
      - -c
      - |
        TIMETAGGER_CREDENTIALS="$$ADMIN_USERNAME:$$(python -c 'import bcrypt, os; print(bcrypt.hashpw(os.environ["ADMIN_PASSWORD"].encode(), bcrypt.gensalt()).decode())')"
        export TIMETAGGER_CREDENTIALS
        exec python -m timetagger
    expose:
      - 80
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TIMETAGGER_BIND: 0.0.0.0:80
      TIMETAGGER_DATADIR: /root/_timetagger
      TIMETAGGER_LOG_LEVEL: info
      TIMETAGGER_APP_REDIRECT: "true"
    volumes:
      - timetagger-data:/root/_timetagger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/timetagger/status')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  timetagger-data: {}
