services:
  part-db:
    image: jbtronics/part-db1:v2.20.7@sha256:68adc8f99a915cf3e68d4a0d72aab16b0bffd3d48c3e3984cb688a37769309df
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - part-db-uploads:/var/www/html/uploads
      - part-db-media:/var/www/html/public/media
    environment:
      APP_ENV: docker
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://partdb:${DB_PASSWORD}@part-db-db:3306/partdb?serverVersion=11.8.0-MariaDB
      DB_AUTOMIGRATE: "true"
      INITIAL_ADMIN_PW: ${INITIAL_ADMIN_PW}
      DEFAULT_URI: ${DEFAULT_URI}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    depends_on:
      part-db-db:
        condition: service_healthy
  part-db-db:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: partdb
      MARIADB_USER: partdb
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - part-db-mariadb:/var/lib/mysql
volumes:
  part-db-uploads: {}
  part-db-media: {}
  part-db-mariadb: {}
