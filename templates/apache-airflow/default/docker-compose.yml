x-airflow: &airflow
  image: apache/airflow:3.4.0@sha256:a8d9d19c563c768b2bc605ef26440f28a9164ea886064e99c599b057432ff572
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW_LOAD_EXAMPLES}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://apache-airflow:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${POSTGRES_PASSWORD}@apache-airflow-db:5432/airflow
    AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
  volumes:
    - apache-airflow-dags:/opt/airflow/dags
    - apache-airflow-logs:/opt/airflow/logs
    - apache-airflow-plugins:/opt/airflow/plugins
  depends_on:
    apache-airflow-db:
      condition: service_healthy
    apache-airflow-init:
      condition: service_completed_successfully

services:
  apache-airflow:
    <<: *airflow
    command: ["api-server", "--proxy-headers"]
    expose:
      - 8080
    environment:
      <<: *airflow-env
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  apache-airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  apache-airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  apache-airflow-triggerer:
    <<: *airflow
    command: ["triggerer"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Runs once per deploy as root: volume ownership, DB migration, admin user (kept if it exists).
  apache-airflow-init:
    <<: *airflow
    restart: "no"
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins && chown 50000:0 /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins && exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      apache-airflow-db:
        condition: service_healthy

  apache-airflow-db:
    image: postgres:17.12-alpine@sha256:cdef2be34fbbd163d0d633177c02d228c6c47937b95fdffe1eefb91914dfd47f
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - apache-airflow-postgres:/var/lib/postgresql/data

volumes:
  apache-airflow-dags: {}
  apache-airflow-logs: {}
  apache-airflow-plugins: {}
  apache-airflow-postgres: {}
