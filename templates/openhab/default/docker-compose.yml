services:
  openhab:
    image: openhab/openhab:5.2.5@sha256:78bb11484098841c7a58fe101507b423d007ca0d17623dd2eea8fa26816a0f81
    restart: unless-stopped
    expose:
      - 8080
    environment:
      TZ: ${TZ}
      CRYPTO_POLICY: ${CRYPTO_POLICY}
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
    volumes:
      - openhab-addons:/openhab/addons
      - openhab-conf:/openhab/conf
      - openhab-userdata:/openhab/userdata
      - ./restauth.cfg:/openhab/conf/services/restauth.cfg
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20m

volumes:
  openhab-addons: {}
  openhab-conf: {}
  openhab-userdata: {}
