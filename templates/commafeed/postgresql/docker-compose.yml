services:
  commafeed:
    image: athou/commafeed:7.5.3-postgresql@sha256:20974df5b3841cbcb42109cbff5729efa26ae598bf6c62d544e0e88e6cb9df28
    restart: unless-stopped
    expose:
      - 8082
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://commafeed-db:5432/commafeed
      QUARKUS_DATASOURCE_USERNAME: commafeed
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY: ${QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY}
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
    depends_on:
      commafeed-db:
        condition: service_healthy

  commafeed-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: commafeed
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: commafeed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commafeed -d commafeed"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - commafeed-db:/var/lib/postgresql

volumes:
  commafeed-db: {}
