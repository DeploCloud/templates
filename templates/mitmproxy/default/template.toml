port = 8_081
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "mitmproxy"
port = 8_080
host = "${proxy_domain}"

[config.env]
MITM_UPSTREAM = "https://example.com"
WEB_PASSWORD = "${web_password}"
