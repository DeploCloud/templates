services:
  kill-bill-init:
    image: killbill/killbill:0.24.22@sha256:e135615bd14f8ff52d258a4b6a936b4cd0276e30a874a7e2c4690f7a1e28f7f1
    restart: "no"
    user: "0:0"
    # the plugins dir is absent from the image, so a fresh volume starts root-owned
    entrypoint: ["chown", "tomcat:tomcat", "/var/lib/killbill/bundles/plugins"]
    volumes:
      - kill-bill-plugins:/var/lib/killbill/bundles/plugins

  killbill:
    image: killbill/killbill:0.24.22@sha256:e135615bd14f8ff52d258a4b6a936b4cd0276e30a874a7e2c4690f7a1e28f7f1
    restart: unless-stopped
    expose:
      - 8080
    environment:
      KILLBILL_DAO_URL: jdbc:mysql://kill-bill-db:3306/killbill
      KILLBILL_DAO_USER: root
      KILLBILL_DAO_PASSWORD: ${DB_ROOT_PASSWORD}
      KB_ADMIN_PASSWORD: ${KB_ADMIN_PASSWORD}
      KB_org_killbill_server_baseUrl: ${KILLBILL_BASE_URL}
    volumes:
      - kill-bill-plugins:/var/lib/killbill/bundles/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/1.0/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      kill-bill-init:
        condition: service_completed_successfully
      kill-bill-db:
        condition: service_healthy

  kaui:
    image: killbill/kaui:4.0.31@sha256:5629cc499696a9247fde6ac3b0bbd46e53d8466bd5383f4258865c3e73b7f9d6
    restart: unless-stopped
    expose:
      - 8080
    environment:
      KAUI_CONFIG_DAO_URL: jdbc:mysql://kill-bill-db:3306/kaui
      KAUI_CONFIG_DAO_USER: root
      KAUI_CONFIG_DAO_PASSWORD: ${DB_ROOT_PASSWORD}
      KAUI_KILLBILL_URL: http://killbill:8080
      KAUI_SECRET_KEY_BASE: ${KAUI_SECRET_KEY_BASE}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      kill-bill-db:
        condition: service_healthy

  kill-bill-db:
    image: killbill/mariadb:0.24@sha256:8fddf7d564befcea3e3d762c01b3e65fb4b45fb8db077297998ad935468372fa
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - kill-bill-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  kill-bill-db: {}
  kill-bill-plugins: {}
