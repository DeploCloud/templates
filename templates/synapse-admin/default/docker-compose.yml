services:
  synapse-admin:
    image: awesometechnologies/synapse-admin:0.11.4@sha256:a1c1f4662875f51ff1ca556a9eb7c802d9bc40ef58747b9efc163b42da3ad416
    restart: unless-stopped
    expose:
      - 80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/config.json >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
