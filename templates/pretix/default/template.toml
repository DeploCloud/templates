[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "pretix"
port = 80
host = "${domain}"

[config.env]
PRETIX_PRETIX_INSTANCE_NAME = "${domain}"
PRETIX_PRETIX_URL = "https://${domain}"
PRETIX_DJANGO_SECRET = "${secret:64}"
PRETIX_DATABASE_PASSWORD = "${db_password}"
PRETIX_MAIL_FROM = "tickets@${domain}"
PRETIX_MAIL_HOST = "localhost"
PRETIX_MAIL_PORT = "587"
PRETIX_MAIL_USER = ""
PRETIX_MAIL_PASSWORD = ""
PRETIX_MAIL_TLS = "on"
PRETIX_MAIL_SSL = "off"
