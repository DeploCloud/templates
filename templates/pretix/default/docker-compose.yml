x-pretix: &pretix
  image: pretix/standalone:2026.9.3@sha256:0d066cd7821efccf805c8eae4ba3e8f918c7341384af071fcbaa1a9a6cc05640
  restart: unless-stopped
  environment:
    PRETIX_PRETIX_INSTANCE_NAME: ${PRETIX_PRETIX_INSTANCE_NAME}
    PRETIX_PRETIX_URL: ${PRETIX_PRETIX_URL}
    PRETIX_PRETIX_TRUST_X_FORWARDED_FOR: "on"
    PRETIX_PRETIX_TRUST_X_FORWARDED_PROTO: "on"
    PRETIX_DJANGO_SECRET: ${PRETIX_DJANGO_SECRET}
    PRETIX_DATABASE_BACKEND: postgresql
    PRETIX_DATABASE_NAME: pretix
    PRETIX_DATABASE_USER: pretix
    PRETIX_DATABASE_PASSWORD: ${PRETIX_DATABASE_PASSWORD}
    PRETIX_DATABASE_HOST: pretix-db
    PRETIX_DATABASE_PORT: "5432"
    PRETIX_REDIS_LOCATION: redis://pretix-redis:6379/0
    PRETIX_REDIS_SESSIONS: "true"
    PRETIX_CELERY_BROKER: redis://pretix-redis:6379/1
    PRETIX_CELERY_BACKEND: redis://pretix-redis:6379/2
    PRETIX_MAIL_FROM: ${PRETIX_MAIL_FROM}
    PRETIX_MAIL_HOST: ${PRETIX_MAIL_HOST}
    PRETIX_MAIL_PORT: ${PRETIX_MAIL_PORT}
    PRETIX_MAIL_USER: ${PRETIX_MAIL_USER}
    PRETIX_MAIL_PASSWORD: ${PRETIX_MAIL_PASSWORD}
    PRETIX_MAIL_TLS: ${PRETIX_MAIL_TLS}
    PRETIX_MAIL_SSL: ${PRETIX_MAIL_SSL}
  volumes:
    - pretix-data:/data

services:
  pretix:
    <<: *pretix
    expose:
      - 80
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    depends_on:
      pretix-db:
        condition: service_healthy
      pretix-redis:
        condition: service_healthy

  # Periodic tasks (order expiry, reminders, cleanup); upstream runs `pretix cron` from host cron.
  pretix-cron:
    <<: *pretix
    entrypoint: ["/bin/bash", "-c", "while true; do /usr/local/bin/pretix cron; sleep 900; done"]
    depends_on:
      pretix:
        condition: service_healthy

  pretix-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: pretix
      POSTGRES_USER: pretix
      POSTGRES_PASSWORD: ${PRETIX_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix -d pretix"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pretix-db:/var/lib/postgresql

  pretix-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pretix-redis:/data

volumes:
  pretix-data: {}
  pretix-db: {}
  pretix-redis: {}
