[variables]
db_password = "${password:32}"
api_token = "${hash:64}"

[config]

[[config.domains]]
serviceName = "formance-ledger-gateway"
port = 80
host = "${domain}"

[[config.mounts]]
filePath = "Caddyfile"
content = """
{
	admin off
	auto_https off
	servers {
		trusted_proxies static private_ranges
	}
}

:80 {
	@unauthorized {
		not path /_healthcheck
		not header Authorization "Bearer {$LEDGER_API_TOKEN}"
	}
	respond @unauthorized "Unauthorized" 401
	reverse_proxy formance-ledger:3068
}
"""

[config.env]
POSTGRES_PASSWORD = "${db_password}"
LEDGER_API_TOKEN = "${api_token}"
