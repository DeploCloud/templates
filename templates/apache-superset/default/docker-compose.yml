x-superset: &superset
  # -dev preset of the 6.1.0 release: the lean tag ships no PostgreSQL driver.
  image: apache/superset:6.1.0-dev@sha256:be6a6d4938aeb7888bd29cd4b84fa37c6d071c36ae19fef8b929024bf6d5ab8f
  restart: unless-stopped
  environment: &superset-env
    PYTHONUNBUFFERED: "1"
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET__SQLALCHEMY_DATABASE_URI: ${SUPERSET_DATABASE_URI}
    SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL}
  volumes:
    - apache-superset-home:/app/superset_home
    - ./superset_config.py:/app/pythonpath/superset_config.py:ro
  depends_on:
    apache-superset-init:
      condition: service_completed_successfully
    apache-superset-db:
      condition: service_healthy
    apache-superset-redis:
      condition: service_healthy

services:
  apache-superset:
    <<: *superset
    expose:
      - 8088
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Same steps as upstream docker-init.sh; safe to rerun, it skips an existing admin.
  apache-superset-init:
    <<: *superset
    restart: "no"
    command:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        superset fab create-admin --username "$$ADMIN_USERNAME" --firstname Superset --lastname Admin --email "$$ADMIN_EMAIL" --password "$$ADMIN_PASSWORD" &&
        superset init
    environment:
      <<: *superset-env
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      apache-superset-db:
        condition: service_healthy
      apache-superset-redis:
        condition: service_healthy
    healthcheck:
      disable: true

  apache-superset-worker:
    <<: *superset
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "-O", "fair", "-l", "INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  apache-superset-beat:
    <<: *superset
    command: ["celery", "--app=superset.tasks.celery_app:app", "beat", "-l", "INFO", "-s", "/app/superset_home/celerybeat-schedule"]
    healthcheck:
      disable: true

  apache-superset-db:
    image: postgres:17.12-alpine@sha256:cdef2be34fbbd163d0d633177c02d228c6c47937b95fdffe1eefb91914dfd47f
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: superset
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - apache-superset-postgres:/var/lib/postgresql/data

  apache-superset-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - apache-superset-redis:/data

volumes:
  apache-superset-home: {}
  apache-superset-postgres: {}
  apache-superset-redis: {}
