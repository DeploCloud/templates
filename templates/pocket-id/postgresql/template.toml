[variables]
encryption_key = "${base64:32}"
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "pocket-id"
port = 1_411
host = "${domain}"

[config.env]
APP_URL = "https://${domain}"
ENCRYPTION_KEY = "${encryption_key}"
TRUST_PROXY = "true"
DB_USER = "pocketid"
DB_NAME = "pocketid"
DB_PASSWORD = "${db_password}"
