services:
  ollama:
    image: ollama/ollama:0.40.9@sha256:5c6707fcf2e1a30cffe2ecb7e315584fc87747c389327e4bc711c4959aa1eecc
    restart: unless-stopped
    expose:
      - 11434
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data: {}
