[config]

[[config.domains]]
serviceName = "continuwuity"
port = 8_008
host = "${domain}"

[config.env]
CONTINUWUITY_SERVER_NAME = "${domain}"
CONTINUWUITY_WELL_KNOWN__CLIENT = "https://${domain}"
CONTINUWUITY_WELL_KNOWN__SERVER = "${domain}:443"

[[config.mounts]]
filePath = "continuwuity-resolv.conf"
content = """nameserver 1.1.1.1
nameserver 1.0.0.1
"""
