services:
  theme-park:
    image: ghcr.io/themepark-dev/theme.park:1.24.0@sha256:1d8433526c112a29f8332626ac829e6f4e771e82f0843163edff322f9c489c4f
    restart: unless-stopped
    expose:
      - 80
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      TP_DOMAIN: ${TP_DOMAIN}
      TP_SCHEME: ${TP_SCHEME}
    volumes:
      - theme-park-config:/config

volumes:
  theme-park-config: {}
