services:
  sqlpage:
    image: lovasoa/sqlpage:v0.48.0@sha256:ab972cb8e0090458f7d528c7fc41f2311c2daf6a8d7e1895cf4b4e7cd2d63c1f
    restart: unless-stopped
    # named volumes are root-owned; the image user (1000) could not write uploads
    user: "0:0"
    expose:
      - 8080
    environment:
      DATABASE_URL: postgres://sqlpage@sqlpage-db:5432/sqlpage
      DATABASE_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sqlpage-www:/var/www
      - sqlpage-config:/etc/sqlpage
    depends_on:
      sqlpage-db:
        condition: service_healthy
  sqlpage-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlpage
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sqlpage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlpage -d sqlpage"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sqlpage-db:/var/lib/postgresql

volumes:
  sqlpage-www: {}
  sqlpage-config: {}
  sqlpage-db: {}
