services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls373@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
    restart: unless-stopped
    expose:
      - 6767
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - bazarr-config:/config
      - bazarr-movies:/movies
      - bazarr-tv:/tv

volumes:
  bazarr-config: {}
  bazarr-movies: {}
  bazarr-tv: {}
