[variables]
mongo_password = "${password:32}"
session_secret = "${password:48}"

[[config.domains]]
serviceName = "countly-nginx"
port = 80
host = "${domain}"

[config.env]
COUNTLY_HOSTNAME = "${domain}"
COUNTLY_PLUGINS = "mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,remote-config,hooks,dashboards,sdk,data-manager,guides"
MONGO_USER = "countly"
MONGO_PASSWORD = "${mongo_password}"
SESSION_SECRET = "${session_secret}"

[[config.mounts]]
filePath = "countly.conf"
content = """server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # Docker DNS, so a restarted API or dashboard container is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $countly_api http://countly-api:3001;
    set $countly_frontend http://countly-frontend:6001;

    if ($http_content_type = "text/ping") {
        return 404;
    }

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /i {
        proxy_pass $countly_api;
    }

    location ^~ /i/ {
        proxy_pass $countly_api;
    }

    location = /o {
        proxy_pass $countly_api;
    }

    location ^~ /o/ {
        proxy_pass $countly_api;
    }

    location / {
        proxy_pass $countly_frontend;
    }
}
"""
