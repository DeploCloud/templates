[variables]
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "dreeve"
port = 8_080
host = "${domain}"

[config.env]
IMPORT_MODE = "files"
APP_URL = "https://${domain}"
TZ = "UTC"
APP_SECRET = "${hash:64}"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "${admin_password}"
STRAVA_CLIENT_ID = ""
STRAVA_CLIENT_SECRET = ""
STRAVA_REFRESH_TOKEN = ""
