services:
  reactive-resume:
    image: amruthpillai/reactive-resume:v6.1.1@sha256:6390bd3dfa2e1acd41dceef3e4be6724f4564346bfc9d0cd54316552cca9545d
    restart: unless-stopped
    expose:
      - 3000
    environment:
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@reactive-resume-db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      FLAG_DISABLE_SIGNUPS: ${FLAG_DISABLE_SIGNUPS}
    volumes:
      - reactive-resume-data:/app/data
    depends_on:
      reactive-resume-db:
        condition: service_healthy

  reactive-resume-db:
    image: postgres:18.7@sha256:37586cb420551a1d64a424c5d02e93642692499f70919dda80e4bdafbb0a9533
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - reactive-resume-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  reactive-resume-data: {}
  reactive-resume-db: {}
