services:
  pocketbase:
    image: adrianmusante/pocketbase:0.40.5@sha256:bbf907dc8c874d3e8fe1e591e8595f933b460a467e11474b9da47ec03dad54fc
    restart: unless-stopped
    expose:
      - 8090
    environment:
      - POCKETBASE_ADMIN_EMAIL=${ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - POCKETBASE_ADMIN_UPSERT=true
      - POCKETBASE_PORT_NUMBER=8090
    volumes:
      - pocketbase-data:/pocketbase

volumes:
  pocketbase-data: {}
