services:
  open-design:
    image: ghcr.io/nexu-io/od:0.27.1@sha256:e60aec9fb7e07af9f11de58eff62a546c82421d3a24aa57a353b4c2808a1d85c
    restart: unless-stopped
    expose:
      - 7456
    environment:
      NODE_ENV: production
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_API_TOKEN: ${OD_API_TOKEN}
      OD_ALLOWED_ORIGINS: ${OD_ALLOWED_ORIGINS}
      OD_PUBLIC_BASE_URL: ${OD_PUBLIC_BASE_URL}
    volumes:
      - open-design-data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open-design-data: {}
