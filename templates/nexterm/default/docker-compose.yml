services:
  nexterm:
    image: nexterm/aio:1.2.2-BETA@sha256:def6f6a50b48c842d3fbe796ff8e7ce6b8fa54e2d92116a62742859c64f47d7e
    restart: unless-stopped
    expose:
      - 6989
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY: ${TRUST_PROXY}
    volumes:
      - nexterm-data:/app/data

volumes:
  nexterm-data: {}
