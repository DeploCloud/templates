services:
  teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.11.10@sha256:413898b65b5ec9df36b5a548b2065df1dfcc7df944e72332190c6751de0f065b
    restart: unless-stopped
    expose:
      - 3080
    environment:
      TELEPORT_CONFIG_FILE: /etc/teleport/teleport.yaml
    volumes:
      - ./teleport.yaml:/etc/teleport/teleport.yaml:ro
      - teleport-data:/var/lib/teleport
  teleport-gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - teleport

volumes:
  teleport-data: {}
