services:
  databasus:
    image: databasus/databasus:v3.70.1@sha256:f19cdc32f5fe071d67a4d51d41652dbd73111b03afef9444605c0eb788c9ae69
    restart: unless-stopped
    expose:
      - 4005
    environment:
      DATABASUS_URL: ${DATABASUS_URL}
    volumes:
      - databasus-data:/databasus-data
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  databasus-data: {}
