[variables]
db_password = "${password:32}"
redis_password = "${password:32}"
clickhouse_password = "${password:32}"
cookie_secret = "${hash:64}"

[config]

[[config.domains]]
serviceName = "openpanel-proxy"
port = 80
host = "${domain}"

[config.env]
DASHBOARD_URL = "https://${domain}"
POSTGRES_PASSWORD = "${db_password}"
REDIS_PASSWORD = "${redis_password}"
CLICKHOUSE_PASSWORD = "${clickhouse_password}"
COOKIE_SECRET = "${cookie_secret}"
EMAIL_SENDER = "noreply@${domain}"
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_SECURE = "false"
SMTP_USER = ""
SMTP_PASS = ""
RESEND_API_KEY = ""

[[config.mounts]]
filePath = "Caddyfile"
content = """{
	auto_https off
	admin off
	servers {
		trusted_proxies static private_ranges
	}
}

:80 {
	encode gzip

	handle_path /api* {
		reverse_proxy openpanel-api:3000
	}

	reverse_proxy openpanel-dashboard:3000
}
"""

[[config.mounts]]
filePath = "clickhouse/config.xml"
content = """<clickhouse>
    <logger>
        <level>warning</level>
        <console>true</console>
    </logger>
    <keep_alive_timeout>10</keep_alive_timeout>
    <query_thread_log remove="remove"/>
    <query_log remove="remove"/>
    <text_log remove="remove"/>
    <trace_log remove="remove"/>
    <metric_log remove="remove"/>
    <asynchronous_metric_log remove="remove"/>
    <session_log remove="remove"/>
    <part_log remove="remove"/>
    <listen_host>0.0.0.0</listen_host>
    <interserver_listen_host>0.0.0.0</interserver_listen_host>
    <interserver_http_host>openpanel-clickhouse</interserver_http_host>
</clickhouse>
"""

[[config.mounts]]
filePath = "clickhouse/users.xml"
content = """<clickhouse>
    <profiles>
        <default>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
        </default>
    </profiles>
</clickhouse>
"""
