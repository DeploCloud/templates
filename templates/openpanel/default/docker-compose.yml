x-openpanel-env: &openpanel-env
  NODE_ENV: production
  SELF_HOSTED: "true"
  BATCH_SIZE: "5000"
  BATCH_INTERVAL: "10000"
  ALLOW_REGISTRATION: "false"
  ALLOW_INVITATION: "true"
  DATABASE_URL: postgresql://openpanel:${POSTGRES_PASSWORD}@openpanel-db:5432/openpanel?schema=public
  DATABASE_URL_DIRECT: postgresql://openpanel:${POSTGRES_PASSWORD}@openpanel-db:5432/openpanel?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@openpanel-redis:6379
  CLICKHOUSE_URL: http://openpanel:${CLICKHOUSE_PASSWORD}@openpanel-clickhouse:8123/openpanel
  DASHBOARD_URL: ${DASHBOARD_URL}
  API_URL: ${DASHBOARD_URL}/api
  API_URL_SSR: http://openpanel-api:3000
  COOKIE_SECRET: ${COOKIE_SECRET}
  EMAIL_SENDER: ${EMAIL_SENDER}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_SECURE: ${SMTP_SECURE}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  RESEND_API_KEY: ${RESEND_API_KEY}

services:
  openpanel-proxy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      openpanel-api:
        condition: service_healthy
      openpanel-dashboard:
        condition: service_healthy

  openpanel-api:
    image: lindesvard/openpanel-api:2.3.0@sha256:cee4855cd715a7248c5c49090fe93a28ffc505541de20cb238d8884a6bcb9223
    restart: unless-stopped
    command: sh -c "CI=true pnpm -r run migrate:deploy && exec pnpm start"
    expose:
      - 3000
    environment:
      <<: *openpanel-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      openpanel-db:
        condition: service_healthy
      openpanel-redis:
        condition: service_healthy
      openpanel-clickhouse:
        condition: service_healthy

  openpanel-dashboard:
    image: lindesvard/openpanel-dashboard:2.3.0@sha256:b773cf864454a0ec89b2a133b48bf06202880ed650a75cc2f1f5c87aaed1cffa
    restart: unless-stopped
    expose:
      - 3000
    environment:
      <<: *openpanel-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      openpanel-api:
        condition: service_healthy

  openpanel-worker:
    image: lindesvard/openpanel-worker:2.3.0@sha256:b22e247fb6980b820c1a954d0e3d2fe88b3edf40a58aa53329467af239538e80
    restart: unless-stopped
    environment:
      <<: *openpanel-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      openpanel-api:
        condition: service_healthy

  openpanel-db:
    image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openpanel
    volumes:
      - openpanel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpanel -d openpanel"]
      interval: 10s
      timeout: 5s
      retries: 5

  openpanel-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - openpanel-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  openpanel-clickhouse:
    image: clickhouse/clickhouse-server:25.10.2.65@sha256:e019438e1e0539b0d1ce8380b628f1c06c5a0e641f368fc746acf4a8cf48d2f2
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: openpanel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: openpanel
    volumes:
      - openpanel-clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/openpanel.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/openpanel.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user openpanel --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  openpanel-db: {}
  openpanel-redis: {}
  openpanel-clickhouse: {}
