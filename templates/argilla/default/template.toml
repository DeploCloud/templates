[variables]
db_password = "${password:32}"
owner_password = "${password:24}"
owner_api_key = "${secret:40}"
auth_secret_key = "${secret:64}"

[config]
mounts = []

[[config.domains]]
serviceName = "argilla"
port = 6_900
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
OWNER_USERNAME = "admin"
OWNER_PASSWORD = "${owner_password}"
OWNER_API_KEY = "${owner_api_key}"
AUTH_SECRET_KEY = "${auth_secret_key}"
