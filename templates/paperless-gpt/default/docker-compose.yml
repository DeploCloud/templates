services:
  paperless-gpt:
    image: icereed/paperless-gpt:v0.31.0@sha256:d668941a829552cc0eddbc7c22506b3480dfbf61bd0d6eae881ad9fcfe2de70c
    restart: unless-stopped
    expose:
      - 8080
    environment:
      PAPERLESS_BASE_URL: ${PAPERLESS_BASE_URL}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_LANGUAGE: ${LLM_LANGUAGE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GOOGLEAI_API_KEY: ${GOOGLEAI_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OCR_PROVIDER: ${OCR_PROVIDER}
      VISION_LLM_PROVIDER: ${VISION_LLM_PROVIDER}
      VISION_LLM_MODEL: ${VISION_LLM_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - paperless-gpt-config:/app/config
      - paperless-gpt-prompts:/app/prompts
      - paperless-gpt-db:/app/db

  # paperless-gpt has no login, so the public route goes through this basic auth gate
  paperless-gpt-gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    expose:
      - 80
    environment:
      PAPERLESS_GPT_USERNAME: ${PAPERLESS_GPT_USERNAME}
      PAPERLESS_GPT_PASSWORD: ${PAPERLESS_GPT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export PAPERLESS_GPT_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$PAPERLESS_GPT_PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - paperless-gpt

volumes:
  paperless-gpt-config: {}
  paperless-gpt-prompts: {}
  paperless-gpt-db: {}
