services:
  mailcatcher:
    image: sj26/mailcatcher:v0.11.0@sha256:572048324658d2198e0a96785cca4f0260f2c4cadb2cb057bd837b9ee0c60533
    restart: unless-stopped
    command: ["--ip", "0.0.0.0", "--no-quit", "--messages-limit", "${MAILCATCHER_MESSAGES_LIMIT}"]
    expose:
      - 1080
      - 1025
    healthcheck:
      test: ["CMD", "ruby", "-rsocket", "-e", "TCPSocket.new('127.0.0.1', 1080).close"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
