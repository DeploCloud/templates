services:
  leafwiki:
    image: ghcr.io/perber/leafwiki:v0.15.0@sha256:bacd15c0fb12c53d034d80c3cb1828f1eb6177fcac362fe90077d1f7f32e307c
    restart: unless-stopped
    expose:
      - 8080
    environment:
      LEAFWIKI_HOST: 0.0.0.0
      LEAFWIKI_PORT: "8080"
      LEAFWIKI_DATA_DIR: /app/data
      LEAFWIKI_JWT_SECRET: ${LEAFWIKI_JWT_SECRET}
      LEAFWIKI_ADMIN_PASSWORD: ${LEAFWIKI_ADMIN_PASSWORD}
      LEAFWIKI_PUBLIC_URL: ${LEAFWIKI_PUBLIC_URL}
      LEAFWIKI_TRUSTED_PROXY_IPS: ${LEAFWIKI_TRUSTED_PROXY_IPS}
    volumes:
      - leafwiki-data:/app/data

volumes:
  leafwiki-data: {}
