[variables]
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "nexus"
port = 8_081
host = "${domain}"

[config.env]
NEXUS_SECURITY_INITIAL_PASSWORD = "${admin_password}"
INSTALL4J_ADD_VM_PARAMS = "-Xms2703m -Xmx2703m -XX:MaxDirectMemorySize=2703m -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
