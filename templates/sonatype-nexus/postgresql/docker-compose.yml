services:
  nexus:
    image: sonatype/nexus3:3.98.3@sha256:53ca1dc9580a3b616814694a28801bbf59c5e5423ad2d9b41e88cf93962c26b0
    restart: unless-stopped
    stop_grace_period: 2m
    expose:
      - 8081
    environment:
      NEXUS_SECURITY_INITIAL_PASSWORD: ${NEXUS_SECURITY_INITIAL_PASSWORD}
      INSTALL4J_ADD_VM_PARAMS: ${INSTALL4J_ADD_VM_PARAMS}
      NEXUS_DATASTORE_NEXUS_JDBCURL: jdbc:postgresql://sonatype-nexus-db:5432/nexus
      NEXUS_DATASTORE_NEXUS_USERNAME: nexus
      NEXUS_DATASTORE_NEXUS_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      sonatype-nexus-db:
        condition: service_healthy

  sonatype-nexus-db:
    image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    # Nexus keeps a pool of 100 connections open; leave room for backups and admin sessions
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nexus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nexus-data: {}
  nexus-db: {}
