[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "accent"
port = 4_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
CANONICAL_URL = "https://${domain}"
SECRET_KEY_BASE = "${hash:128}"
SIGNING_SALT = "${password:32}"
MACHINE_TRANSLATIONS_VAULT_KEY = "${hash:42}0="
DUMMY_LOGIN_ENABLED = "true"
