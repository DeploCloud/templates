services:
  opik-frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:2.2.150@sha256:cc871ec84279a602e233dc153d1073f685401cfef4c1a2c96bc29762680784d2
    restart: unless-stopped
    expose:
      - 5173
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5173/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      opik-backend:
        condition: service_healthy

  opik-backend:
    image: ghcr.io/comet-ml/opik/opik-backend:2.2.150@sha256:a8bc435a2059c1fe3149620b0556d42e4c355e186af280b3ffabab912835aceb
    restart: unless-stopped
    command: ["bash", "-c", "./run_db_migrations.sh && ./provision_agent_insights_readonly_user.sh && ./entrypoint.sh"]
    expose:
      - 8080
    environment:
      STATE_DB_PROTOCOL: "jdbc:mysql://"
      STATE_DB_URL: "opik-mysql:3306/opik?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: opik
      STATE_DB_PASS: ${MYSQL_PASSWORD}
      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://opik-clickhouse:8123"
      ANALYTICS_DB_MIGRATIONS_USER: opik
      ANALYTICS_DB_MIGRATIONS_PASS: ${CLICKHOUSE_PASSWORD}
      ANALYTICS_DB_PROTOCOL: HTTP
      ANALYTICS_DB_HOST: opik-clickhouse
      ANALYTICS_DB_PORT: "8123"
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USERNAME: opik
      ANALYTICS_DB_PASS: ${CLICKHOUSE_PASSWORD}
      # ponytail: heap capped at 2g instead of upstream's MaxRAMPercentage, which sizes from host RAM without a limit
      JAVA_OPTS: "-Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -Xmx2g"
      REDIS_URL: redis://:${REDIS_PASSWORD}@opik-redis:6379/
      OPIK_ENCRYPTION_KEY: ${OPIK_ENCRYPTION_KEY}
      OPIK_OTEL_SDK_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      IS_MINIO: "true"
      S3_URL: http://opik-minio:9000
      # Python metrics need the separate python-backend, which is not part of this stack
      TOGGLE_PYTHON_EVALUATOR_ENABLED: "false"
      TOGGLE_TRACE_THREAD_PYTHON_EVALUATOR_ENABLED: "false"
      TOGGLE_SPAN_USER_DEFINED_METRIC_PYTHON_ENABLED: "false"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    depends_on:
      opik-mysql:
        condition: service_healthy
      opik-clickhouse:
        condition: service_healthy
      opik-minio:
        condition: service_healthy
      opik-redis:
        condition: service_healthy

  opik-mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: opik
      MYSQL_USER: opik
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - opik-mysql:/var/lib/mysql

  opik-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - opik-redis:/data

  opik-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3-alpine@sha256:1d45e52080e6ed136a6377863046a0e53d69fb0418d799f12e23184ed6460c55
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: opik
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - opik-clickhouse-data:/var/lib/clickhouse
      - opik-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/opik.xml:ro
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/opik.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      opik-zookeeper:
        condition: service_healthy

  opik-zookeeper:
    image: zookeeper:3.9.7@sha256:7654645af057c76db8facc77c5d6fc0749f0f566bdd5c41efe6e3b824d1248c0
    restart: unless-stopped
    environment:
      JVMFLAGS: "-Xmx512m"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - opik-zookeeper-data:/data
      - opik-zookeeper-datalog:/datalog

  opik-minio:
    image: cloudpirates/image-minio:RELEASE.2025-10-15T17-29-55Z-hardened@sha256:8dc02a7e509336c8bbb67962086d691bdcde20a2c9327ed68e5081a681f6dbfc
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/public && exec minio server --console-address ':9090' /data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://localhost:9000 mc ready local"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    volumes:
      - opik-minio:/data

volumes:
  opik-mysql: {}
  opik-redis: {}
  opik-clickhouse-data: {}
  opik-clickhouse-logs: {}
  opik-zookeeper-data: {}
  opik-zookeeper-datalog: {}
  opik-minio: {}
