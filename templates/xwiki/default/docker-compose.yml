services:
  xwiki:
    image: xwiki:18.9.0-postgres-tomcat@sha256:244a5a3712f8604614f70160cb6c635130cdadac703ba83d06ac0cc287d1a9f6
    restart: unless-stopped
    # tini as PID 1 reaps orphaned LibreOffice processes
    init: true
    expose:
      - 8080
    environment:
      DB_HOST: xwiki-db
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - xwiki-data:/usr/local/xwiki
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    depends_on:
      xwiki-db:
        condition: service_healthy

  xwiki-db:
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
    volumes:
      - xwiki-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  xwiki-data: {}
  xwiki-db: {}
