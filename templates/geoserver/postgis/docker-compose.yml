services:
  geoserver:
    image: docker.osgeo.org/geoserver:3.0.2@sha256:5a372d4988116e8f62c71ae5ff6eb8d433967697670fb1dec15379bf476721fe
    restart: unless-stopped
    expose:
      - 8080
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      PROXY_BASE_URL: ${PROXY_BASE_URL}
      GEOSERVER_CSRF_WHITELIST: ${GEOSERVER_CSRF_WHITELIST}
      ROOT_WEBAPP_REDIRECT: "true"
      RUN_UNPRIVILEGED: "true"
      SKIP_DEMO_DATA: ${SKIP_DEMO_DATA}
      EXTRA_JAVA_OPTS: ${EXTRA_JAVA_OPTS}
      POSTGRES_JNDI_ENABLED: "true"
      POSTGRES_JNDI_RESOURCE_NAME: jdbc/postgres
      POSTGRES_HOST: geoserver-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USERNAME: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - geoserver-data:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    depends_on:
      geoserver-db:
        condition: service_healthy

  geoserver-db:
    image: postgis/postgis:18-3.7-alpine@sha256:e1a18d273904ee86646d6d1379f318f74864a017b5aad710ed14a692212651cb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - geoserver-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  geoserver-data: {}
  geoserver-db: {}
