[config]
mounts = []

[[config.domains]]
serviceName = "forgejo"
port = 3_000
host = "${domain}"

[config.env]
USER_UID = "1000"
USER_GID = "1000"
FORGEJO__database__DB_TYPE = "sqlite3"
FORGEJO__database__PATH = "/data/gitea/data/forgejo.db"
FORGEJO__server__ROOT_URL = "https://${domain}/"
FORGEJO__server__DOMAIN = "${domain}"
FORGEJO__server__DISABLE_SSH = "true"
