[variables]
admin_password = "${password:24}"
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "healthchecks"
port = 8_000
host = "${domain}"

[config.env]
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "${admin_password}"
SECRET_KEY = "${secret:50}"
SITE_ROOT = "https://${domain}"
SITE_NAME = "Healthchecks"
PING_EMAIL_DOMAIN = "${domain}"
RP_ID = "${domain}"
REGISTRATION_OPEN = "False"
GUNICORN_WORKERS = "2"
DB_NAME = "hc"
DB_USER = "hc"
DB_PASSWORD = "${db_password}"
DEFAULT_FROM_EMAIL = "healthchecks@${domain}"
EMAIL_HOST = ""
EMAIL_PORT = "587"
EMAIL_HOST_USER = ""
EMAIL_HOST_PASSWORD = ""
EMAIL_USE_TLS = "True"
