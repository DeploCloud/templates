[variables]
db_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "review-board-nginx"
port = 80
host = "${domain}"

[config.env]
DOMAIN = "${domain}"
DATABASE_PASSWORD = "${db_password}"
NUM_WORKERS = "2"

[[config.mounts]]
filePath = "nginx.conf"
content = """map $http_x_forwarded_proto $rb_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10m;

    # Docker DNS, so a recreated backend is picked up without reloading nginx
    resolver 127.0.0.11 valid=10s;
    set $reviewboard http://review-board:8080;

    root /var/www/reviewboard/htdocs;

    location / {
        proxy_pass $reviewboard;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $rb_scheme;
        proxy_read_timeout 120;
    }

    location /media/ {
        alias /var/www/reviewboard/htdocs/media/;
        expires max;
        add_header Cache-Control public;
    }

    location /static/ {
        alias /var/www/reviewboard/htdocs/static/;
        expires max;
        add_header Cache-Control public;
    }

    location /errordocs/ {
        alias /var/www/reviewboard/htdocs/errordocs/;
        expires 5d;
    }

    location = /robots.txt {
        alias /var/www/reviewboard/htdocs/robots.txt;
    }
}
"""
