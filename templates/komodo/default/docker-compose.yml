services:
  komodo:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
    init: true
    restart: unless-stopped
    expose:
      - 9120
    environment:
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_DATABASE_ADDRESS: komodo-db:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      TZ: ${TZ}
    volumes:
      - komodo-keys:/config/keys
      - komodo-backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9120/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      komodo-db:
        condition: service_healthy

  komodo-db:
    image: mongo:8.0.38@sha256:bdc216e9d5a6ec2cfdac789b5832fdab64cd32055f59885cae918a92de63c361
    labels:
      komodo.skip: "true"
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
    volumes:
      - komodo-mongo-data:/data/db
      - komodo-mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  komodo-keys: {}
  komodo-backups: {}
  komodo-mongo-data: {}
  komodo-mongo-config: {}
