services:
  komodo:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
    init: true
    restart: unless-stopped
    expose:
      - 9120
    environment:
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_DATABASE_ADDRESS: komodo-ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      TZ: ${TZ}
    volumes:
      - komodo-keys:/config/keys
      - komodo-backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9120/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      komodo-ferretdb:
        condition: service_healthy

  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
    labels:
      komodo.skip: "true"
    restart: unless-stopped
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@komodo-db:5432/postgres
    volumes:
      - komodo-ferretdb-state:/state
    healthcheck:
      test: ["CMD", "/ferretdb", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      komodo-db:
        condition: service_healthy

  komodo-db:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7
    labels:
      komodo.skip: "true"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - komodo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  komodo-keys: {}
  komodo-backups: {}
  komodo-ferretdb-state: {}
  komodo-postgres-data: {}
