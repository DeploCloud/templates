services:
  azuracast:
    image: ghcr.io/azuracast/azuracast:0.24.1@sha256:ed517bef827c9f074370d48f61d1cbba5bb05f40dd04b46b031ec107443583a2
    restart: unless-stopped
    expose:
      - 80
    environment:
      APPLICATION_ENV: production
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      ENABLE_WEB_UPDATER: "false"
      TZ: ${TZ}
    volumes:
      - station-data:/var/azuracast/stations
      - backups:/var/azuracast/backups
      - db-data:/var/lib/mysql
      - www-uploads:/var/azuracast/storage/uploads
      - shoutcast2-install:/var/azuracast/storage/shoutcast2
      - stereo-tool-install:/var/azuracast/storage/stereo_tool
      - rsas-install:/var/azuracast/storage/rsas
      - geolite-install:/var/azuracast/storage/geoip
      - sftpgo-data:/var/azuracast/storage/sftpgo
      - acme:/var/azuracast/storage/acme
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  station-data: {}
  backups: {}
  db-data: {}
  www-uploads: {}
  shoutcast2-install: {}
  stereo-tool-install: {}
  rsas-install: {}
  geolite-install: {}
  sftpgo-data: {}
  acme: {}
