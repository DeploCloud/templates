[variables]
postgres_password = "${password:32}"
minio_access_key = "${username}"
minio_secret_key = "${password:32}"
gotrue_admin_password = "${password:32}"
gotrue_jwt_secret = "${hash:64}"

[config]
[[config.mounts]]
filePath = "nginx.conf"
content = """
events {
    worker_connections 1024;
}

http {
    map $http_x_forwarded_proto $appflowy_request_scheme {
        default $scheme;
        https https;
    }
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $request $appflowy_access_loggable {
        default 1;
        ~*^[^[:space:]]+[[:space:]]+(?:https?://[^/[:space:]]+)?/api/workspace/public-form/ 0;
        ~*^[^[:space:]]+[[:space:]]+(?:https?://[^/[:space:]]+)?/form/ 0;
        ~*^[^[:space:]]+[[:space:]]+(?:https?://[^/[:space:]]+)?/minio-api/ 0;
    }
    map $uri $appflowy_form_object {
        default 0;
        ~^/minio-api/[^/]+/form-uploads/ 1;
    }

    map $appflowy_form_object $appflowy_form_object_client {
        default "";
        1 $binary_remote_addr;
    }

    map "$appflowy_request_scheme:$appflowy_form_object" $appflowy_insecure_form_object {
        default 0;
        "http:1" 1;
    }

    limit_req_zone $binary_remote_addr zone=appflowy_public_form_per_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=appflowy_public_form_connections_per_ip:1m;
    limit_req_zone $appflowy_form_object_client zone=appflowy_form_objects_per_ip:10m rate=20r/s;
    limit_conn_zone $appflowy_form_object_client zone=appflowy_form_object_connections_per_ip:1m;

    server {
        listen 8080;
        location = /stub_status {
            stub_status;
        }
    }

    server {

        listen 80;
        access_log /var/log/nginx/access.log combined if=$appflowy_access_loggable;
        client_max_body_size 10M;

        underscores_in_headers on;
        set $appflowy_cloud_backend "http://appflowy-cloud:8000";
        set $gotrue_backend "http://gotrue:9999";
        set $admin_frontend_backend "http://admin-frontend:3000";
        set $appflowy_web_backend "http://appflowy-web:80";
        set $minio_backend "http://minio:9001";
        set $minio_api_backend "http://minio:9000";
        set $minio_internal_host "minio:9000";
        location /gotrue/ {
            proxy_pass $gotrue_backend;

            rewrite ^/gotrue(/.*)$ $1 break;
            proxy_set_header Host $http_host;
            proxy_pass_request_headers on;
        }
        location /ws {
            proxy_pass $appflowy_cloud_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $appflowy_request_scheme;
            proxy_read_timeout 86400s;
        }
        location ^~ /api/workspace/public-form/ {
            if ($appflowy_request_scheme != https) {
                return 403;
            }

            proxy_pass $appflowy_cloud_backend;
            access_log off;
            error_log /dev/null;

            client_max_body_size 256k;
            client_body_timeout 10s;
            limit_req zone=appflowy_public_form_per_ip burst=10 nodelay;
            limit_conn appflowy_public_form_connections_per_ip 10;
            limit_req_status 429;
            limit_conn_status 429;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 40s;

            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $appflowy_request_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location ~* ^/api/workspace/public-form(?:/|$) {
            access_log off;
            error_log /dev/null;
            return 404;
        }

        location /api {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;

            location ~* ^/api/workspace/([a-zA-Z0-9_-]+)/publish$ {
                proxy_pass $appflowy_cloud_backend;
                proxy_request_buffering off;
                client_max_body_size 256M;
            }
            location /api/chat {
                proxy_pass $appflowy_cloud_backend;

                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding on;
                proxy_buffering off;
                proxy_cache off;

                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
            }

            location /api/import {
                proxy_pass $appflowy_cloud_backend;
                proxy_set_header X-Request-Id $request_id;
                proxy_set_header Host $http_host;
                proxy_read_timeout 600s;
                proxy_connect_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_cache off;
                client_max_body_size 2G;
            }
        }
        location /scim {
            if ($appflowy_request_scheme != https) {
                return 403;
            }
            access_log off;
            error_log /dev/null;
            proxy_pass $appflowy_cloud_backend;
        }
        location /minio/ {
            proxy_pass $minio_backend;

            rewrite ^/minio/(.*) /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $appflowy_request_scheme;
            proxy_set_header X-NginX-Proxy true;
            real_ip_header X-Real-IP;

            proxy_connect_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            chunked_transfer_encoding off;
        }
        location ^~ /minio-api/ {
            access_log off;
            error_log /dev/null;
            if ($appflowy_insecure_form_object) {
                return 403;
            }

            limit_req zone=appflowy_form_objects_per_ip burst=40 nodelay;
            limit_conn appflowy_form_object_connections_per_ip 20;
            limit_req_status 429;
            limit_conn_status 429;

            proxy_pass $minio_api_backend;
            proxy_set_header Host $minio_internal_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $appflowy_request_scheme;
            proxy_set_header Forwarded "";

            rewrite ^/minio-api/(.*) /$1 break;

            proxy_connect_timeout 300s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            client_max_body_size 0;
        }

        location ~* ^/minio-api(?:/|$) {
            access_log off;
            error_log /dev/null;
            return 404;
        }

        location /ai/ {
            proxy_pass $appflowy_cloud_backend;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $appflowy_request_scheme;
        }
        location /console {
            proxy_pass $admin_frontend_backend;

            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $appflowy_request_scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $appflowy_request_scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
        location ~* ^/form(?:/|$) {
            if ($appflowy_request_scheme != https) {
                return 403;
            }

            access_log off;
            error_log /dev/null;
            rewrite ^ /app? break;
            proxy_pass $appflowy_web_backend;
            proxy_set_header Referer "";
            proxy_set_header X-Scheme $appflowy_request_scheme;
            proxy_set_header Host $host;
            proxy_hide_header 'Referrer-Policy';
            add_header 'Referrer-Policy' 'no-referrer' always;
        }
        location / {
            proxy_pass $appflowy_web_backend;
            proxy_set_header X-Scheme $appflowy_request_scheme;
            proxy_set_header Host $host;
        }
    }

}
"""

[[config.domains]]
serviceName = "appflowy-gateway"
port = 80
host = "${domain}"

[config.env]
POSTGRES_PASSWORD = "${postgres_password}"
MINIO_ROOT_USER = "${minio_access_key}"
MINIO_ROOT_PASSWORD = "${minio_secret_key}"
GOTRUE_ADMIN_EMAIL = "${email}"
GOTRUE_ADMIN_PASSWORD = "${gotrue_admin_password}"
GOTRUE_JWT_SECRET = "${gotrue_jwt_secret}"
APPFLOWY_BASE_URL = "https://${domain}"
APPFLOWY_WEBSOCKET_BASE_URL = "wss://${domain}/ws/v2"
APPFLOWY_DATABASE_URL = "postgresql://appflowy:${postgres_password}@postgres:5432/appflowy"
APPFLOWY_REDIS_URI = "redis://redis:6379"
GOTRUE_DATABASE_URL = "postgresql://appflowy:${postgres_password}@postgres:5432/appflowy?search_path=auth"
API_EXTERNAL_URL = "https://${domain}/gotrue"
ADMIN_FRONTEND_PATH_PREFIX = "/console"
APPFLOWY_S3_ACCESS_KEY = "${minio_access_key}"
APPFLOWY_S3_SECRET_KEY = "${minio_secret_key}"
APPFLOWY_S3_BUCKET = "appflowy"
APPFLOWY_S3_REGION = "us-east-1"
APPFLOWY_S3_MINIO_URL = "http://minio:9000"
APPFLOWY_S3_PRESIGNED_URL_ENDPOINT = "https://${domain}/minio-api"
APPFLOWY_SEARCH_SERVICE_URL = "http://appflowy-search:4002"
AI_ENABLED = "true"
AI_SERVER_HOST = "appflowy-ai"
AI_SERVER_PORT = "5001"
AI_OPENAI_API_KEY = ""

APPFLOWY_S3_USE_MINIO = "true"
APPFLOWY_S3_CREATE_BUCKET = "true"
APPFLOWY_ACCESS_CONTROL = "true"
APPFLOWY_DATABASE_MAX_CONNECTIONS = "40"
APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS = "10"
APPFLOWY_MAILER_SMTP_HOST = ""
APPFLOWY_MAILER_SMTP_PORT = "465"
APPFLOWY_MAILER_SMTP_USERNAME = ""
APPFLOWY_MAILER_SMTP_EMAIL = ""
APPFLOWY_MAILER_SMTP_PASSWORD = ""
APPFLOWY_MAILER_SMTP_TLS_KIND = "wrapper"
AZURE_OPENAI_API_KEY = ""
AZURE_OPENAI_ENDPOINT = ""
AZURE_OPENAI_API_VERSION = ""
ASSEMBLYAI_API_KEY = ""
ASSEMBLYAI_API_BASE = "https://api.assemblyai.com/v2"
ASSEMBLYAI_STREAMING_API_BASE = "https://streaming.assemblyai.com/v3"
APPFLOWY_INDEXER_DATABASE_ENABLED = "false"
APPFLOWY_KEYWORD_SEARCH_ENABLED = "true"
SIGNUP_WHITELIST_ENABLED = "false"
GUEST_INVITES_REQUIRE_ADMIN_APPROVAL = "false"
