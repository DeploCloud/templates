services:
  passbolt:
    image: passbolt/passbolt:5.18.0-2-ce@sha256:d9cdf2e42c5401ebc889cba8c4435c058da876eebcaedab9e509c4bc1c34792f
    restart: unless-stopped
    expose:
      - 80
    environment:
      APP_FULL_BASE_URL: ${APP_FULL_BASE_URL}
      DATASOURCES_DEFAULT_HOST: passbolt-db
      DATASOURCES_DEFAULT_USERNAME: ${DB_USER}
      DATASOURCES_DEFAULT_PASSWORD: ${DB_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: ${DB_NAME}
      SECURITY_SALT: ${SECURITY_SALT}
      PASSBOLT_SSL_FORCE: "false"
    volumes:
      - passbolt-gpg:/etc/passbolt/gpg
      - passbolt-jwt:/etc/passbolt/jwt
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck/status.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    depends_on:
      passbolt-db:
        condition: service_healthy

  passbolt-db:
    image: mariadb:10.11.19@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - passbolt-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  passbolt-gpg: {}
  passbolt-jwt: {}
  passbolt-db: {}
