services:
  nginx:
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-html:/usr/share/nginx/html

volumes:
  nginx-html: {}
