[config]

[[config.domains]]
serviceName = "nginx"
port = 80
host = "${domain}"

[[config.mounts]]
filePath = "default.conf"
content = """# HTTPS is terminated by the reverse proxy in front, so NGINX only listens on 80
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;

    # relative redirects keep the https:// scheme seen by the browser
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # location /api/ {
    #     proxy_pass http://other-service:8080/;
    # }

    error_page 500 502 503 504 /50x.html;
}
"""
