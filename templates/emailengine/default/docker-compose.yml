services:
  emailengine:
    image: postalsys/emailengine:v2.90.0@sha256:cbea7143a470e657579efa0028fd55acac23cbe0a92f56c7ff531fef46a47ede
    restart: unless-stopped
    expose:
      - 3000
    environment:
      EENGINE_SECRET: ${EENGINE_SECRET}
      EENGINE_REDIS: ${EENGINE_REDIS}
      EENGINE_LOG_LEVEL: ${EENGINE_LOG_LEVEL}
    healthcheck:
      test: ["CMD", "node", "/emailengine/bin/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      emailengine-redis:
        condition: service_healthy

  emailengine-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1 300 10 60 10000"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - emailengine-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  emailengine-redis: {}
