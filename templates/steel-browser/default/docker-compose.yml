services:
  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest@sha256:e10ce7adecc94d000b28d256c45ffa113dc78b4fc8d38de5f7940b139c3a220d
    restart: unless-stopped
    expose:
      - 3000
    environment:
      DOMAIN: ${DOMAIN}
      USE_SSL: ${USE_SSL}
      LOG_STORAGE_ENABLED: "true"
      LOG_STORAGE_PATH: /data/logs/browser-logs.duckdb
    volumes:
      - steel-browser-logs:/data/logs
      - steel-browser-exports:/tmp/steel-browser-exports
      - steel-browser-profile:/app/api/user-data-dir
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Steel Browser has no authentication, so every public request passes this gateway
  steel-browser-gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    expose:
      - 80
    environment:
      STEEL_API_KEY: ${STEEL_API_KEY}
      STEEL_UI_USERNAME: ${STEEL_UI_USERNAME}
      STEEL_UI_PASSWORD: ${STEEL_UI_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export STEEL_UI_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$STEEL_UI_PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      steel-browser:
        condition: service_healthy

volumes:
  steel-browser-logs: {}
  steel-browser-exports: {}
  steel-browser-profile: {}
