[variables]
db_password = "${password:32}"
edge_domain = "edge.${domain}"

[config]
mounts = []

[[config.domains]]
serviceName = "defguard"
port = 8_000
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "defguard-edge"
port = 8_080
host = "${edge_domain}"

[config.env]
DB_PASSWORD = "${db_password}"
DEFGUARD_LOG_LEVEL = "info"
EDGE_ADOPTION_TIMEOUT = "60"
