services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.3.1@sha256:352e42dec74ecfd68d13bb198fbc6d9346e3a8c55003026e1814e59319a2176d
    restart: unless-stopped
    expose:
      - 6868
    volumes:
      - profilarr-config:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      ORIGIN: ${ORIGIN}
      PARSER_HOST: profilarr-parser
      PARSER_PORT: "5000"
    depends_on:
      profilarr-parser:
        condition: service_healthy

  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:2.3.1@sha256:234084df7037e76b98c66f5ab220dc0d10ef8f34145ded57b9af257f057bdda6
    restart: unless-stopped
    expose:
      - 5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  profilarr-config: {}
