services:
  bugsink:
    image: bugsink/bugsink:2.6.3@sha256:d19378dc3ad8fac46b2d554019540e84d607c176b3e0774a10c55458f1288fa0
    restart: unless-stopped
    expose:
      - 8000
    environment:
      PORT: "8000"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@bugsink-db:5432/${DB_NAME}
      CREATE_SUPERUSER: ${ADMIN_EMAIL}:${ADMIN_PASSWORD}
      BASE_URL: ${BASE_URL}
      BEHIND_HTTPS_PROXY: "true"
      USE_X_REAL_IP: "true"
      TIME_ZONE: ${TIME_ZONE}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health/ready\").raise_for_status()'"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on:
      bugsink-db:
        condition: service_healthy

  bugsink-db:
    image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bugsink-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bugsink-db: {}
