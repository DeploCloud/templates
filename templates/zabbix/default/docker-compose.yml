services:
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.4.16@sha256:911763cc016d7c3d3e2c085a08e82333e6c74813fb42da2fe058a7fc91865aa8
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    expose:
      - 10051
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${DB_PASSWORD}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.4.16@sha256:5f060c3b3696a24d9946d445a0e0a5f77d38afb16047bdfad67f46a8bdba2c26
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
      zabbix-db:
        condition: service_healthy
    expose:
      - 8080
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${DB_PASSWORD}
      PHP_TZ: Europe/Rome

  zabbix-db:
    image: mysql:8.4-oracle@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - zabbix-database:/var/lib/mysql

volumes:
  zabbix-database: {}
