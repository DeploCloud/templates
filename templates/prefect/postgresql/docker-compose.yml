services:
  prefect:
    image: prefecthq/prefect:3.9.3-python3.12@sha256:1f32e854effefa290527f87a0a10346f6f84ce31047d0e3e5a4d4210d6450a30
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    expose:
      - 4200
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD}@prefect-db:5432/prefect
      PREFECT_SERVER_API_AUTH_STRING: ${PREFECT_SERVER_API_AUTH_STRING}
      PREFECT_SERVER_UI_API_URL: ${PREFECT_SERVER_UI_API_URL}
      PREFECT_UI_URL: ${PREFECT_UI_URL}
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      prefect-db:
        condition: service_healthy

  prefect-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prefect
    volumes:
      - prefect-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  prefect-data: {}
  prefect-db: {}
