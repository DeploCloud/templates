services:
  globaleaks:
    image: globaleaks/globaleaks:v5.0.101@sha256:ac1b314bf78d0b2f862aa60d3b29049a4aaf0124144b87aa632098d0df38164e
    restart: unless-stopped
    expose:
      - 8443
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/globaleaks:uid=1000,gid=1000,mode=0700
      - /tmp:mode=1777
    volumes:
      - globaleaks-data:/var/globaleaks
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s

  # GlobaLeaks redirects every plain HTTP request to HTTPS, so the router reaches it over its own TLS port
  globaleaks-proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      globaleaks:
        condition: service_healthy

volumes:
  globaleaks-data: {}
