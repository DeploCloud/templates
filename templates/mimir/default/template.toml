[config]

[[config.domains]]
serviceName = "mimir"
port = 8_080
host = "${domain}"
primary = true

[[config.mounts]]
filePath = "mimir.yaml"
content = """multitenancy_enabled: false

server:
  http_listen_port: 8080
  log_level: info

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

ruler:
  rule_path: /data/ruler

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

activity_tracker:
  filepath: /data/metrics-activity.log

limits:
  # 0s keeps blocks forever; set e.g. 8760h to cap retention
  compactor_blocks_retention_period: 0s

usage_stats:
  enabled: false
"""
