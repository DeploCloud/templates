services:
  archivebox:
    image: archivebox/archivebox:0.9.77@sha256:f63170551ec48d7aa087c71e2d093156dbf4b4ed8680e2f97f22483e3bc71e55
    restart: unless-stopped
    expose:
      - 5797
    environment:
      BASE_URL: ${BASE_URL}
      SERVER_SECURITY_MODE: ${SERVER_SECURITY_MODE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_ADD_VIEW: ${PUBLIC_ADD_VIEW}
      ARCHIVEDOTORG_ENABLED: ${ARCHIVEDOTORG_ENABLED}
    volumes:
      - archivebox-data:/data
    shm_size: 1gb
    pids_limit: 2048
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:5797/health/ | grep -q OK"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 120s

volumes:
  archivebox-data: {}
