[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "tracearr"
port = 3_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
JWT_SECRET = "${hash:64}"
COOKIE_SECRET = "${hash:64}"
BETTER_AUTH_SECRET = "${hash:64}"
CLAIM_CODE = "${hash:12}"
TRUST_PROXY = "true"
TZ = "UTC"
LOG_LEVEL = "info"
