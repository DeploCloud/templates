services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.1@sha256:9d0b64776c694f018c0ca06faf52105a33ca376024f46bb58e6ab0e2b728bb61
    restart: unless-stopped
    expose:
      - 7745
    environment:
      HBOX_LOG_LEVEL: info
      HBOX_LOG_FORMAT: text
      HBOX_WEB_MAX_UPLOAD_SIZE: "${HBOX_WEB_MAX_UPLOAD_SIZE}"
      HBOX_OPTIONS_ALLOW_ANALYTICS: "false"
      HBOX_OPTIONS_ALLOW_REGISTRATION: "${HBOX_OPTIONS_ALLOW_REGISTRATION}"
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_OPTIONS_HOSTNAME: "${HBOX_OPTIONS_HOSTNAME}"
      HBOX_AUTH_API_KEY_PEPPER: "${HBOX_AUTH_API_KEY_PEPPER}"
      HBOX_DATABASE_DRIVER: postgres
      HBOX_DATABASE_HOST: homebox-db
      HBOX_DATABASE_PORT: "5432"
      HBOX_DATABASE_USERNAME: "${DB_USER}"
      HBOX_DATABASE_PASSWORD: "${DB_PASSWORD}"
      HBOX_DATABASE_DATABASE: "${DB_NAME}"
      HBOX_DATABASE_SSL_MODE: disable
    volumes:
      - homebox-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:7745/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      homebox-db:
        condition: service_healthy

  homebox-db:
    image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - homebox-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  homebox-data: {}
  homebox-db: {}
