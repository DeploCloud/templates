services:
  joplin:
    image: joplin/server:3.7.2@sha256:3f7b852959aac38da10e3a451823bf149cbae6e74d8258db5b6e6e7f0db50c26
    restart: unless-stopped
    expose:
      - 22300
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      APP_PORT: ${APP_PORT}
    volumes:
      - joplin-data:/home/joplin/data

volumes:
  joplin-data: {}
