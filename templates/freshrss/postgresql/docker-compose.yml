services:
  freshrss:
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    restart: unless-stopped
    depends_on:
      freshrss-db:
        condition: service_healthy
    expose:
      - 80
    environment:
      TZ: ${TZ}
      CRON_MIN: "3,33"
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url https://${FRESHRSS_DOMAIN}
        --db-base freshrss
        --db-host freshrss-db
        --db-password ${DB_PASSWORD}
        --db-type pgsql
        --db-user freshrss
        --default-user admin
        --language en
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD}
        --email ${ADMIN_EMAIL}
        --language en
        --password ${ADMIN_PASSWORD}
        --user admin
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - freshrss-extensions:/var/www/FreshRSS/extensions

  freshrss-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshrss -d freshrss"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - freshrss-database:/var/lib/postgresql/data

volumes:
  freshrss-data: {}
  freshrss-extensions: {}
  freshrss-database: {}
