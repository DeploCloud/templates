[variables]
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "fireshare"
port = 80
host = "${domain}"

[config.env]
ADMIN_USERNAME = "fireshare"
ADMIN_PASSWORD = "${admin_password}"
DOMAIN = "${domain}"
MINUTES_BETWEEN_VIDEO_SCANS = "5"
ENABLE_TRANSCODING = "false"
TZ = "UTC"
SECURE_COOKIES = "true"
LOGIN_IP_WHITELIST_TRUSTED_PROXIES = "2"
