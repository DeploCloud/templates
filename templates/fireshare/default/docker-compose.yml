services:
  fireshare:
    image: shaneisrael/fireshare:1.9.4-lite@sha256:f87bd7f5b88ef40f0c09d00b48bf2e0014202f7764e9ec6d8a6e1f008f126011
    restart: unless-stopped
    expose:
      - 80
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DOMAIN: ${DOMAIN}
      MINUTES_BETWEEN_VIDEO_SCANS: ${MINUTES_BETWEEN_VIDEO_SCANS}
      ENABLE_TRANSCODING: ${ENABLE_TRANSCODING}
      TZ: ${TZ}
      SECURE_COOKIES: ${SECURE_COOKIES}
      LOGIN_IP_WHITELIST_TRUSTED_PROXIES: ${LOGIN_IP_WHITELIST_TRUSTED_PROXIES}
    volumes:
      - fireshare-data:/data
      - fireshare-processed:/processed
      - fireshare-videos:/videos
      - fireshare-images:/images

volumes:
  fireshare-data: {}
  fireshare-processed: {}
  fireshare-videos: {}
  fireshare-images: {}
