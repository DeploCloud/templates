services:
  serpbear:
    image: towfiqi/serpbear:3.1.2@sha256:7a2e29bfe682082642be1e0fe0a0d7b561470427d25a4afd25eca1e7223b993b
    restart: unless-stopped
    expose:
      - 3000
    environment:
      USER_NAME: ${USER_NAME}
      PASSWORD: ${PASSWORD}
      SECRET: ${SECRET}
      APIKEY: ${APIKEY}
      SESSION_DURATION: ${SESSION_DURATION}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    volumes:
      - serpbear-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  serpbear-data: {}
