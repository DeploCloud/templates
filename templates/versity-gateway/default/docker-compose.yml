services:
  versitygw:
    image: ghcr.io/versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
    restart: unless-stopped
    expose:
      - 7070
      - 8080
    environment:
      ROOT_ACCESS_KEY: ${ROOT_ACCESS_KEY}
      ROOT_SECRET_KEY: ${ROOT_SECRET_KEY}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_PORT: ":7070"
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
      VGW_WEBUI_PORT: ":8080"
      VGW_WEBUI_GATEWAYS: ${VGW_WEBUI_GATEWAYS}
      VGW_CORS_ALLOW_ORIGIN: ${VGW_CORS_ALLOW_ORIGIN}
    volumes:
      - versitygw-s3:/data/s3
      - versitygw-versioning:/data/versioning
      - versitygw-iam:/data/iam

volumes:
  versitygw-s3: {}
  versitygw-versioning: {}
  versitygw-iam: {}
