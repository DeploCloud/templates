services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:1.3.2@sha256:16be075c5517b5ceab201d0105938c1a890f5b315bf185fdfa98d47f12f6bd03
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - 8000
    environment:
      TZ: ${TZ}
    volumes:
      - bambuddy-data:/app/data
      - bambuddy-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  bambuddy-data: {}
  bambuddy-logs: {}
