services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:1.3.2@sha256:16be075c5517b5ceab201d0105938c1a890f5b315bf185fdfa98d47f12f6bd03
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - 8000
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql+asyncpg://bambuddy:${DB_PASSWORD}@bambuddy-db:5432/bambuddy
    volumes:
      - bambuddy-data:/app/data
      - bambuddy-logs:/app/logs
    depends_on:
      bambuddy-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  bambuddy-db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_USER: bambuddy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bambuddy
    volumes:
      - bambuddy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambuddy -d bambuddy"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  bambuddy-data: {}
  bambuddy-logs: {}
  bambuddy-postgres: {}
