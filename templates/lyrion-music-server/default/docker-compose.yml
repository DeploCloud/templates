services:
  lyrion:
    image: lmscommunity/lyrionmusicserver:9.1.1@sha256:f7bb1d01d54c7eae0f382414491a5b98290014f0e9877b2cbb7484e0538ce1a4
    restart: unless-stopped
    expose:
      - 9000
    environment:
      TZ: ${TZ}
      LMS_USERNAME: ${LMS_USERNAME}
      LMS_PASSWORD: ${LMS_PASSWORD}
    volumes:
      - lyrion-config:/config
      - lyrion-music:/music
      - lyrion-playlists:/playlist
      # upstream runs this hook as root before the server starts
      - ./custom-init.sh:/config/custom-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  lyrion-config: {}
  lyrion-music: {}
  lyrion-playlists: {}
