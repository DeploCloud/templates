services:
  plex:
    image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
    restart: unless-stopped
    hostname: plex
    expose:
      - 32400
    environment:
      TZ: ${TZ}
      PLEX_CLAIM: ${PLEX_CLAIM}
      ADVERTISE_IP: ${ADVERTISE_IP}
    volumes:
      - plex-config:/config
      - plex-transcode:/transcode
      - plex-media:/data

volumes:
  plex-config: {}
  plex-transcode: {}
  plex-media: {}
