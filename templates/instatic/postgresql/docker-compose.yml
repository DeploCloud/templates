services:
  instatic:
    image: ghcr.io/corebunch/instatic:0.0.22@sha256:2fe8a5e6313cfca9a2a56a5c1bf4933cd69827526d6dc6810df12120b64fec04
    restart: unless-stopped
    expose:
      - 3001
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://instatic:${POSTGRES_PASSWORD}@instatic-db:5432/instatic
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/dist
      RUNTIME_CACHE_DIR: /app/data/runtime-cache
      INSTATIC_SECRET_KEY: ${INSTATIC_SECRET_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
    volumes:
      - instatic-data:/app/data
      - instatic-uploads:/app/uploads
    depends_on:
      instatic-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  instatic-db:
    image: postgres:16.16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    restart: unless-stopped
    environment:
      POSTGRES_DB: instatic
      POSTGRES_USER: instatic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - instatic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instatic -d instatic"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  instatic-data:
  instatic-uploads:
  instatic-postgres:
