services:
  instatic:
    image: ghcr.io/corebunch/instatic:0.0.22@sha256:2fe8a5e6313cfca9a2a56a5c1bf4933cd69827526d6dc6810df12120b64fec04
    restart: unless-stopped
    expose:
      - 3001
    environment:
      PORT: "3001"
      DATABASE_URL: sqlite:/app/data/cms.db
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/dist
      RUNTIME_CACHE_DIR: /app/data/runtime-cache
      INSTATIC_SECRET_KEY: ${INSTATIC_SECRET_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
    volumes:
      - instatic-data:/app/data
      - instatic-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  instatic-data:
  instatic-uploads:
