[variables]
admin_password = "${password:24}"
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "linkding"
port = 9_090
host = "${domain}"

[config.env]
LD_SUPERUSER_NAME = "admin"
LD_SUPERUSER_PASSWORD = "${admin_password}"
LD_CSRF_TRUSTED_ORIGINS = "https://${domain}"
LD_DB_PASSWORD = "${db_password}"
