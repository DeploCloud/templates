services:
  isso:
    image: ghcr.io/isso-comments/isso:0.14.0@sha256:8e813ff52004f39c2c08237994450d3760515c4c6fa32faf61431bb280578e4e
    restart: unless-stopped
    expose:
      - 8080
    environment:
      ISSO_HOST: ${ISSO_HOST}
      ISSO_ADMIN_PASSWORD: ${ISSO_ADMIN_PASSWORD}
    volumes:
      - isso-db:/db
      - ./isso.cfg:/config/isso.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  isso-db: {}
