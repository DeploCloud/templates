[variables]
admin_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "isso"
port = 8_080
host = "${domain}"

[config.env]
ISSO_HOST = "https://${domain}"
ISSO_ADMIN_PASSWORD = "${admin_password}"

[[config.mounts]]
filePath = "isso.cfg"
content = """[general]
dbpath = /db/comments.db
host = $ISSO_HOST

[server]
public-endpoint = https://${domain}

[admin]
enabled = true
password = $ISSO_ADMIN_PASSWORD
"""

