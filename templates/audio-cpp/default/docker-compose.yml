services:
  audio-cpp:
    image: ghcr.io/0xshug0/audio.cpp:full-cpu-20261115-0a71e38@sha256:df639d15789029dc2ad958f6137958d1afc62510604f30dc5d1de91f18e3d38c
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - server
      - --ui
      - --ui-management
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --backend
      - cpu
      - --models-root
      - /app/models
      - --threads
      - ${AUDIOCPP_THREADS}
      - --max-loaded-models
      - "1"
    expose:
      - 8080
    environment:
      HF_TOKEN: ${HF_TOKEN}
    volumes:
      - audio-cpp-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # the server has no login, so the public route goes through this basic auth gate
  audio-cpp-gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    expose:
      - 80
    environment:
      AUDIOCPP_USERNAME: ${AUDIOCPP_USERNAME}
      AUDIOCPP_PASSWORD: ${AUDIOCPP_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - export AUDIOCPP_PASSWORD_HASH="$$(caddy hash-password --plaintext "$$AUDIOCPP_PASSWORD")" && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      audio-cpp:
        condition: service_healthy

volumes:
  audio-cpp-models: {}
