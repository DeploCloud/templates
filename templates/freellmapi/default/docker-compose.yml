services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.34@sha256:3016d212818906b3002a0685e2575b8ecf2c76908cf9fdc0292b9617824881da
    restart: unless-stopped
    expose:
      - 3001
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY: ${TRUST_PROXY}
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-data: {}
