services:
  nats:
    image: nats:2.15.3@sha256:4b83414183aa5fb87cd164962c47eaffd214e84668dc4fa4f1d4c44a3e765ee8
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats-server.conf", "--auth=${NATS_TOKEN}"]
    expose:
      - 8080
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data

volumes:
  nats-data: {}
