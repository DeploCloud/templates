services:
  ntfy:
    image: binwiederhier/ntfy:v2.32.0@sha256:59250e1d8be2ee2186c4560322f625faef22ace380331f05b63f8842dbd62602
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 80
    command: serve
    environment:
      NTFY_BASE_URL: https://${NTFY_DOMAIN}
      NTFY_DATABASE_URL: ${NTFY_DATABASE_URL}
      NTFY_BEHIND_PROXY: "true"
    volumes:
      - ntfy-cache:/var/cache/ntfy

  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ntfy
      POSTGRES_USER: ntfy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntfy -d ntfy"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ntfy-database:/var/lib/postgresql/data

volumes:
  ntfy-cache: {}
  ntfy-database: {}
