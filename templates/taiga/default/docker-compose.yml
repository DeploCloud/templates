x-back-environment: &back-environment
  POSTGRES_DB: taiga
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: taiga-db
  TAIGA_SECRET_KEY: ${SECRET_KEY}
  TAIGA_SITES_SCHEME: https
  TAIGA_SITES_DOMAIN: ${TAIGA_DOMAIN}
  TAIGA_SUBPATH: ""
  EMAIL_BACKEND: django.core.mail.backends.${EMAIL_BACKEND}.EmailBackend
  DEFAULT_FROM_EMAIL: ${EMAIL_DEFAULT_FROM}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASS: ${RABBITMQ_PASS}
  ENABLE_TELEMETRY: ${ENABLE_TELEMETRY}

x-back-volumes: &back-volumes
  - taiga-static-data:/taiga-back/static
  - taiga-media-data:/taiga-back/media

x-rabbitmq-environment: &rabbitmq-environment
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
  RABBITMQ_DEFAULT_VHOST: taiga

x-rabbitmq-healthcheck: &rabbitmq-healthcheck
  test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 30s

services:
  taiga-gateway:
    image: nginx:1.30-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./taiga.conf:/etc/nginx/conf.d/default.conf:ro
      - taiga-static-data:/taiga/static
      - taiga-media-data:/taiga/media
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
      - taiga-protected

  taiga-front:
    image: taigaio/taiga-front:6.10.3@sha256:570c8792ce802ff803a2275967e1d593cdd7c748e2d63163c4dab35fe2d2d646
    restart: unless-stopped
    expose:
      - 80
    environment:
      TAIGA_URL: https://${TAIGA_DOMAIN}
      TAIGA_WEBSOCKETS_URL: wss://${TAIGA_DOMAIN}
      TAIGA_SUBPATH: ""

  taiga-back:
    image: taigaio/taiga-back:6.10.2@sha256:4beed8f62c9ffbbcea824aa01c48fa72a2c2f713be6732e2ee37d2e777843f51
    restart: unless-stopped
    expose:
      - 8000
    # creates the admin account on first start, then runs the stock entrypoint
    entrypoint:
      - bash
      - -c
      - python manage.py migrate && { python manage.py createsuperuser --noinput || true; } && exec ./docker/entrypoint.sh
    environment:
      <<: *back-environment
      DJANGO_SUPERUSER_USERNAME: ${ADMIN_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${ADMIN_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD}
    volumes: *back-volumes
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy

  taiga-async:
    image: taigaio/taiga-back:6.10.2@sha256:4beed8f62c9ffbbcea824aa01c48fa72a2c2f713be6732e2ee37d2e777843f51
    restart: unless-stopped
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    environment: *back-environment
    volumes: *back-volumes
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy

  taiga-events:
    image: taigaio/taiga-events:6.10.0@sha256:92fc0822564f891700d74d23fa44951adf2845cf50c9e56bfd0ef29abdc1ab40
    restart: unless-stopped
    expose:
      - 8888
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      TAIGA_SECRET_KEY: ${SECRET_KEY}
    depends_on:
      taiga-events-rabbitmq:
        condition: service_healthy

  taiga-protected:
    image: taigaio/taiga-protected:6.10.1@sha256:fd4568a97a59225db90f422594cf0e05010be50c9a2a383c01477c5ee521d393
    restart: unless-stopped
    expose:
      - 8003
    environment:
      MAX_AGE: ${ATTACHMENTS_MAX_AGE}
      SECRET_KEY: ${SECRET_KEY}

  taiga-db:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d taiga"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - taiga-db-data:/var/lib/postgresql/data

  # RabbitMQ 4.0 max: 4.1+ refuses taiga-events' amqplib 0.8 (frame_max 4096 < 8192)
  # a fixed hostname keeps the RabbitMQ node name, and so its data directory, stable
  taiga-async-rabbitmq:
    image: rabbitmq:4.0.9-alpine@sha256:157d35e5b8420322ffcbed48dc8941cf8b5054ebf44a257c7397cd27030c36bc
    restart: unless-stopped
    hostname: taiga-async-rabbitmq
    environment: *rabbitmq-environment
    healthcheck: *rabbitmq-healthcheck
    volumes:
      - taiga-async-rabbitmq-data:/var/lib/rabbitmq

  taiga-events-rabbitmq:
    image: rabbitmq:4.0.9-alpine@sha256:157d35e5b8420322ffcbed48dc8941cf8b5054ebf44a257c7397cd27030c36bc
    restart: unless-stopped
    hostname: taiga-events-rabbitmq
    environment: *rabbitmq-environment
    healthcheck: *rabbitmq-healthcheck
    volumes:
      - taiga-events-rabbitmq-data:/var/lib/rabbitmq

volumes:
  taiga-static-data: {}
  taiga-media-data: {}
  taiga-db-data: {}
  taiga-async-rabbitmq-data: {}
  taiga-events-rabbitmq-data: {}
