services:
  ungoogled-chromium:
    image: lscr.io/linuxserver/ungoogled-chromium:156.0.8078.79-1-ls201@sha256:1face3f574f8bf96fc6cff656dd77bdccc17fcb73da3a82f1c0579270cc1bbe0
    restart: unless-stopped
    expose:
      - 3000
    shm_size: "1gb"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      CUSTOM_USER: ${CUSTOM_USER}
      PASSWORD: ${PASSWORD}
    volumes:
      - ungoogled-chromium-config:/config

volumes:
  ungoogled-chromium-config: {}
