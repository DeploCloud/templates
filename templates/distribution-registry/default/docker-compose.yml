services:
  distribution-registry:
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    restart: unless-stopped
    expose:
      - 5000
    environment:
      REGISTRY_HTTP_HOST: ${REGISTRY_HTTP_HOST}
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET}
    volumes:
      - ./config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
      - registry-auth:/auth
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      distribution-registry-auth:
        condition: service_completed_successfully

  distribution-registry-auth:
    image: httpd:2.4.71-alpine@sha256:32bd0639bcc4917ef1fd9363a1d9dd2dd9c498565118b062a10d51e43a5c3a24
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - htpasswd -Bbc /auth/htpasswd "$$REGISTRY_USERNAME" "$$REGISTRY_PASSWORD"
    environment:
      REGISTRY_USERNAME: ${REGISTRY_USERNAME}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD}
    volumes:
      - registry-auth:/auth

volumes:
  registry-data: {}
  registry-auth: {}
