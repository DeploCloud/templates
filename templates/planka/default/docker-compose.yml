services:
  planka:
    image: ghcr.io/plankanban/planka:2.3.1@sha256:f767ab97b878265ea1fff826867718d6ffa95dac04cd979fb5db82489806fb51
    restart: unless-stopped
    expose:
      - 1337
    volumes:
      - planka-data:/app/data
    environment:
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgresql://planka:${DB_PASSWORD}@planka-db:5432/planka
      SECRET_KEY: ${SECRET_KEY}
      TRUST_PROXY: "true"
      OUTGOING_BLOCKED_HOSTS: localhost,planka-db
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME}
    depends_on:
      planka-db:
        condition: service_healthy

  planka-db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    volumes:
      - planka-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: planka
      POSTGRES_USER: planka
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planka -d planka"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  planka-data: {}
  planka-db: {}
