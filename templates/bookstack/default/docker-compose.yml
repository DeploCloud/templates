services:
  bookstack:
    image: solidnerd/bookstack:26.9.2@sha256:6fb7869fa642900637429c10057fe89f6c256047aff1010242343686b200d1d5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8080
    environment:
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - bookstack-uploads:/var/www/bookstack/public/uploads
      - bookstack-storage-uploads:/var/www/bookstack/storage/uploads

  db:
    image: mariadb:11@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - bookstack-database:/var/lib/mysql

volumes:
  bookstack-config: {}
  bookstack-database: {}
  bookstack-uploads: {}
  bookstack-storage-uploads: {}
