services:
  pgweb:
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    restart: unless-stopped
    expose:
      - 8081
    environment:
      PGWEB_SESSIONS: ${PGWEB_SESSIONS}
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -u \"$${PGWEB_AUTH_USER}:$${PGWEB_AUTH_PASS}\" http://127.0.0.1:8081/api/info"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
