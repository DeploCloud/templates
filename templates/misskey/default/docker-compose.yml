services:
  misskey:
    image: misskey/misskey:2026.11.0@sha256:308f8f1980ae2e7d43209923190dcbbdbece428a0fb1c22060d3576d7bcd2d69
    restart: unless-stopped
    expose:
      - 3000
    volumes:
      - misskey-files:/misskey/files
      - ./default.yml:/misskey/.config/default.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-Sfso/dev/null", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      misskey-init:
        condition: service_completed_successfully
      misskey-db:
        condition: service_healthy
      misskey-redis:
        condition: service_healthy

  # /misskey/files is not in the image, so the volume starts root-owned; Misskey runs as uid 991
  misskey-init:
    image: misskey/misskey:2026.11.0@sha256:308f8f1980ae2e7d43209923190dcbbdbece428a0fb1c22060d3576d7bcd2d69
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "991:991", "/misskey/files"]
    volumes:
      - misskey-files:/misskey/files

  misskey-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: misskey
      POSTGRES_DB: misskey
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - misskey-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey -d misskey"]
      interval: 5s
      timeout: 5s
      retries: 20

  misskey-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - misskey-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  misskey-files: {}
  misskey-db: {}
  misskey-redis: {}
