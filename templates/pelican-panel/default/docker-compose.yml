services:
  pelican-panel:
    image: ghcr.io/pelican/panel:v1.0.0-rc.4@sha256:1d38b9781b072729f5f9d78440a38a0513b879e61c2d4f2a9812200dee21a539
    restart: unless-stopped
    expose:
      - 80
    environment:
      APP_URL: ${APP_URL}
      APP_ENV: production
      APP_DEBUG: "false"
      BEHIND_PROXY: "true"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      XDG_DATA_HOME: /pelican-data
    volumes:
      - pelican-data:/pelican-data
      - pelican-plugins:/var/www/html/plugins
      - pelican-logs:/var/www/html/storage/logs

volumes:
  pelican-data: {}
  pelican-plugins: {}
  pelican-logs: {}
