x-agenta-env: &agenta-env
  AGENTA_LICENSE: oss
  AGENTA_WEB_URL: ${AGENTA_WEB_URL}
  AGENTA_API_URL: ${AGENTA_API_URL}
  AGENTA_SERVICES_URL: ${AGENTA_SERVICES_URL}
  AGENTA_API_INTERNAL_URL: http://agenta-api:8000
  AGENTA_AUTH_KEY: ${AGENTA_AUTH_KEY}
  AGENTA_CRYPT_KEY: ${AGENTA_CRYPT_KEY}
  AGENTA_SERVICES_INTERNAL_KEY: ""
  AGENTA_ACCESS_TRUSTED_PROXY_HOPS: "1"
  AGENTA_ACCESS_ALLOWED_DOMAINS: ${AGENTA_ACCESS_ALLOWED_DOMAINS}
  AGENTA_ACCESS_ALLOWED_OWNER_EMAILS: ${AGENTA_ACCESS_ALLOWED_OWNER_EMAILS}
  AGENTA_RUNNER_INTERNAL_URL: http://agenta-runner:8765
  AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN}
  POSTGRES_HOST: agenta-db
  POSTGRES_USER: agenta
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URI_VOLATILE: redis://agenta-redis:6379/0
  REDIS_URI_DURABLE: redis://agenta-redis-durable:6381/0
  SUPERTOKENS_URI_CORE: http://agenta-supertokens:3567
  AGENTA_STORE_ENDPOINT_URL: http://agenta-store:8333
  AGENTA_STORE_ACCESS_KEY: ${AGENTA_STORE_ACCESS_KEY}
  AGENTA_STORE_SECRET_KEY: ${AGENTA_STORE_SECRET_KEY}
  AGENTA_STORE_BUCKET: agenta-store
  AGENTA_STORE_SIGNING_KEY: ${AGENTA_STORE_SIGNING_KEY}
  AGENTA_STORE_JWT_ISSUER: http://agenta-api:8000
  DOCKER_NETWORK_MODE: bridge

x-agenta-web-env: &agenta-web-env
  AGENTA_LICENSE: oss
  AGENTA_WEB_URL: ${AGENTA_WEB_URL}
  AGENTA_API_URL: ${AGENTA_API_URL}
  AGENTA_SERVICES_URL: ${AGENTA_SERVICES_URL}
  AGENTA_API_INTERNAL_URL: http://agenta-api:8000
  HOSTNAME: 0.0.0.0

x-agenta-backend-deps: &agenta-backend-deps
  agenta-db:
    condition: service_healthy
  agenta-alembic:
    condition: service_completed_successfully
  agenta-redis:
    condition: service_healthy
  agenta-redis-durable:
    condition: service_healthy

services:
  agenta-web:
    image: ghcr.io/agenta-ai/agenta-web:v0.129.0@sha256:a77aaecc3d44a8942d5c4656c4939cb728866697c54cf3f26b2f00346a7a96aa
    restart: unless-stopped
    command: ["node", "./oss/server.js"]
    expose:
      - 3000
    environment:
      <<: *agenta-web-env

  agenta-web-mobile:
    image: ghcr.io/agenta-ai/agenta-web-mobile:v0.129.0@sha256:8e5779145b672b8126c436a68a4e11b521c8c77d40da31be81d4a59537d95cf8
    restart: unless-stopped
    expose:
      - 3000
    environment:
      <<: *agenta-web-env

  agenta-api:
    image: ghcr.io/agenta-ai/agenta-api:v0.129.0@sha256:ea3bd1620050b060ad861ae723bb7ac1f64c52cf931ff0754e337a1aac6a325b
    restart: unless-stopped
    command: >
      gunicorn entrypoints.routers:app
      --bind 0.0.0.0:8000
      --worker-class entrypoints.uvicorn_worker.DrainingUvicornWorker
      --workers 2
      --keep-alive 620
      --max-requests 100000
      --max-requests-jitter 10000
      --timeout 60
      --graceful-timeout 900
      --log-level info
      --access-logfile -
      --error-logfile -
    expose:
      - 8000
    environment:
      <<: *agenta-env
      AGENTA_SERVICES_INTERNAL_KEY: ${AGENTA_SERVICES_INTERNAL_KEY}
      SCRIPT_NAME: /api
    depends_on:
      <<: *agenta-backend-deps
      agenta-store:
        condition: service_healthy

  agenta-worker-streams:
    image: ghcr.io/agenta-ai/agenta-api:v0.129.0@sha256:ea3bd1620050b060ad861ae723bb7ac1f64c52cf931ff0754e337a1aac6a325b
    restart: unless-stopped
    command: ["python", "-m", "entrypoints.worker_streams"]
    environment:
      <<: *agenta-env
    depends_on:
      <<: *agenta-backend-deps

  agenta-worker-queues:
    image: ghcr.io/agenta-ai/agenta-api:v0.129.0@sha256:ea3bd1620050b060ad861ae723bb7ac1f64c52cf931ff0754e337a1aac6a325b
    restart: unless-stopped
    command: ["python", "-m", "entrypoints.worker_queues"]
    environment:
      <<: *agenta-env
    depends_on:
      <<: *agenta-backend-deps

  agenta-cron:
    image: ghcr.io/agenta-ai/agenta-api:v0.129.0@sha256:ea3bd1620050b060ad861ae723bb7ac1f64c52cf931ff0754e337a1aac6a325b
    restart: unless-stopped
    init: true
    # The bundled cron scripts call http://api:8000; point them at this stack's API service.
    command:
      - sh
      - -c
      - |
        for f in queries triggers gateways; do
          sed 's|http://api:8000|http://agenta-api:8000|g' /$$f.sh > /tmp/$$f.sh
        done
        sed 's|sh /|sh /tmp/|' /app/crontab > /tmp/crontab
        exec supercronic /tmp/crontab
    environment:
      <<: *agenta-env
    depends_on:
      - agenta-api

  agenta-alembic:
    image: ghcr.io/agenta-ai/agenta-api:v0.129.0@sha256:ea3bd1620050b060ad861ae723bb7ac1f64c52cf931ff0754e337a1aac6a325b
    restart: "no"
    command: ["python", "-m", "oss.databases.postgres.migrations.runner"]
    environment:
      <<: *agenta-env
    depends_on:
      agenta-db:
        condition: service_healthy

  agenta-services:
    image: ghcr.io/agenta-ai/agenta-services:v0.129.0@sha256:5a6836bf7d1109012722524f41006859c8f1ef2bd9986c8e0b03d0b78f3c612b
    restart: unless-stopped
    command: >
      gunicorn entrypoints.main:app
      --bind 0.0.0.0:8080
      --worker-class uvicorn.workers.UvicornWorker
      --workers 2
      --keep-alive 620
      --max-requests 10000
      --max-requests-jitter 1000
      --timeout 60
      --graceful-timeout 60
      --log-level info
      --access-logfile -
      --error-logfile -
    expose:
      - 8080
    environment:
      <<: *agenta-env
      AGENTA_SERVICES_INTERNAL_KEY: ${AGENTA_SERVICES_INTERNAL_KEY}
      SCRIPT_NAME: /services
    depends_on:
      agenta-runner:
        condition: service_healthy

  agenta-runner:
    image: ghcr.io/agenta-ai/agenta-runner:v0.129.0@sha256:e8e834f15906b49934be7e3aadd2de55939d7634264f0c42c9f24df719084fad
    restart: unless-stopped
    init: true
    environment:
      AGENTA_RUNNER_PORT: "8765"
      AGENTA_RUNNER_HOST: 0.0.0.0
      AGENTA_RUNNER_REPLICA_ID: local-runner-1
      AGENTA_RUNNER_TOKEN: ${AGENTA_RUNNER_TOKEN}
      AGENTA_RUNNER_STATE_DIR: /var/lib/agenta/runner-state
      AGENTA_API_URL: ${AGENTA_API_URL}
      AGENTA_API_INTERNAL_URL: http://agenta-api:8000
      PI_CODING_AGENT_DIR: /pi-agent
    volumes:
      - agenta-runner-state:/var/lib/agenta/runner-state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  agenta-db:
    image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - agenta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenta -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  agenta-redis:
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    restart: unless-stopped
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --port 6379
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agenta-redis-durable:
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync no
      --aof-load-corrupt-tail-max-size 1048576
      --save ""
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --port 6381
    volumes:
      - agenta-redis-durable-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  agenta-store:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"agenta","credentials":[{"accessKey":"$${AGENTA_STORE_ACCESS_KEY}","secretKey":"$${AGENTA_STORE_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        cat > /etc/seaweedfs/iam.json <<EOF
        {"sts":{"tokenDuration":"1h","maxSessionLength":"12h","issuer":"seaweedfs-sts","signingKey":"$${AGENTA_STORE_SIGNING_KEY}"},"providers":[{"name":"agenta","type":"oidc","enabled":true,"config":{"issuer":"$${AGENTA_STORE_JWT_ISSUER}","clientId":"agenta-store","jwksUri":"$${AGENTA_STORE_JWT_ISSUER}/.well-known/jwks.json"}}],"policies":[{"name":"store-rw","document":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::$${AGENTA_STORE_BUCKET}","arn:aws:s3:::$${AGENTA_STORE_BUCKET}/*"]}]}}],"roles":[{"roleName":"agenta-store","roleArn":"arn:aws:iam::role/agenta-store","attachedPolicies":["store-rw"],"trustPolicy":{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"agenta"},"Action":["sts:AssumeRoleWithWebIdentity"]}]}}]}
        EOF
        exec weed server -dir=/data -ip=agenta-store -volume.max=64 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.iam.config=/etc/seaweedfs/iam.json
    environment:
      AGENTA_STORE_ACCESS_KEY: ${AGENTA_STORE_ACCESS_KEY}
      AGENTA_STORE_SECRET_KEY: ${AGENTA_STORE_SECRET_KEY}
      AGENTA_STORE_BUCKET: agenta-store
      AGENTA_STORE_SIGNING_KEY: ${AGENTA_STORE_SIGNING_KEY}
      AGENTA_STORE_JWT_ISSUER: http://agenta-api:8000
    volumes:
      - agenta-store-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/cluster/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  agenta-supertokens:
    image: supertokens/supertokens-postgresql:11.4@sha256:e026858aea4bcda93557f8683078e3ca5dc32b4405d24d271ca326802635849d
    restart: unless-stopped
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://agenta:${POSTGRES_PASSWORD}@agenta-db:5432/agenta_oss_supertokens
    depends_on:
      agenta-db:
        condition: service_healthy
      agenta-alembic:
        condition: service_completed_successfully
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agenta-db-data: {}
  agenta-redis-durable-data: {}
  agenta-store-data: {}
  agenta-runner-state: {}
