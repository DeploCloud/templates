x-lago-env: &lago-env
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  DATABASE_URL: postgresql://lago:${POSTGRES_PASSWORD}@lago-db:5432/lago
  REDIS_URL: redis://:${REDIS_PASSWORD}@lago-redis:6379
  LAGO_REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@lago-redis:6379
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  LAGO_ENCRYPTION_PRIMARY_KEY: ${LAGO_ENCRYPTION_PRIMARY_KEY}
  LAGO_ENCRYPTION_DETERMINISTIC_KEY: ${LAGO_ENCRYPTION_DETERMINISTIC_KEY}
  LAGO_ENCRYPTION_KEY_DERIVATION_SALT: ${LAGO_ENCRYPTION_KEY_DERIVATION_SALT}
  LAGO_API_URL: ${LAGO_URL}
  LAGO_FRONT_URL: ${LAGO_URL}
  LAGO_PDF_URL: http://lago-pdf:3000
  LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
  LAGO_DISABLE_SIGNUP: ${LAGO_DISABLE_SIGNUP}
  LAGO_DISABLE_SEGMENT: ${LAGO_DISABLE_SEGMENT}
  LAGO_FROM_EMAIL: ${LAGO_FROM_EMAIL}
  LAGO_SMTP_ADDRESS: ${LAGO_SMTP_ADDRESS}
  LAGO_SMTP_PORT: ${LAGO_SMTP_PORT}
  LAGO_SMTP_USERNAME: ${LAGO_SMTP_USERNAME}
  LAGO_SMTP_PASSWORD: ${LAGO_SMTP_PASSWORD}

x-lago-backend: &lago-backend
  image: getlago/api:v1.57.0@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
  restart: unless-stopped
  environment: *lago-env
  volumes:
    - lago-storage:/app/storage
    - lago-keys:/app/config/keys:ro
  depends_on:
    lago-migrate:
      condition: service_completed_successfully
    lago-db:
      condition: service_healthy
    lago-redis:
      condition: service_healthy

services:
  lago-front:
    image: getlago/front:v1.57.0@sha256:17458dbd65597dc5ec3f76fd781f12df119856140999e0fbb119fd3dd2464fe0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - 8080
    environment:
      API_URL: ${LAGO_URL}
      APP_ENV: production
      LAGO_OAUTH_PROXY_URL: https://proxy.getlago.com
      LAGO_DISABLE_SIGNUP: ${LAGO_DISABLE_SIGNUP}
    depends_on:
      lago-api:
        condition: service_healthy

  lago-api:
    <<: *lago-backend
    command: ["./scripts/start.api.sh"]
    expose:
      - 3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  lago-worker:
    <<: *lago-backend
    command: ["./scripts/start.worker.sh"]
    # Sidekiq needs up to 25s to put running jobs back in the queue.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  lago-clock:
    <<: *lago-backend
    command: ["./scripts/start.clock.sh"]

  # One-shot: the webhook signing key the API reads from config/keys/private.pem.
  lago-keys:
    image: getlago/api:v1.57.0@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
    restart: "no"
    user: "0:0"
    command:
      - bash
      - -ec
      - |
        test -s config/keys/private.pem || ruby -ropenssl -e 'File.write(ARGV[0], OpenSSL::PKey::RSA.new(2048).to_pem)' config/keys/private.pem
        chown 65532:65532 config/keys/private.pem
        chmod 600 config/keys/private.pem
    volumes:
      - lago-keys:/app/config/keys

  # One-shot: migrations, then the first organization and admin only while no user exists.
  lago-migrate:
    image: getlago/api:v1.57.0@sha256:24678b61b372e5ca02f9bb4687c9aec012f8ba8a3539d28c4cbe989f131f3aed
    restart: "no"
    command:
      - bash
      - -ec
      - |
        ./scripts/migrate.sh
        bundle exec rails runner 'exit(User.exists? ? 0 : 1)' || LAGO_CREATE_ORG=true bundle exec rails signup:seed_organization
    environment:
      <<: *lago-env
      LAGO_ORG_NAME: ${LAGO_ORG_NAME}
      LAGO_ORG_USER_EMAIL: ${LAGO_ORG_USER_EMAIL}
      LAGO_ORG_USER_PASSWORD: ${LAGO_ORG_USER_PASSWORD}
    volumes:
      - lago-keys:/app/config/keys:ro
    depends_on:
      lago-keys:
        condition: service_completed_successfully
      lago-db:
        condition: service_healthy
      lago-redis:
        condition: service_healthy

  lago-pdf:
    image: ghcr.io/getlago/lago-gotenberg:8.39@sha256:432876c02a429c035f39a756781abba0e8e5e3787367bff1e57b7a742fabe9fb
    restart: unless-stopped
    expose:
      - 3000

  lago-db:
    # The schema needs the pg_partman extension.
    image: getlago/postgres-partman:15.0-alpine@sha256:27a1e3a1138a69b5a0911ce125dfa613b9ced07604a2d781b9d31141f7f96036
    restart: unless-stopped
    environment:
      POSTGRES_DB: lago
      POSTGRES_USER: lago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lago -d lago"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - lago-db:/var/lib/postgresql/data

  lago-redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - lago-redis:/data

volumes:
  lago-db: {}
  lago-redis: {}
  lago-storage: {}
  lago-keys: {}
