[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "corteza"
port = 80
host = "${domain}"

[config.env]
DOMAIN = "${domain}"
HTTP_SSL_TERMINATED = "true"
HTTP_WEBAPP_ENABLED = "true"
DB_PASSWORD = "${db_password}"
DB_DSN = "postgres://corteza:${db_password}@corteza-db:5432/corteza?sslmode=disable"
AUTH_JWT_SECRET = "${secret:64}"
AUTH_EXTERNAL_COOKIE_SECRET = "${secret:64}"
AUTH_CSRF_SECRET = "${secret:64}"
