[variables]
auth_secret = "${password:64}"
db_password = "${password:32}"
redis_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "client"
port = 3_002
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "backend"
port = 3_001
host = "${domain}"
path = "/api"

[config.env]
BETTER_AUTH_SECRET = "${auth_secret}"
BASE_URL = "https://${domain}"
CLICKHOUSE_DB = "analytics"
CLICKHOUSE_PASSWORD = "${db_password}"
CLUSTER_WORKERS = "4"
DEPLOYMENT = "self-hosted"
DISABLE_SIGNUP = "false"
DISABLE_TELEMETRY = "false"
LITE_DASHBOARD = "false"
MAPBOX_TOKEN = ""
POSTGRES_DB = "analytics"
POSTGRES_PASSWORD = "${db_password}"
POSTGRES_USER = "rybbit"
REDIS_PASSWORD = "${redis_password}"

[[config.mounts]]
filePath = "clickhouse/network.xml"
content = """
<clickhouse>
  <listen_host>0.0.0.0</listen_host>
</clickhouse>
"""

[[config.mounts]]
filePath = "clickhouse/logging.xml"
content = """
<clickhouse>
  <logger>
    <level>warning</level>
    <console>true</console>
  </logger>
  <query_thread_log remove="remove"/>
  <query_log remove="remove"/>
  <query_views_log remove="remove"/>
  <query_metric_log remove="remove"/>
  <error_log remove="remove"/>
  <opentelemetry_span_log remove="remove"/>
  <text_log remove="remove"/>
  <trace_log remove="remove"/>
  <metric_log remove="remove"/>
  <asynchronous_metric_log remove="remove"/>
  <session_log remove="remove"/>
  <part_log remove="remove"/>
  <latency_log remove="remove"/>
  <processors_profile_log remove="remove"/>
</clickhouse>
"""

[[config.mounts]]
filePath = "clickhouse/resource-limits.xml"
content = """
<clickhouse>
  <max_server_memory_usage_to_ram_ratio>0.80</max_server_memory_usage_to_ram_ratio>
  <concurrent_threads_soft_limit_ratio_to_cores>1</concurrent_threads_soft_limit_ratio_to_cores>
  <merges_mutations_memory_usage_to_ram_ratio>0.25</merges_mutations_memory_usage_to_ram_ratio>
</clickhouse>
"""

[[config.mounts]]
filePath = "clickhouse/user-settings.xml"
content = """
<clickhouse>
  <profiles>
    <default>
      <enable_json_type>1</enable_json_type>
      <async_insert>1</async_insert>
      <wait_for_async_insert>1</wait_for_async_insert>
      <log_queries>0</log_queries>
      <log_query_threads>0</log_query_threads>
      <log_processors_profiles>0</log_processors_profiles>
      <max_memory_usage>32000000000</max_memory_usage>
      <max_threads>16</max_threads>
    </default>
  </profiles>
</clickhouse>
"""
