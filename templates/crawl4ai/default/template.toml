[variables]
api_token = "${hash:64}"
secret_key = "${hash:64}"

[config]
mounts = []

[[config.domains]]
serviceName = "crawl4ai"
port = 11_235
host = "${domain}"

[config.env]
CRAWL4AI_API_TOKEN = "${api_token}"
SECRET_KEY = "${secret_key}"
CRAWL4AI_ALLOW_DEEP_CRAWL = "false"
LLM_PROVIDER = "openai/gpt-4o-mini"
LLM_API_KEY = ""
