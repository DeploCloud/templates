services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366@sha256:1fac27c387dc2ea9949e1a01ad7f6d6de9d72d3988338a95476748e5c45c4582
    restart: unless-stopped
    expose:
      - 4567
    environment:
      TZ: ${TZ}
      AUTH_MODE: ${AUTH_MODE}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
    volumes:
      - suwayomi-data:/home/suwayomi/.local/share/Tachidesk

volumes:
  suwayomi-data: {}
