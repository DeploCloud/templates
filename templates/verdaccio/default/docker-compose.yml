services:
  verdaccio:
    image: verdaccio/verdaccio:7.1.2@sha256:4addf64c2fd5f86e963444e8a482d7cd20cd2243e01470d548bdb23d0cd609de
    restart: unless-stopped
    expose:
      - 4873
    environment:
      VERDACCIO_PUBLIC_URL: ${VERDACCIO_PUBLIC_URL}
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - ./config.yaml:/verdaccio/conf/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:4873/-/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  verdaccio-storage: {}
