services:
  fusio:
    image: fusio/fusio:7.2.1@sha256:02d3fe7b0c02c5b9fe1ec5136a4e5fa066e49ef4eaa3c8f9018b23665e896df7
    restart: unless-stopped
    expose:
      - 80
    environment:
      FUSIO_PROJECT_KEY: ${FUSIO_PROJECT_KEY}
      FUSIO_ENV: prod
      FUSIO_DEBUG: "false"
      FUSIO_CONNECTION: pdo-mysql://fusio:${DB_PASSWORD}@fusio-db/fusio
      FUSIO_BACKEND_USER: ${FUSIO_BACKEND_USER}
      FUSIO_BACKEND_EMAIL: ${FUSIO_BACKEND_EMAIL}
      FUSIO_BACKEND_PW: ${FUSIO_BACKEND_PW}
      FUSIO_URL: ${FUSIO_URL}
      FUSIO_APPS_URL: ${FUSIO_URL}/apps
      FUSIO_TRUSTED_IP_HEADER: X-Forwarded-For
      FUSIO_MAILER: ${FUSIO_MAILER}
    depends_on:
      fusio-db:
        condition: service_healthy

  fusio-db:
    image: mysql:9.7.4@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
      MYSQL_DATABASE: fusio
      MYSQL_USER: fusio
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - fusio-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -ufusio -p"$${MYSQL_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fusio-db: {}
