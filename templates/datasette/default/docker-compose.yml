services:
  datasette:
    image: datasetteproject/datasette:0.65.6@sha256:c14364f56a9b595a03b079d46ccc03efbbd2ec57bed0f8e921bb7088384f560e
    restart: unless-stopped
    command: ["datasette", "serve", "-h", "0.0.0.0", "-p", "8001", "/data"]
    expose:
      - 8001
    environment:
      DATASETTE_SECRET: ${DATASETTE_SECRET}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - datasette-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/-/versions.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  datasette-data: {}
