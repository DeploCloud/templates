services:
  gerrit:
    image: gerritcodereview/gerrit:3.15.0-2@sha256:bcfa4d3f9cbf29dcd14dec16be44d89b2b0e68abf4bc15aa5c504fff5bac93c9
    restart: unless-stopped
    # trust the sign-in identity from the proxy instead of the image's dev-mode auth
    entrypoint: ["/bin/bash", "-ec", "git config -f /var/gerrit/etc/gerrit.config auth.type HTTP && exec /entrypoint.sh"]
    expose:
      - 8080
    environment:
      CANONICAL_WEB_URL: ${CANONICAL_WEB_URL}
      HTTPD_LISTEN_URL: ${HTTPD_LISTEN_URL}
    volumes:
      - gerrit-etc:/var/gerrit/etc
      - gerrit-git:/var/gerrit/git
      - gerrit-index:/var/gerrit/index
      - gerrit-cache:/var/gerrit/cache
      - gerrit-db:/var/gerrit/db
      - gerrit-data:/var/gerrit/data

  gerrit-proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./gerrit-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gerrit.htpasswd:/etc/nginx/gerrit.htpasswd:ro
    depends_on:
      - gerrit

volumes:
  gerrit-etc: {}
  gerrit-git: {}
  gerrit-index: {}
  gerrit-cache: {}
  gerrit-db: {}
  gerrit-data: {}
