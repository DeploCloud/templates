[variables]
admin_password = "Os1-${password:32}"

[config]

[[config.domains]]
serviceName = "opensearch"
port = 9_200
host = "${domain}"

[config.env]
OPENSEARCH_INITIAL_ADMIN_PASSWORD = "${admin_password}"
OPENSEARCH_JAVA_OPTS = "-Xms1g -Xmx1g"

[[config.mounts]]
filePath = "seed-users.sh"
content = """#!/bin/bash
# First start: drop the bundled demo users (public passwords), keeping only admin.
# The admin hash is the stock one; the demo installer then swaps in OPENSEARCH_INITIAL_ADMIN_PASSWORD.
set -e
users=config/opensearch-security/internal_users.yml
if grep -q '^kibanaro:' "$users"; then
  cat > "$users" <<'USERS'
---
_meta:
  type: "internalusers"
  config_version: 2
admin:
  hash: "$2a$12$VcCDgh2NDk07JGN0rjGbM.Ad41qVR/YFJcgHp0UGns5JDymv..TOG"
  reserved: true
  backend_roles:
  - "admin"
USERS
fi
exec ./opensearch-docker-entrypoint.sh opensearch
"""
