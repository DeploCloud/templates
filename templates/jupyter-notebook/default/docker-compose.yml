services:
  jupyter-notebook:
    image: quay.io/jupyter/minimal-notebook:notebook-7.6.5@sha256:26ff442c8f85dace0f83c8c2b3969a4ba3ca1218c8544d4faa6740bfc2be3788
    restart: unless-stopped
    expose:
      - 8888
    environment:
      DOCKER_STACKS_JUPYTER_CMD: notebook
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    volumes:
      - jupyter-notebook-home:/home/jovyan

volumes:
  jupyter-notebook-home: {}
