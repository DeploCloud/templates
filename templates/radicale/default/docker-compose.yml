services:
  radicale:
    image: ghcr.io/kozea/radicale:3.9.2@sha256:c74545ef669a3166646ec13438a31b5d0bfff198d8ba7ecd214c0a5f40f03fb4
    restart: unless-stopped
    expose:
      - 5232
    volumes:
      - radicale-data:/var/lib/radicale
      - ./config:/etc/radicale/config:ro
      - ./users:/etc/radicale/users:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5232/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  radicale-data: {}
