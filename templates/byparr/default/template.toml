[variables]
token = "${hash:48}"

[config]

[[config.domains]]
serviceName = "byparr-gateway"
port = 80
host = "${domain}"

[[config.mounts]]
filePath = "Caddyfile"
content = """
{
	admin off
	auto_https off
}

:80 {
	handle_path /{$BYPARR_TOKEN}/* {
		reverse_proxy byparr:8191
	}
	handle {
		respond "Not Found" 404
	}
}
"""

[config.env]
BYPARR_TOKEN = "${token}"
LOG_LEVEL = "info"
