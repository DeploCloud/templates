[variables]
db_password = "${password:32}"
secret_key_base = "${password:64}"

[config]
mounts = []

[[config.domains]]
serviceName = "asciinema"
port = 4_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
SECRET_KEY_BASE = "${secret_key_base}"
URL_HOST = "${domain}"
URL_SCHEME = "https"
ADMIN_PANEL_ON_MAIN_ENDPOINT = "1"
SIGN_UP_DISABLED = "false"
UPLOAD_AUTH_REQUIRED = "false"
ADMIN_BIND_ALL = "0"
