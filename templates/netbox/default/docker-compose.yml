x-netbox: &netbox
  image: netboxcommunity/netbox:v4.7.5-5.1.2@sha256:a521748a89c8966565bbf7832fd01caef2a122f46a21ccf7a7b7682dd3428839
  restart: unless-stopped
  user: "netbox:root"
  environment:
    DB_HOST: netbox-db
    DB_NAME: netbox
    DB_USER: netbox
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: netbox-redis
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_DATABASE: "0"
    REDIS_CACHE_DATABASE: "1"
    SECRET_KEY: ${SECRET_KEY}
    API_TOKEN_PEPPER_1: ${API_TOKEN_PEPPER_1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    MEDIA_ROOT: /opt/netbox/netbox/media
    SKIP_SUPERUSER: "false"
    SUPERUSER_NAME: ${SUPERUSER_NAME}
    SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
    SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
  volumes:
    - netbox-media:/opt/netbox/netbox/media
    - netbox-reports:/opt/netbox/netbox/reports
    - netbox-scripts:/opt/netbox/netbox/scripts

services:
  netbox:
    <<: *netbox
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "/opt/netbox/health.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      netbox-db:
        condition: service_healthy
      netbox-redis:
        condition: service_healthy

  netbox-worker:
    <<: *netbox
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    depends_on:
      netbox:
        condition: service_healthy

  netbox-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d netbox -U netbox"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - netbox-db:/var/lib/postgresql

  netbox-redis:
    image: valkey/valkey:9.1.4-alpine@sha256:56729e68bdda139cbd3f6a2538683dc3523325fc5711ea1a379938f1b37893f0
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(valkey-cli --pass \"$${REDIS_PASSWORD}\" ping)\" = PONG ]"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - netbox-redis:/data

volumes:
  netbox-media: {}
  netbox-reports: {}
  netbox-scripts: {}
  netbox-db: {}
  netbox-redis: {}
