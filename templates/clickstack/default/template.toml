[variables]
clickhouse_password = "${password:32}"

[config]
[[config.mounts]]
filePath = "clickhouse-config.xml"
content = """
<clickhouse>
    <logger>
        <level>information</level>
    </logger>
    <text_log remove="remove"/>
    <query_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></query_log>
    <query_views_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></query_views_log>
    <query_metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></query_metric_log>
    <part_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></part_log>
    <metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></metric_log>
    <asynchronous_metric_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></asynchronous_metric_log>
    <trace_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></trace_log>
    <error_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></error_log>
    <processors_profile_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></processors_profile_log>
    <background_schedule_pool_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></background_schedule_pool_log>
</clickhouse>
"""

[[config.mounts]]
filePath = "otel-collector-listen.yaml"
content = """
# ClickStack attaches the OTLP receiver only once a team key exists; this keeps 4318 open before sign-up.
service:
  pipelines:
    traces/listen:
      receivers: [otlp/hyperdx]
      exporters: [nop]
"""

[[config.domains]]
serviceName = "clickstack"
port = 8_080
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "clickstack-otel-collector"
port = 4_318
host = "${domain}"
path = "/v1"

[config.env]
FRONTEND_URL = "https://${domain}"
HYPERDX_LOG_LEVEL = "info"
EXPRESS_SESSION_SECRET = "${hash:64}"
TOKEN_ENCRYPTION_KEY = "${hash:64}"
USAGE_STATS_ENABLED = "true"
CLICKHOUSE_PASSWORD = "${clickhouse_password}"
