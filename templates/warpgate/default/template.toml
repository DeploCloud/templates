[variables]
admin_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "warpgate-proxy"
port = 80
host = "${domain}"

[config.env]
WARPGATE_ADMIN_PASSWORD = "${admin_password}"

[[config.mounts]]
filePath = "warpgate.yaml"
content = """database_url: "sqlite:/data/db"
external_host: "${domain}"
http:
  listen: "0.0.0.0:8888"
  external_port: 443
  certificate: /data/tls.certificate.pem
  key: /data/tls.key.pem
  trust_x_forwarded_headers: true
"""

[[config.mounts]]
filePath = "nginx.conf"
content = """map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $warpgate_upstream warpgate:8888;

    location / {
        proxy_pass https://$warpgate_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
"""
