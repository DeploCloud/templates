[variables]
huly_secret = "${hash:64}"
cr_password = "${password:32}"
minio_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "huly"
port = 80
host = "${domain}"

[config.env]
HULY_HOST = "${domain}"
HULY_SECRET = "${huly_secret}"
HULY_TITLE = "Huly"
DEFAULT_LANGUAGE = "en"
LAST_NAME_FIRST = "true"
CR_DATABASE = "defaultdb"
CR_USERNAME = "selfhost"
CR_PASSWORD = "${cr_password}"
DB_URL = "postgres://selfhost:${cr_password}@huly-db:26257/defaultdb"
MINIO_USER = "huly"
MINIO_PASSWORD = "${minio_password}"
STORAGE_CONFIG = "minio|huly-minio?accessKey=huly&secretKey=${minio_password}"

[[config.mounts]]
filePath = "huly.nginx.conf"
content = """
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $huly_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_upgrade $huly_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $huly_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $huly_connection;

    set $front http://huly-front:8080;
    set $account http://huly-account:3000;
    set $collaborator http://huly-collaborator:3078;
    set $transactor http://huly-transactor:3333;
    set $rekoni http://huly-rekoni:4004;
    set $stats http://huly-stats:4900;

    location / {
        proxy_pass $front;
    }

    location /_accounts {
        rewrite ^/_accounts/?(.*)$ /$1 break;
        proxy_pass $account;
    }

    location /_collaborator {
        rewrite ^/_collaborator/?(.*)$ /$1 break;
        proxy_pass $collaborator;
    }

    location /_transactor {
        rewrite ^/_transactor/?(.*)$ /$1 break;
        proxy_pass $transactor;
    }

    location ~ ^/eyJ {
        proxy_pass $transactor;
    }

    location /_rekoni {
        rewrite ^/_rekoni/?(.*)$ /$1 break;
        proxy_pass $rekoni;
    }

    location /_stats {
        rewrite ^/_stats/?(.*)$ /$1 break;
        proxy_pass $stats;
    }
}
"""
