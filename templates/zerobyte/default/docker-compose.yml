services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:v0.44.2@sha256:e100152258f0d167778e0623985a3ea0d1d98e5749d3e316911da8b13c48e3d2
    restart: unless-stopped
    expose:
      - 4096
    environment:
      BASE_URL: ${BASE_URL}
      APP_SECRET: ${APP_SECRET}
      TRUST_PROXY: ${TRUST_PROXY}
      TZ: ${TZ}
    volumes:
      - zerobyte-data:/var/lib/zerobyte
      - zerobyte-rclone:/root/.config/rclone

volumes:
  zerobyte-data: {}
  zerobyte-rclone: {}
