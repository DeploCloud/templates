services:
  mage-ai:
    image: mageai/mageai:0.9.81@sha256:74c8a8f626e28fa7d15fa85019fd692b5deceda1efcc478d4ace93c7f0a9c665
    restart: unless-stopped
    expose:
      - 6789
    environment:
      REQUIRE_USER_AUTHENTICATION: "1"
      MAGE_PUBLIC_HOST: ${MAGE_PUBLIC_HOST}
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_OWNER_EMAIL: ${DEFAULT_OWNER_EMAIL}
      DEFAULT_OWNER_USERNAME: ${DEFAULT_OWNER_USERNAME}
      DEFAULT_OWNER_PASSWORD: ${DEFAULT_OWNER_PASSWORD}
    volumes:
      - mage-ai-src:/home/src
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6789/api/status > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  mage-ai-src: {}
