services:
  mage-ai:
    image: mageai/mageai:0.9.81@sha256:74c8a8f626e28fa7d15fa85019fd692b5deceda1efcc478d4ace93c7f0a9c665
    restart: unless-stopped
    expose:
      - 6789
    environment:
      REQUIRE_USER_AUTHENTICATION: "1"
      MAGE_PUBLIC_HOST: ${MAGE_PUBLIC_HOST}
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_OWNER_EMAIL: ${DEFAULT_OWNER_EMAIL}
      DEFAULT_OWNER_USERNAME: ${DEFAULT_OWNER_USERNAME}
      DEFAULT_OWNER_PASSWORD: ${DEFAULT_OWNER_PASSWORD}
      MAGE_DATABASE_CONNECTION_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mage-ai-db:5432/${POSTGRES_DB}
    volumes:
      - mage-ai-src:/home/src
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6789/api/status > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      mage-ai-db:
        condition: service_healthy

  mage-ai-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mage-ai-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mage-ai-src: {}
  mage-ai-db: {}
