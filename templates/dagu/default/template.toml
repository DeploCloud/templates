[variables]
admin_password = "${password:24}"
token_secret = "${secret:64}"

[config]
mounts = []

[[config.domains]]
serviceName = "dagu"
port = 8_080
host = "${domain}"

[config.env]
DAGU_PUBLIC_URL = "https://${domain}"
DAGU_AUTH_TOKEN_SECRET = "${token_secret}"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "${admin_password}"
DAGU_TZ = "Etc/UTC"
