services:
  dagu:
    image: ghcr.io/dagucloud/dagu:2.27.0@sha256:399dda807f532df9e17bcea6fa836b79f5700c3c13ca2f62fc0c1e45cab8e286
    restart: unless-stopped
    expose:
      - 8080
    environment:
      DAGU_HOST: 0.0.0.0
      DAGU_PORT: "8080"
      DAGU_PUBLIC_URL: "${DAGU_PUBLIC_URL}"
      DAGU_AUTH_MODE: builtin
      DAGU_AUTH_TOKEN_SECRET: "${DAGU_AUTH_TOKEN_SECRET}"
      DAGU_AUTH_BUILTIN_INITIAL_ADMIN_USERNAME: "${ADMIN_USERNAME}"
      DAGU_AUTH_BUILTIN_INITIAL_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DAGU_SERVER_METRICS: private
      DAGU_TZ: "${DAGU_TZ}"
    volumes:
      - dagu-data:/var/lib/dagu
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dagu-data: {}
