services:
  marimo:
    image: ghcr.io/marimo-team/marimo:0.25.2-sql@sha256:f154a40fba17cda7581edd3a3ef6c371d46c69a0e45dcd825293554e5d62e4c6
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec marimo -q edit --headless --token --token-password "$$MARIMO_TOKEN_PASSWORD" --port 8080 --host 0.0.0.0 /app/data
    expose:
      - 8080
    environment:
      MARIMO_TOKEN_PASSWORD: ${MARIMO_TOKEN_PASSWORD}
      MARIMO_SESSION_SECRET: ${MARIMO_SESSION_SECRET}
    volumes:
      - marimo-data:/app/data
      - marimo-home:/home/appuser
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  marimo-data: {}
  marimo-home: {}
