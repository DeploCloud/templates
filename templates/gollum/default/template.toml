[variables]
admin_password = "${password:24}"

[config]

[[config.domains]]
serviceName = "gollum"
port = 4_567
host = "${domain}"

[config.env]
GOLLUM_USERNAME = "admin"
GOLLUM_PASSWORD = "${admin_password}"

[[config.mounts]]
filePath = "config.rb"
content = """# Gollum has no built-in login, so the whole wiki sits behind HTTP basic auth.
require 'rack/auth/basic'

Precious::App.use Rack::Auth::Basic, 'Gollum' do |user, pass|
  Rack::Utils.secure_compare(user.to_s, ENV.fetch('GOLLUM_USERNAME')) &
    Rack::Utils.secure_compare(pass.to_s, ENV.fetch('GOLLUM_PASSWORD'))
end
"""
