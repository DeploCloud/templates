services:
  firefly-app:
    image: fireflyiii/core:version-6.7.9@sha256:4409f9f0f87378ba95d40811352f4f49338d276bb638c1e6d18a5579f332fbe8
    restart: unless-stopped
    expose:
      - 8080
    environment:
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      SITE_OWNER: ${SITE_OWNER}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
      TZ: ${TZ}
    volumes:
      - firefly-upload:/var/www/html/storage/upload
    depends_on:
      firefly-db:
        condition: service_healthy

  firefly-db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - firefly-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly"]
      interval: 5s
      timeout: 5s
      retries: 20

  firefly-cron:
    image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: unless-stopped
    environment:
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
    command:
      - sh
      - -c
      - apk add --no-cache wget && while true; do wget -qO- http://firefly-app:8080/api/v1/cron/$$STATIC_CRON_TOKEN; sleep 3600; done
    depends_on:
      firefly-app:
        condition: service_started

volumes:
  firefly-upload: {}
  firefly-postgres: {}
