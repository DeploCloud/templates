services:
  opencloud:
    image: opencloudeu/opencloud:9.1.1@sha256:d7d5b547f9e41db24f030d6a6857c4184752b2c875c936952ee0601b6531cd51
    restart: unless-stopped
    # init writes the config with random secrets once and fails harmlessly on later starts
    entrypoint: ["/bin/sh", "-c", "opencloud init || true; exec opencloud server"]
    expose:
      - 9200
    environment:
      OC_URL: https://${OC_DOMAIN}
      OC_INSECURE: "false"
      PROXY_TLS: "false"
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      IDM_ADMIN_PASSWORD: ${IDM_ADMIN_PASSWORD}
      IDM_CREATE_DEMO_USERS: "false"
      OC_LOG_LEVEL: ${OC_LOG_LEVEL}
    volumes:
      - opencloud-config:/etc/opencloud
      - opencloud-data:/var/lib/opencloud
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9205/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  opencloud-config: {}
  opencloud-data: {}
