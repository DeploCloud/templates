services:
  deluge:
    image: linuxserver/deluge:2.2.0-ls387@sha256:e2a537991884a514b64d7adf857e39b5e9239a1c76e52114e52bf10707dde772
    restart: unless-stopped
    # Seed web.conf on first start so the web UI never runs with the public default password.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -f /config/web.conf ] || /lsiopy/bin/python3 -c 'import hashlib, json, os; s = os.urandom(20).hex(); h = hashlib.sha1((s + os.environ["DELUGE_WEB_PASSWORD"]).encode()).hexdigest(); open("/config/web.conf", "w").write(json.dumps({"file": 2, "format": 1}) + json.dumps({"pwd_salt": s, "pwd_sha1": h, "first_login": False}))'
        exec /init
    expose:
      - 8112
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DELUGE_WEB_PASSWORD: ${DELUGE_WEB_PASSWORD}
    volumes:
      - deluge-config:/config
      - deluge-downloads:/downloads

volumes:
  deluge-config: {}
  deluge-downloads: {}
