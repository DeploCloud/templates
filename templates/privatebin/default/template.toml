[config]

[[config.domains]]
serviceName = "privatebin"
port = 8_080
host = "${domain}"

[config.env]
TZ = "UTC"

[[config.mounts]]
filePath = "conf.php"
content = """;<?php http_response_code(403); /*
; PrivateBin configuration, see https://github.com/PrivateBin/PrivateBin/wiki/Configuration
[main]
discussion = true
fileupload = false
sizelimit = 10485760

[expire]
default = "1week"

[traffic]
limit = 10
header = "X_FORWARDED_FOR"

[purge]
limit = 300
batchsize = 10

[model]
class = Filesystem

[model_options]
dir = PATH "data"
"""
