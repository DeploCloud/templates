services:
  tracks:
    image: tracksapp/tracks:2.7.1@sha256:c834519af84be23b79baba14fff956732a54ade3783c54fafbf0d66991bf871a
    restart: unless-stopped
    command: ["sh", "-c", "rm -f tmp/pids/server.pid && bin/rails db:prepare && exec bin/run-rails server -b 0.0.0.0"]
    expose:
      - 3000
    environment:
      DATABASE_HOST: tracks-db
      DATABASE_PORT: 3306
      DATABASE_NAME: tracks
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${DB_ROOT_PASSWORD}
      DATABASE_TYPE: mysql2
    volumes:
      - tracks-attachments:/app/db/assets
      - ./site.yml:/app/config/site.yml:ro
    depends_on:
      tracks-db:
        condition: service_healthy

  tracks-db:
    image: mariadb:11.4.13@sha256:a8992b5e5404d11e03c54a31d0c1bdea3fd116d283aa6d1a627551f29045309b
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - tracks-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tracks-attachments: {}
  tracks-db-data: {}
