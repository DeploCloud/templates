services:
  osticket:
    image: ghcr.io/homelabhd/osticket:v1.18.4@sha256:2dde6f4ca8c52c00b384057d9ce5b16e2e8575871ea02641cc949e2ce6c90a6e
    restart: unless-stopped
    expose:
      - 8080
    environment: &osticket-env
      DB_HOST: osticket-db
      DB_NAME: osticket
      DB_USER: osticket
      DB_PASS: ${DB_PASSWORD}
      INSTALL_NAME: ${INSTALL_NAME}
      INSTALL_EMAIL: ${INSTALL_EMAIL}
      INSTALL_URL: ${INSTALL_URL}
      INSTALL_SECRET: ${INSTALL_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/scp/login.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      osticket-db:
        condition: service_healthy

  # Single scheduled worker: fetches email and runs osTicket's periodic tasks.
  osticket-cron:
    image: ghcr.io/homelabhd/osticket:v1.18.4@sha256:2dde6f4ca8c52c00b384057d9ce5b16e2e8575871ea02641cc949e2ce6c90a6e
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php /var/www/html/api/cron.php; sleep 300; done"]
    environment: *osticket-env
    healthcheck:
      disable: true
    depends_on:
      osticket:
        condition: service_healthy

  osticket-db:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - osticket-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  osticket-db: {}
