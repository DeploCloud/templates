services:
  usesend:
    image: usesend/usesend:v1.10.4@sha256:ae78d9dcc9e73645b406ec3256967956498c346e42ce7221ba4c1f92aee09071
    restart: unless-stopped
    expose:
      - 3000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://usesend:${DB_PASSWORD}@usesend-db:5432/usesend
      REDIS_URL: redis://usesend-redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      NEXT_PUBLIC_IS_CLOUD: "false"
      API_RATE_LIMIT: "1"
    depends_on:
      usesend-db:
        condition: service_healthy
      usesend-redis:
        condition: service_healthy

  usesend-db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_USER: usesend
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: usesend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usesend -d usesend"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - usesend-db:/var/lib/postgresql/data

  # BullMQ queues need keys to never be evicted.
  usesend-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - usesend-redis:/data

volumes:
  usesend-db: {}
  usesend-redis: {}
