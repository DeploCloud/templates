services:
  youtarr:
    image: dialmaster/youtarr:v1.94.0@sha256:32a24f10aaedbda419c41971c93f5b1a9d9c377eaab7a958c5b99bfdf9c0d369
    restart: unless-stopped
    expose:
      - 3011
    environment:
      TZ: ${TZ}
      DB_HOST: youtarr-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_PRESET_USERNAME: ${AUTH_PRESET_USERNAME}
      AUTH_PRESET_PASSWORD: ${AUTH_PRESET_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - youtarr-downloads:/usr/src/app/data
      - youtarr-config:/app/config
      - youtarr-jobs:/app/jobs
      - youtarr-images:/app/server/images
    depends_on:
      youtarr-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:3011/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  youtarr-db:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - youtarr-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  youtarr-downloads: {}
  youtarr-config: {}
  youtarr-jobs: {}
  youtarr-images: {}
  youtarr-db: {}
