services:
  pulse:
    image: rcourtman/pulse:6.8.0@sha256:fbce664418743af311ffe2abec65c51d13902533b08f19928333e1c4afe6176a
    restart: unless-stopped
    expose:
      - 7655
    environment:
      TZ: ${TZ}
      PULSE_PUBLIC_URL: ${PULSE_PUBLIC_URL}
      PULSE_TRUSTED_PROXY_CIDRS: ${PULSE_TRUSTED_PROXY_CIDRS}
      PULSE_DEPLOYMENT_METHOD: ${PULSE_DEPLOYMENT_METHOD}
    volumes:
      - pulse-data:/data
    healthcheck:
      test: ["CMD", "/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pulse-data: {}
