[config]

[[config.domains]]
serviceName = "viseron"
port = 8_888
host = "${domain}"

[config.env]
TZ = "UTC"

[[config.mounts]]
filePath = "config.yaml"
content = """# Edit this file from the Configuration page of the web UI, then restart.
# See https://viseron.netlify.app/docs/documentation/configuration
webserver:
  public_base_url: https://${domain}
  auth:

