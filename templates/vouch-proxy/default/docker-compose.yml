services:
  vouch-proxy:
    image: quay.io/vouch/vouch-proxy:0.50.0@sha256:213369d156535430d47a426350d3619588cab71dc4d1f3e3cfab200b54dfb17a
    restart: unless-stopped
    expose:
      - 9090
    environment:
      VOUCH_LISTEN: 0.0.0.0
      VOUCH_PORT: 9090
      VOUCH_DOMAINS: ${VOUCH_DOMAINS}
      VOUCH_WHITELIST: ${VOUCH_WHITELIST}
      VOUCH_JWT_SECRET: ${VOUCH_JWT_SECRET}
      OAUTH_PROVIDER: ${OAUTH_PROVIDER}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_AUTH_URL: ${OAUTH_AUTH_URL}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL}
      OAUTH_USER_INFO_URL: ${OAUTH_USER_INFO_URL}
      OAUTH_SCOPES: ${OAUTH_SCOPES}
      OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL}
