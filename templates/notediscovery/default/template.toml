[variables]
admin_password = "${password:24}"
secret_key = "${secret:64}"

[config]
mounts = []

[[config.domains]]
serviceName = "notediscovery"
port = 8_000
host = "${domain}"

[config.env]
AUTHENTICATION_PASSWORD = "${admin_password}"
AUTHENTICATION_SECRET_KEY = "${secret_key}"
SHARE_PUBLIC_ORIGIN = "https://${domain}"
