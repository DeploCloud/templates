services:
  notediscovery:
    image: ghcr.io/gamosoft/notediscovery:0.35.0@sha256:23961ea1d33d55ecf05d38bde1a9de63c82c7e86438199d66939f725b7693b41
    restart: unless-stopped
    expose:
      - 8000
    environment:
      TZ: UTC
      FORWARDED_ALLOW_IPS: "*"
      AUTHENTICATION_ENABLED: "true"
      AUTHENTICATION_PASSWORD: ${AUTHENTICATION_PASSWORD}
      AUTHENTICATION_SECRET_KEY: ${AUTHENTICATION_SECRET_KEY}
      SHARE_PUBLIC_ORIGIN: ${SHARE_PUBLIC_ORIGIN}
    volumes:
      - notediscovery-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  notediscovery-data: {}
