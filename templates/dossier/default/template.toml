[variables]
db_password = "${password:32}"
login_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "dossier"
port = 3_000
host = "${domain}"

[config.env]
POSTGRES_PASSWORD = "${db_password}"
DOSSIER_LOGIN_PASSWORD = "${login_password}"
DOSSIER_SECRET = "${secret:64}"
DOSSIER_PUBLIC_URL = "https://${domain}"
TZ = "UTC"
