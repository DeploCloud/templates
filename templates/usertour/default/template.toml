[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "usertour"
port = 80
host = "${domain}"

[config.env]
APP_URL = "https://${domain}"
DB_PASSWORD = "${db_password}"
JWT_SECRET = "${secret:64}"
ENCRYPTION_KEY = "${hash:64}"
TRUST_PROXY = "2"
EMAIL_AUTH_ENABLED = "true"
