[variables]
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "homelable"
port = 80
host = "${domain}"

[config.env]
APP_DOMAIN = "${domain}"
SECRET_KEY = "${hash:64}"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "${admin_password}"
STATUS_CHECKER_INTERVAL = "60"
