services:
  yuvomi:
    image: ghcr.io/ulsklyc/yuvomi:2.93.0@sha256:530a6fdff7602d80f1a4b96b5071af5e65e6beaa1333a534650276f5c0e92887
    restart: unless-stopped
    expose:
      - 3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      MODULES_DIR: /app/modules
      SESSION_SECRET: "${SESSION_SECRET}"
      DB_ENCRYPTION_KEY: "${DB_ENCRYPTION_KEY}"
      SESSION_SECURE: "true"
      TRUST_PROXY: "1"
      BASE_URL: "${BASE_URL}"
      TZ: "${TZ}"
    volumes:
      - yuvomi-data:/data
      - yuvomi-backups:/backups
      - yuvomi-modules:/app/modules
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  yuvomi-data: {}
  yuvomi-backups: {}
  yuvomi-modules: {}
