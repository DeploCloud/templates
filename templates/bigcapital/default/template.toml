[variables]
db_password = "${password:32}"
jwt_secret = "${base64:48}"
two_factor_key = "${base64:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "bigcapital"
port = 80
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "bigcapital-server"
port = 3_000
host = "${domain}"
path = "/api"

[config.env]
BASE_URL = "https://${domain}"
APP_JWT_SECRET = "${jwt_secret}"
TWO_FACTOR_ENCRYPTION_KEY = "${two_factor_key}"
DB_USER = "root"
DB_PASSWORD = "${db_password}"
SYSTEM_DB_NAME = "bigcapital_system"
SIGNUP_DISABLED = "false"
SIGNUP_EMAIL_CONFIRMATION = "false"
MAIL_HOST = ""
MAIL_PORT = "587"
MAIL_SECURE = "false"
MAIL_USERNAME = ""
MAIL_PASSWORD = ""
MAIL_FROM_NAME = "Bigcapital"
MAIL_FROM_ADDRESS = ""
S3_REGION = "us-east-1"
S3_ENDPOINT = ""
S3_BUCKET = ""
S3_ACCESS_KEY_ID = ""
S3_SECRET_ACCESS_KEY = ""
S3_FORCE_PATH_STYLE = "true"
