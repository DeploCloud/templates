services:
  standard-notes-web:
    image: standardnotes/web:cdb1b42cd9ce29abab07a735bf4137e5206f41ff@sha256:af4c13ced1e4f525e4982ce130efee90f87c57c0eff3f319a97011e2cbe0bb06
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  standard-notes:
    image: standardnotes/server:3125ba9212fe7c1f8b635017babdb726778ff26e@sha256:cad73dd95394ed871b049553a2a8917cbc0d2656190af7e8b27833b4d69a1ef7
    restart: unless-stopped
    expose:
      - 3000
      - 3104
    environment:
      DB_TYPE: mysql
      DB_HOST: standard-notes-db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_TYPE: redis
      REDIS_HOST: standard-notes-redis
      REDIS_PORT: "6379"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_SERVER_ENCRYPTION_SERVER_KEY: ${AUTH_SERVER_ENCRYPTION_SERVER_KEY}
      AUTH_SERVER_ADMIN_KEY: ${AUTH_SERVER_ADMIN_KEY}
      VALET_TOKEN_SECRET: ${VALET_TOKEN_SECRET}
      AUTH_SERVER_DISABLE_USER_REGISTRATION: ${AUTH_SERVER_DISABLE_USER_REGISTRATION}
      AUTH_SERVER_U2F_RELYING_PARTY_ID: ${AUTH_SERVER_U2F_RELYING_PARTY_ID}
      AUTH_SERVER_U2F_EXPECTED_ORIGIN: ${AUTH_SERVER_U2F_EXPECTED_ORIGIN}
      PUBLIC_FILES_SERVER_URL: ${PUBLIC_FILES_SERVER_URL}
      AUTH_SERVER_SNS_ENDPOINT: http://standard-notes-localstack:4566
      AUTH_SERVER_SQS_ENDPOINT: http://standard-notes-localstack:4566
      AUTH_SERVER_SQS_QUEUE_URL: http://standard-notes-localstack:4566/000000000000/auth-local-queue
      SYNCING_SERVER_SNS_ENDPOINT: http://standard-notes-localstack:4566
      SYNCING_SERVER_SQS_ENDPOINT: http://standard-notes-localstack:4566
      SYNCING_SERVER_SQS_QUEUE_URL: http://standard-notes-localstack:4566/000000000000/syncing-server-local-queue
      FILES_SERVER_SNS_ENDPOINT: http://standard-notes-localstack:4566
      FILES_SERVER_SQS_ENDPOINT: http://standard-notes-localstack:4566
      FILES_SERVER_SQS_QUEUE_URL: http://standard-notes-localstack:4566/000000000000/files-local-queue
      REVISIONS_SERVER_SNS_ENDPOINT: http://standard-notes-localstack:4566
      REVISIONS_SERVER_SQS_ENDPOINT: http://standard-notes-localstack:4566
      REVISIONS_SERVER_SQS_QUEUE_URL: http://standard-notes-localstack:4566/000000000000/revisions-server-local-queue
    volumes:
      - standard-notes-uploads:/opt/server/packages/files/dist/uploads
      - standard-notes-logs:/var/lib/server/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 3m
    depends_on:
      standard-notes-db:
        condition: service_healthy
      standard-notes-redis:
        condition: service_healthy
      standard-notes-localstack:
        condition: service_healthy

  standard-notes-localstack:
    image: localstack/localstack:3.0.2@sha256:e606c4421419030b12d63a59f1211f57f5b0fbf7e9ce769e6250ee62ff4f9293
    restart: unless-stopped
    # Mounted files are not executable, and LocalStack only runs executable init scripts
    entrypoint:
      - /bin/sh
      - -c
      - install -D -m 755 /opt/standard-notes/bootstrap.sh /etc/localstack/init/ready.d/bootstrap.sh && exec docker-entrypoint.sh
    environment:
      SERVICES: sns,sqs
      LS_LOG: warn
      DISABLE_EVENTS: "1"
    volumes:
      - ./localstack-bootstrap.sh:/opt/standard-notes/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | grep -Eq '\"completed\": ?true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  standard-notes-db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - standard-notes-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  standard-notes-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    volumes:
      - standard-notes-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  standard-notes-uploads: {}
  standard-notes-logs: {}
  standard-notes-db: {}
  standard-notes-redis: {}
