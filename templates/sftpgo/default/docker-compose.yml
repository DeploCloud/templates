services:
  sftpgo:
    image: drakkan/sftpgo:v2.7.6@sha256:1edd28d80de2a008863fbfc58c8ff7db47b1b410bae48d4e6076192337809b11
    restart: unless-stopped
    expose:
      - 8080
      - 10080
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_COMMON__MAX_PER_HOST_CONNECTIONS: "0"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_DEFAULT_ADMIN_USERNAME}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_DEFAULT_ADMIN_PASSWORD}
      SFTPGO_HTTPD__SIGNING_PASSPHRASE: ${SFTPGO_HTTPD__SIGNING_PASSPHRASE}
      SFTPGO_WEBDAVD__BINDINGS__0__PORT: "10080"
      SFTPGO_WEBDAVD__BINDINGS__0__PREFIX: /dav
    volumes:
      - sftpgo-data:/srv/sftpgo
      - sftpgo-home:/var/lib/sftpgo
    healthcheck:
      test: ["CMD", "sftpgo", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sftpgo-data: {}
  sftpgo-home: {}
