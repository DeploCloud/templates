[variables]
db_password = "${password:32}"
db_root_password = "${password:32}"
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "casdoor"
port = 8_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
DB_ROOT_PASSWORD = "${db_root_password}"
CASDOOR_ADMIN_PASSWORD = "${admin_password}"
CASDOOR_ORIGIN = "https://${domain}"
