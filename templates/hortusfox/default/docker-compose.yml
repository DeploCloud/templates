services:
  hortusfox:
    image: ghcr.io/danielbrendel/hortusfox-web:v6.4@sha256:bea58ac1f2884d672277ad2444de372b0a5032ef827bdc51d2b368285dbdb4dd
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - hortusfox-img:/var/www/html/public/img
      - hortusfox-attachments:/var/www/html/public/attachments
      - hortusfox-logs:/var/www/html/app/logs
      - hortusfox-backup:/var/www/html/public/backup
      - hortusfox-themes:/var/www/html/public/themes
      - hortusfox-migrations:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_DEBUG: "false"
      DB_HOST: hortusfox-db
      DB_PORT: 3306
      DB_DATABASE: hortusfox
      DB_USERNAME: hortusfox
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: utf8mb4
    depends_on:
      hortusfox-db:
        condition: service_healthy

  hortusfox-db:
    image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortusfox
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - hortusfox-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  hortusfox-img: {}
  hortusfox-attachments: {}
  hortusfox-logs: {}
  hortusfox-backup: {}
  hortusfox-themes: {}
  hortusfox-migrations: {}
  hortusfox-db: {}
