services:
  jupyterlab:
    image: quay.io/jupyter/minimal-notebook:lab-4.6.6@sha256:26ff442c8f85dace0f83c8c2b3969a4ba3ca1218c8544d4faa6740bfc2be3788
    restart: unless-stopped
    expose:
      - 8888
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    volumes:
      - jupyterlab-home:/home/jovyan

volumes:
  jupyterlab-home: {}
