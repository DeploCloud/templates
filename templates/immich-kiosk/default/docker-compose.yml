services:
  immich-kiosk:
    image: ghcr.io/damongolding/immich-kiosk:0.47.1@sha256:0e7e61f2b251582b61daf88778e21eb1a68d9b7fe671837e7086ad6d58a3fd31
    restart: unless-stopped
    expose:
      - 3000
    environment:
      KIOSK_IMMICH_URL: ${KIOSK_IMMICH_URL}
      KIOSK_IMMICH_API_KEY: ${KIOSK_IMMICH_API_KEY}
      KIOSK_IMMICH_EXTERNAL_URL: ${KIOSK_IMMICH_EXTERNAL_URL}
      KIOSK_PASSWORD: ${KIOSK_PASSWORD}
      KIOSK_BEHIND_PROXY: ${KIOSK_BEHIND_PROXY}
      LANG: ${LANG}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "/kiosk", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
