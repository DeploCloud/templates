services:
  invidious:
    # latest is the multi-arch manifest of release v2.20261114.0
    image: quay.io/invidious/invidious:latest@sha256:90115ee1781332e988d357249fd2b2460244a8ef380a0c0772ad7fbe1318427f
    restart: unless-stopped
    expose:
      - 3000
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: invidious
          password: "${INV_DB_PASSWORD}"
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://invidious-companion:8282/companion"
        invidious_companion_key: "${INV_COMPANION_KEY}"
        hmac_key: "${INV_HMAC_KEY}"
        domain: "${INV_DOMAIN}"
        external_port: 443
        https_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started

  invidious-companion:
    image: quay.io/invidious/invidious-companion:2026.11.07-07ae73c@sha256:292d889ff6d4cb31970cd35ea9eea8b249dc8c1dc3c66b3ad1b9c4fd0ffb62d1
    restart: unless-stopped
    expose:
      - 8282
    environment:
      SERVER_SECRET_KEY: ${INV_COMPANION_KEY}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - invidious-companion-cache:/var/tmp/youtubei.js

  invidious-db:
    image: postgres:18.7-alpine3.24@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: ${INV_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invidious -d invidious"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - invidious-db:/var/lib/postgresql

volumes:
  invidious-db: {}
  invidious-companion-cache: {}
