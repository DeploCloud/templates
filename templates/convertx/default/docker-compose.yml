services:
  convertx:
    image: ghcr.io/c4illin/convertx:v0.20.0@sha256:6259e0c1e063120b1ddbc6937372a83be58182b2c9dc82264f58e100907b3e51
    restart: unless-stopped
    expose:
      - 3000
    environment:
      PUID: "1000"
      PGID: "1000"
      JWT_SECRET: ${JWT_SECRET}
      ACCOUNT_REGISTRATION: ${ACCOUNT_REGISTRATION}
      AUTO_DELETE_EVERY_N_HOURS: ${AUTO_DELETE_EVERY_N_HOURS}
      TZ: ${TZ}
    volumes:
      - convertx-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  convertx-data: {}
