services:
  transmute:
    image: ghcr.io/transmute-app/transmute:2.1.1@sha256:87b669d835d9e68bdbc4082ab061cb361cd3ecee69c14ccfa9a3814d326b6707
    restart: unless-stopped
    expose:
      - 3313
    environment:
      APP_URL: ${APP_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
    volumes:
      - transmute-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--tries=1", "http://localhost:3313/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  transmute-data: {}
