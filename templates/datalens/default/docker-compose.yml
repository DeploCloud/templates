services:
  datalens:
    image: ghcr.io/datalens-tech/datalens-ui:0.3831.0@sha256:5c720832463cc54c43307a9aeafb8f881fb54facc548edac35efb8ccfe327b0f
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "US_DYNAMIC_MASTER_TOKEN_PRIVATE_KEY=ui-us-auth.key", "AUTH_TOKEN_PUBLIC_KEY=auth-token.pub", "--", "/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    expose:
      - 8080
    environment:
      APP_MODE: full
      APP_ENV: production
      APP_INSTALLATION: opensource
      AUTH_POLICY: disabled
      US_ENDPOINT: http://datalens-us:8080
      AUTH_ENDPOINT: http://datalens-auth:8080
      BI_API_ENDPOINT: http://datalens-control-api:8080
      BI_DATA_ENDPOINT: http://datalens-data-api:8080
      META_MANAGER_ENDPOINT: http://datalens-meta-manager:8080
      US_MASTER_TOKEN: ${US_MASTER_TOKEN}
      RELEASE_VERSION: "2.9.0"
      HC: "0"
      YANDEX_MAP_ENABLED: "0"
      EXPORT_WORKBOOK_ENABLED: "true"
      AUTH_ENABLED: "true"
      AUTH_MASTER_TOKEN: ${AUTH_MASTER_TOKEN}
      AUTH_SIGNUP_DISABLED: ${AUTH_SIGNUP_DISABLED}
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully
      datalens-us:
        condition: service_started

  datalens-ui-api:
    image: ghcr.io/datalens-tech/datalens-ui:0.3831.0@sha256:5c720832463cc54c43307a9aeafb8f881fb54facc548edac35efb8ccfe327b0f
    restart: unless-stopped
    environment:
      APP_MODE: api
      APP_ENV: production
      APP_INSTALLATION: opensource
      US_ENDPOINT: http://datalens-us:8080
      BI_API_ENDPOINT: http://datalens-control-api:8080
    depends_on:
      - datalens-us

  datalens-us:
    image: ghcr.io/datalens-tech/datalens-us:1.39.0@sha256:9f13b3cec8d27f5e39064c083dbd22c7002f78d86830f3dd476b7ba42d397b43
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "BI_MASTER_TOKEN_PUBLIC_KEY_PRIMARY=bi-us-auth.pub", "UI_MASTER_TOKEN_PUBLIC_KEY_PRIMARY=ui-us-auth.pub", "AUTH_TOKEN_PUBLIC_KEY=auth-token.pub", "--", "/opt/app/scripts/preflight.sh"]
    environment:
      APP_INSTALLATION: opensource
      APP_ENV: prod
      APP_PORT: "8080"
      AUTH_ENDPOINT: http://datalens-auth:8080
      MASTER_TOKEN: ${US_MASTER_TOKEN}
      AUTH_MASTER_TOKEN: ${AUTH_MASTER_TOKEN}
      POSTGRES_DSN_LIST: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@datalens-db:5432/pg-us-db
      US_SURPRESS_DB_STATUS_LOGS: "true"
      SKIP_INSTALL_DB_EXTENSIONS: "1"
      USE_DEMO_DATA: "0"
      HC: "0"
      AUTH_ENABLED: "true"
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully
      datalens-db:
        condition: service_healthy

  datalens-auth:
    image: ghcr.io/datalens-tech/datalens-auth:0.27.0@sha256:090194d29eb84fecec467afb032df2129e4d3a0b9560cb0c291047bb46bc51cd
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "TOKEN_PRIVATE_KEY=auth-token.key", "TOKEN_PUBLIC_KEY=auth-token.pub", "--", "/opt/app/scripts/preflight.sh"]
    environment:
      APP_INSTALLATION: opensource
      APP_ENV: prod
      MASTER_TOKEN: ${AUTH_MASTER_TOKEN}
      US_MASTER_TOKEN: ${US_MASTER_TOKEN}
      POSTGRES_DSN_LIST: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@datalens-db:5432/pg-auth-db
      US_SURPRESS_DB_STATUS_LOGS: "true"
      SKIP_INSTALL_DB_EXTENSIONS: "1"
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_SIGNUP_DISABLED: ${AUTH_SIGNUP_DISABLED}
      UI_APP_ENDPOINT: ${UI_APP_ENDPOINT}
      DISABLE_WILDCARD_COOKIE: "true"
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully
      datalens-db:
        condition: service_healthy

  datalens-control-api:
    image: ghcr.io/datalens-tech/datalens-control-api:0.2457.0@sha256:1fa416302f8339362bbd940ba1c49c3275f5a22413ee354373b3cdca2e9117f0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "US_DYNAMIC_AUTH_PRIVATE_KEY=bi-us-auth.key", "AUTH__JWT_KEY=auth-token.pub", "--", "/etc/service/dl_api/run"]
    environment:
      BI_API_UWSGI_WORKERS_COUNT: "2"
      RQE_FORCE_OFF: "1"
      RQE_SECRET_KEY: ""
      DL_CRY_ACTUAL_KEY_ID: KEY
      DL_CRY_KEY_VAL_ID_KEY: ${CONTROL_API_CRYPTO_KEY}
      US_HOST: http://datalens-us:8080
      US_MASTER_TOKEN: ${US_MASTER_TOKEN}
      CONNECTOR_AVAILABILITY_VISIBLE: clickhouse,postgres,chyt,ydb,mysql,greenplum,mssql,oracle,trino,appmetrica_api,metrika_api
      AUTH__TYPE: NATIVE
      AUTH__JWT_ALGORITHM: PS256
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully

  datalens-data-api:
    image: ghcr.io/datalens-tech/datalens-data-api:0.2457.0@sha256:c7448f7d07851541181410f8fbf4b17c4bce28cbea11bbe4c51730f337636c37
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "US_DYNAMIC_AUTH_PRIVATE_KEY=bi-us-auth.key", "AUTH__JWT_KEY=auth-token.pub", "--", "/etc/service/dl_api/run"]
    environment:
      GUNICORN_WORKERS_COUNT: "2"
      RQE_FORCE_OFF: "1"
      CACHES_ON: "0"
      MUTATIONS_CACHES_ON: "0"
      RQE_SECRET_KEY: ""
      DL_CRY_ACTUAL_KEY_ID: KEY
      DL_CRY_KEY_VAL_ID_KEY: ${CONTROL_API_CRYPTO_KEY}
      BI_COMPENG_PG_ON: "1"
      BI_COMPENG_PG_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@datalens-db:5432/pg-compeng-db
      US_HOST: http://datalens-us:8080
      US_MASTER_TOKEN: ${US_MASTER_TOKEN}
      AUTH__TYPE: NATIVE
      AUTH__JWT_ALGORITHM: PS256
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully
      datalens-db:
        condition: service_healthy

  datalens-meta-manager:
    image: ghcr.io/datalens-tech/datalens-meta-manager:0.52.0@sha256:d3c0c6041506d1f7fb0f66523639376b149866e01b0d4d888009059c7365ef11
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "TEMPORAL_AUTH_PRIVATE_KEY=temporal-auth.key", "AUTH_TOKEN_PUBLIC_KEY=auth-token.pub", "--", "/opt/app/scripts/preflight.sh"]
    environment:
      APP_INSTALLATION: opensource
      APP_ENV: prod
      APP_PORT: "8080"
      US_MASTER_TOKEN: ${US_MASTER_TOKEN}
      EXPORT_DATA_VERIFICATION_KEY: ${EXPORT_DATA_VERIFICATION_KEY}
      POSTGRES_DSN_LIST: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@datalens-db:5432/pg-meta-manager-db
      US_ENDPOINT: http://datalens-us:8080
      UI_API_ENDPOINT: http://datalens-ui-api:8080
      TEMPORAL_ENDPOINT: datalens-temporal:7233
      TEMPORAL_AUTH_ENABLED: "true"
      AUTH_ENABLED: "true"
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully
      datalens-temporal:
        condition: service_healthy
      datalens-ui-api:
        condition: service_started

  datalens-temporal:
    image: ghcr.io/datalens-tech/datalens-temporal:1.27.2@sha256:e3649e0a76e8ca0adbfa3d9bd1cc36395623049ddedbad926d09c9b979e29579
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/keyenv.sh", "TEMPORAL_AUTH_PUBLIC_KEY=temporal-auth.pub", "--", "/etc/temporal/init-temporal.sh"]
    environment:
      POSTGRES_HOST: datalens-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pg-temporal-db
      POSTGRES_DB_VISIBILITY: pg-temporal-visibility-db
      POSTGRES_TLS_ENABLED: "false"
      POSTGRES_TLS_DISABLE_HOST_VERIFICATION: "true"
      TEMPORAL_AUTH_ENABLED: "true"
      NAMESPACES: meta-manager
    volumes:
      - ./keyenv.sh:/keyenv.sh:ro
      - datalens-keys:/keys:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/keyenv.sh", "TEMPORAL_AUTH_PRIVATE_KEY=temporal-auth.key", "--", "/etc/temporal/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    depends_on:
      datalens-keygen:
        condition: service_completed_successfully
      datalens-db:
        condition: service_healthy

  datalens-db:
    image: ghcr.io/datalens-tech/datalens-postgres:16-1.3.0@sha256:37ba1c536c68fb5c0f63bc686897ea7bf654e6195e88f450437c020a063163b4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INIT_DB_DEMO: "0"
      INIT_DEMO_DATA: "0"
    volumes:
      - datalens-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d pg-us-db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # One-shot: the RSA key pairs upstream's init.sh generates, kept in a volume.
  datalens-keygen:
    image: ghcr.io/datalens-tech/datalens-postgres:16-1.3.0@sha256:37ba1c536c68fb5c0f63bc686897ea7bf654e6195e88f450437c020a063163b4
    restart: "no"
    entrypoint: ["python3", "/keygen.py"]
    volumes:
      - ./keygen.py:/keygen.py:ro
      - datalens-keys:/keys

volumes:
  datalens-db: {}
  datalens-keys: {}
