services:
  grist:
    image: gristlabs/grist:1.7.22@sha256:c2221950675081c79a06a44c27f8c65cc96c43d93d76f2b3214d8dbdff709355
    restart: unless-stopped
    expose:
      - 8484
    environment:
      APP_HOME_URL: ${APP_HOME_URL}
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET}
      GRIST_BOOT_KEY: ${GRIST_BOOT_KEY}
    volumes:
      - grist-data:/persist
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8484/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  grist-data: {}
