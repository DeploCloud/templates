services:
  novu-dashboard:
    image: ghcr.io/novuhq/novu/dashboard:3.20.0@sha256:c24929178f4a10968ab7511af19c3f2ae157096aba6e16e5b042cafb835b2bc2
    restart: unless-stopped
    expose:
      - 4000
    environment:
      VITE_API_HOSTNAME: ${NOVU_URL}
      VITE_WEBSOCKET_HOSTNAME: ${NOVU_URL}
    depends_on:
      novu-api:
        condition: service_healthy
      novu-worker:
        condition: service_healthy

  novu-api:
    image: ghcr.io/novuhq/novu/api:3.20.0@sha256:4516bb5a2507303d48287cde50cf5919eb937b9e074b36bb61bd634dada800c0
    restart: unless-stopped
    # pm2 "-i max" upstream forks one process per host CPU
    entrypoint: ["pm2-runtime", "start", "dist/main.js", "-i", "1"]
    expose:
      - 3000
    environment:
      NODE_ENV: local
      PORT: 3000
      API_ROOT_URL: ${NOVU_URL}
      FRONT_BASE_URL: ${NOVU_URL}
      DASHBOARD_URL: ${NOVU_URL}
      MONGO_URL: mongodb://novu:${MONGO_PASSWORD}@novu-mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ""
      REDIS_CACHE_SERVICE_PORT: 6379
      S3_LOCAL_STACK: ${S3_LOCAL_STACK}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY}
      DISABLE_USER_REGISTRATION: ${DISABLE_USER_REGISTRATION}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      NEW_RELIC_ENABLED: "false"
      IS_API_IDEMPOTENCY_ENABLED: "false"
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
      IS_V2_ENABLED: "true"
      IS_SELF_HOSTED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy

  novu-worker:
    image: ghcr.io/novuhq/novu/worker:3.20.0@sha256:bc04a067256787c20ccacd1724a734b732581d58d277bcf75d61b71e27f325bb
    restart: unless-stopped
    entrypoint: ["pm2-runtime", "start", "dist/main.js", "-i", "1"]
    environment:
      NODE_ENV: local
      PORT: 3004
      API_ROOT_URL: http://novu-api:3000
      MONGO_URL: mongodb://novu:${MONGO_PASSWORD}@novu-mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ""
      REDIS_CACHE_SERVICE_PORT: 6379
      S3_LOCAL_STACK: ${S3_LOCAL_STACK}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      NEW_RELIC_ENABLED: "false"
      BROADCAST_QUEUE_CHUNK_SIZE: 100
      MULTICAST_QUEUE_CHUNK_SIZE: 100
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy

  novu-ws:
    image: ghcr.io/novuhq/novu/ws:3.20.0@sha256:fd3773e82f0f948cc20f66517707dd936b7e4f79219d2808894111837d40e818
    restart: unless-stopped
    entrypoint: ["pm2-runtime", "start", "dist/main.js", "-i", "1"]
    expose:
      - 3002
    environment:
      NODE_ENV: local
      PORT: 3002
      MONGO_URL: mongodb://novu:${MONGO_PASSWORD}@novu-mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: novu-redis
      REDIS_PORT: 6379
      REDIS_DB_INDEX: 2
      JWT_SECRET: ${JWT_SECRET}
      NEW_RELIC_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      novu-mongodb:
        condition: service_healthy
      novu-redis:
        condition: service_healthy

  novu-mongodb:
    image: mongo:8.0.38@sha256:bdc216e9d5a6ec2cfdac789b5832fdab64cd32055f59885cae918a92de63c361
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: novu
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - novu-mongodb:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  novu-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    volumes:
      - novu-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  novu-mongodb: {}
  novu-redis: {}
