services:
  frappe-helpdesk:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    expose:
      - 8080
    environment:
      BACKEND: frappe-helpdesk-backend:8000
      SOCKETIO: frappe-helpdesk-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      TRUST_UPSTREAM_FORWARDED_PROTO: "on"
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - frappe-helpdesk-backend
      - frappe-helpdesk-websocket

  frappe-helpdesk-backend:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: unless-stopped
    environment:
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-configurator:
        condition: service_completed_successfully

  frappe-helpdesk-configurator:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell;
    environment:
      DB_HOST: frappe-helpdesk-db
      DB_PORT: "3306"
      REDIS_CACHE: frappe-helpdesk-redis-cache:6379
      REDIS_QUEUE: frappe-helpdesk-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-db:
        condition: service_healthy
      frappe-helpdesk-redis-cache:
        condition: service_healthy
      frappe-helpdesk-redis-queue:
        condition: service_healthy

  frappe-helpdesk-create-site:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >-
        wait-for-it -t 120 frappe-helpdesk-db:3306;
        wait-for-it -t 120 frappe-helpdesk-redis-cache:6379;
        wait-for-it -t 120 frappe-helpdesk-redis-queue:6379;
        if [ -d "sites/$$SITE_NAME" ]; then
          bench --site "$$SITE_NAME" migrate || exit 1;
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$$DB_PASSWORD" --install-app helpdesk --set-default "$$SITE_NAME" || exit 1;
        fi;
        bench --site "$$SITE_NAME" set-config host_name "$$SITE_URL";
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      SITE_NAME: ${SITE_NAME}
      SITE_URL: ${SITE_URL}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-configurator:
        condition: service_completed_successfully

  frappe-helpdesk-websocket:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://frappe-helpdesk-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://frappe-helpdesk-redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-configurator:
        condition: service_completed_successfully

  frappe-helpdesk-queue-short:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      FRAPPE_REDIS_CACHE: redis://frappe-helpdesk-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://frappe-helpdesk-redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-configurator:
        condition: service_completed_successfully

  frappe-helpdesk-queue-long:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      FRAPPE_REDIS_CACHE: redis://frappe-helpdesk-redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://frappe-helpdesk-redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-configurator:
        condition: service_completed_successfully

  frappe-helpdesk-scheduler:
    image: ghcr.io/frappe/helpdesk:v16.2.1@sha256:d212bfa67309a7b267d87ca6132a33f73fa569b016ae6200d05b6ccf1ff946ab
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-helpdesk-configurator:
        condition: service_completed_successfully

  frappe-helpdesk-db:
    image: mariadb:11.8.9@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  frappe-helpdesk-redis-cache:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frappe-helpdesk-redis-queue:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-queue-data:/data

volumes:
  sites: {}
  logs: {}
  db-data: {}
  redis-queue-data: {}
