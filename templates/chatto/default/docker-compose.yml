services:
  chatto:
    image: ghcr.io/chattocorp/chatto:0.5.0@sha256:5990c82dbb6d6d8c9464dff9301060ea5a5253ccb26a39f0ad62bbe816df9bf0
    restart: unless-stopped
    expose:
      - 4000
    environment:
      CHATTO_WEBSERVER_URL: ${CHATTO_WEBSERVER_URL}
      CHATTO_WEBSERVER_PORT: 4000
      CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET: ${CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET}
      CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET: ${CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET}
      CHATTO_CORE_SECRET_KEY: ${CHATTO_CORE_SECRET_KEY}
      CHATTO_CORE_ASSETS_SIGNING_SECRET: ${CHATTO_CORE_ASSETS_SIGNING_SECRET}
      CHATTO_NATS_EMBEDDED_ENABLED: "true"
      CHATTO_NATS_EMBEDDED_DATA_DIR: /data
      CHATTO_NATS_EMBEDDED_SYNC_INTERVAL: always
      CHATTO_ASSET_PROCESSING_ENABLED: "true"
      CHATTO_OPERATOR_API_ENABLED: "true"
    volumes:
      - chatto-data:/data

volumes:
  chatto-data: {}
