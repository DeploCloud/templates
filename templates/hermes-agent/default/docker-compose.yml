services:
  hermes-agent:
    image: nousresearch/hermes-agent:v0.23.2@sha256:d6746a084e9341baada483e3d6210444d3c1aeb7c130f0915150065fb2851459
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: 1gb
    expose:
      - 9119
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PUBLIC_URL: ${HERMES_DASHBOARD_PUBLIC_URL}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9119/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  hermes-data: {}
