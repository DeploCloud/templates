services:
  languagetool:
    image: erikvl87/languagetool:6.8@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    restart: unless-stopped
    expose:
      - 8010
    environment:
      Java_Xms: ${JAVA_XMS}
      Java_Xmx: ${JAVA_XMX}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --data 'language=en-US&text=a simple test' http://localhost:8010/v2/check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
