services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    restart: always
    expose:
      - 5678
    environment:
      N8N_HOST: "${N8N_HOST}"
      N8N_PORT: "${N8N_PORT}"
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: "https://${N8N_HOST}/"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE}"
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
    volumes:
      - n8n_data:/home/node/.n8n
  n8n-runners:
    image: n8nio/runners:2.44.6@sha256:255e69ed23d8b3866e593f6e105e7e12cafc81c4d1966a8f8702115af1032461
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
    depends_on:
      - n8n
volumes:
  n8n_data: null
