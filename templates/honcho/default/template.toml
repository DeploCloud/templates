[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "honcho"
port = 8_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
DB_CONNECTION_URI = "postgresql+psycopg://honcho:${db_password}@honcho-db:5432/honcho"
CACHE_URL = "redis://honcho-redis:6379/0?suppress=true"
AUTH_USE_AUTH = "true"
AUTH_JWT_SECRET = "${hash:64}"
LLM_OPENAI_API_KEY = ""
LOG_LEVEL = "INFO"
