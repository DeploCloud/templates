services:
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.57.0@sha256:e5e3b150b3cb0090975605254f255164567d67e233634199fb20972e3eaff300
    restart: unless-stopped
    expose:
      - 3592
    volumes:
      - cerbos-policies:/policies
      - ./example_policy.yaml:/policies/example_policy.yaml:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=http"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cerbos-policies: {}
