[config]

[[config.domains]]
serviceName = "cerbos"
port = 3_592
host = "${domain}"

[[config.mounts]]
filePath = "example_policy.yaml"
content = """---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "document"
  rules:
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["user"]

    - actions: ["edit", "delete"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          expr: request.resource.attr.owner == request.principal.id

    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
"""
