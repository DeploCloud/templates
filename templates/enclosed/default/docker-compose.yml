services:
  enclosed:
    image: corentinth/enclosed:1.16.1-rootless@sha256:26cfc00ba76f20b9ed7c5f867d241eddb02379c39090e9ad88c08c671d31d5e9
    restart: unless-stopped
    expose:
      - 8787
    environment:
      AUTHENTICATION_JWT_SECRET: ${AUTHENTICATION_JWT_SECRET}
      PUBLIC_IS_AUTHENTICATION_REQUIRED: ${PUBLIC_IS_AUTHENTICATION_REQUIRED}
      AUTHENTICATION_USERS: ${AUTHENTICATION_USERS}
    volumes:
      - enclosed-data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  enclosed-data: {}
