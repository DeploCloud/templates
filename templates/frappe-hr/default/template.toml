[variables]
db_password = "${password:32}"
admin_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "frappe-hr"
port = 8080
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
ADMIN_PASSWORD = "${admin_password}"
SITE_NAME = "${domain}"
SITE_URL = "https://${domain}"
