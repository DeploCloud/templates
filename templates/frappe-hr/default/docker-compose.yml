services:
  frappe-hr:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: unless-stopped
    command:
      - nginx-entrypoint.sh
    expose:
      - 8080
    environment:
      BACKEND: frappe-hr-backend:8000
      SOCKETIO: frappe-hr-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - frappe-hr-backend
      - frappe-hr-websocket

  frappe-hr-backend:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-configurator:
        condition: service_completed_successfully

  frappe-hr-configurator:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: frappe-hr-db
      DB_PORT: "3306"
      REDIS_CACHE: frappe-hr-redis-cache:6379
      REDIS_QUEUE: frappe-hr-redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-db:
        condition: service_healthy
      frappe-hr-redis-cache:
        condition: service_healthy
      frappe-hr-redis-queue:
        condition: service_healthy

  frappe-hr-create-site:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >-
        wait-for-it -t 120 frappe-hr-db:3306;
        wait-for-it -t 120 frappe-hr-redis-cache:6379;
        wait-for-it -t 120 frappe-hr-redis-queue:6379;
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$$DB_PASSWORD" --install-app erpnext --install-app hrms --set-default "$$SITE_NAME" || exit 1;
        fi;
        bench --site "$$SITE_NAME" set-config host_name "$$SITE_URL";
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      SITE_NAME: ${SITE_NAME}
      SITE_URL: ${SITE_URL}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-configurator:
        condition: service_completed_successfully

  frappe-hr-websocket:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: unless-stopped
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-configurator:
        condition: service_completed_successfully

  frappe-hr-queue-short:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-configurator:
        condition: service_completed_successfully

  frappe-hr-queue-long:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-configurator:
        condition: service_completed_successfully

  frappe-hr-scheduler:
    image: ghcr.io/frappe/hrms:v15.64.9@sha256:217799e73e7a357b46968ca4d7a45af113aa991bc4bcabfdb7a9954c3d997e7d
    restart: unless-stopped
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      frappe-hr-configurator:
        condition: service_completed_successfully

  frappe-hr-db:
    image: mariadb:10.11.19@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  frappe-hr-redis-cache:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frappe-hr-redis-queue:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-queue-data:/data

volumes:
  sites: {}
  logs: {}
  db-data: {}
  redis-queue-data: {}
