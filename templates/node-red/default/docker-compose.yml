services:
  node-red:
    image: nodered/node-red:5.0.9@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
    restart: unless-stopped
    expose:
      - 1880
    environment:
      TZ: ${TZ}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
    volumes:
      - node-red-data:/data

volumes:
  node-red-data: {}
