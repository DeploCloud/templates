services:
  livebook:
    image: ghcr.io/livebook-dev/livebook:0.19.10@sha256:216af978b9300980117ae8a362f866c9414026d55f98f15fa6d35def0699a348
    restart: unless-stopped
    expose:
      - 8080
    environment:
      LIVEBOOK_PORT: "8080"
      LIVEBOOK_DATA_PATH: /data
      LIVEBOOK_PASSWORD: ${LIVEBOOK_PASSWORD}
      LIVEBOOK_SECRET_KEY_BASE: ${LIVEBOOK_SECRET_KEY_BASE}
    volumes:
      - livebook-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/public/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  livebook-data: {}
