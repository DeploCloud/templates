[variables]
db_password = "${password:32}"
jwt_secret = "${password:64}"
main_secret = "${password:64}"

[config]
mounts = []

[[config.domains]]
serviceName = "svix"
port = 8_071
host = "${domain}"

[config.env]
SVIX_DB_PASSWORD = "${db_password}"
SVIX_JWT_SECRET = "${jwt_secret}"
SVIX_MAIN_SECRET = "${main_secret}"
SVIX_DB_POOL_MAX_SIZE = "20"
