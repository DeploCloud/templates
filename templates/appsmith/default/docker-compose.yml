services:
  appsmith:
    image: appsmith/appsmith-ce:v2.7.1@sha256:0d2f4d4122b47e0a0b80fe7681d7bf8dfb4b14ccb9f6ee3e6092968c22c04b15
    restart: unless-stopped
    expose:
      - 80
    environment:
      APPSMITH_BASE_URL: ${APPSMITH_BASE_URL}
      APPSMITH_ENCRYPTION_PASSWORD: ${APPSMITH_ENCRYPTION_PASSWORD}
      APPSMITH_ENCRYPTION_SALT: ${APPSMITH_ENCRYPTION_SALT}
    volumes:
      - appsmith-stacks:/appsmith-stacks

volumes:
  appsmith-stacks: {}
