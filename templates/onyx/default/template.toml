[variables]
db_password = "${password:32}"
opensearch_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "onyx-nginx"
port = 80
host = "${domain}"

[config.env]
WEB_DOMAIN = "https://${domain}"
USER_AUTH_SECRET = "${hash:64}"
ENCRYPTION_KEY_SECRET = "${hash:32}"
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "${db_password}"
OPENSEARCH_ADMIN_PASSWORD = "${opensearch_password}Aa1-"
OPENSEARCH_JAVA_OPTS = "-Xms2g -Xmx2g"

[[config.mounts]]
filePath = "nginx.conf"
content = """map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80 default_server;
    server_tokens off;
    client_max_body_size 5G;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_redirect off;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $onyx_api http://onyx-api:8080;
    set $onyx_web http://onyx-web:3000;

    location ~ ^/(auth/saml|scim)(/.*)?$ {
        proxy_pass $onyx_api;
    }

    location ~ ^/(api|openapi.json)(/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $onyx_api;
    }

    location / {
        proxy_pass $onyx_web;
    }
}
"""
