services:
  onyx-nginx:
    image: nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      onyx-api:
        condition: service_healthy
      onyx-web:
        condition: service_healthy

  onyx-api:
    image: onyxdotapp/onyx-backend:v5.1.3@sha256:5c50b2c74d9e73a8e70b5113a0a8060e51a3b5463e56cb32b04ca628eee55fcc
    restart: unless-stopped
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn onyx.main:app --host 0.0.0.0 --port 8080"]
    expose:
      - 8080
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      USER_AUTH_SECRET: ${USER_AUTH_SECRET}
      ENCRYPTION_KEY_SECRET: ${ENCRYPTION_KEY_SECRET}
      POSTGRES_HOST: onyx-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DISABLE_VECTOR_DB: "true"
      FILE_STORE_BACKEND: postgres
      CACHE_BACKEND: postgres
      AUTH_BACKEND: postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 600s
    depends_on:
      onyx-db:
        condition: service_healthy

  onyx-web:
    image: onyxdotapp/onyx-web-server:v5.1.3@sha256:8bf2eb34e389eaf41ad6f2a259f5742ab02f1c0bd28770109444905f10140877
    restart: unless-stopped
    expose:
      - 3000
    environment:
      INTERNAL_URL: http://onyx-api:8080
      WEB_DOMAIN: ${WEB_DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      - onyx-api

  onyx-db:
    image: postgres:15.20-alpine@sha256:9c4538c0dce5c926d5e1d9143f7d4a5698b575202ea116810ec831439a5c167b
    restart: unless-stopped
    shm_size: 1g
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - onyx-db:/var/lib/postgresql/data

volumes:
  onyx-db: {}
