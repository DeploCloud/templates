[config]

[[config.domains]]
serviceName = "gatus"
port = 8_080
host = "${domain}"

[[config.mounts]]
filePath = "config.yaml"
content = """storage:
  type: sqlite
  path: /data/data.db

endpoints:
  - name: example
    group: websites
    url: "https://example.org/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 48h"
"""
