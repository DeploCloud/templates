[variables]
db_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "gatus"
port = 8_080
host = "${domain}"

[config.env]
POSTGRES_PASSWORD = "${db_password}"

[[config.mounts]]
filePath = "config.yaml"
content = """storage:
  type: postgres
  path: "postgres://gatus:${db_password}@gatus-db:5432/gatus?sslmode=disable"

endpoints:
  - name: example
    group: websites
    url: "https://example.org/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 48h"
"""
