services:
  gatus:
    image: ghcr.io/twin/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    depends_on:
      gatus-db:
        condition: service_healthy

  gatus-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatus
      POSTGRES_USER: gatus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatus -d gatus"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - gatus-db:/var/lib/postgresql

volumes:
  gatus-db: {}
