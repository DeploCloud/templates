name: reloop

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

x-backend-depends: &backend-depends
  <<: *infra-ready
  migrate:
    condition: service_completed_successfully

x-backend: &backend
  restart: unless-stopped
  env_file:
    - .env
  depends_on: *backend-depends
  dns:
    - 1.1.1.1
    - 8.8.8.8
  networks:
    - reloop
  <<: *logging

x-frontend: &frontend
  restart: unless-stopped
  environment:
    NODE_ENV: production
  networks:
    - reloop
  <<: *logging

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: reloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - reloop
    <<: *logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: reloop-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --dir
      - /data
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - reloop
    <<: *logging

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: reloop-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - reloop
    <<: *logging

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: reloop-proxy
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      reloop:
        aliases:
          - ${RELOOP_DOMAIN}
          - ${RELOOP_TRACKING_HOST}
    <<: *logging

  auth:
    <<: *backend
    image: reloopsh/be-auth:latest@sha256:ae4935fde2d62e67740b63b2e41d90b7fd269cf0caa642d2770f2775d0a1bb7b
    container_name: reloop-auth
    environment:
      PORT: 8000
    volumes:
      - ./admin-setup.key:/run/reloop/admin-setup.key
      - ./.env:/run/reloop/.env

  domain:
    <<: *backend
    image: reloopsh/be-domain:latest@sha256:23b4a93ec1bf0f3a86877a079ab25f2a5942984cfdc3d15ec6f25073c7a5adec
    container_name: reloop-domain
    environment:
      PORT: 8011

  api-key:
    <<: *backend
    image: reloopsh/be-api-key:latest@sha256:8b17af5a35d96b01ca2959de5dc479ac56b49384a5ae6cb7538e996855965a7e
    container_name: reloop-api-key
    environment:
      PORT: 8012

  webhook:
    <<: *backend
    image: reloopsh/be-webhook:latest@sha256:bd95e1212009145a4fa5883604a38cd18d40f2f8a3e185eecad108eb34cf75f1
    container_name: reloop-webhook
    environment:
      PORT: 8013

  contacts:
    <<: *backend
    image: reloopsh/be-contacts:latest@sha256:2694ae9be48b636bcbb61034d58b7f3d03bf7ff74f464d6f09b69f715afbd490
    container_name: reloop-contacts
    environment:
      PORT: 8014

  mail:
    <<: *backend
    image: reloopsh/be-mail:latest@sha256:e9f5b2d155fd2ed4f741a4450dc878312d9550a48c8bbbd336ee89ec70325ae5
    container_name: reloop-mail
    environment:
      PORT: 8015
      KUMOMTA_HTTP_URL: http://smtp:8000

  logs:
    <<: *backend
    image: reloopsh/be-logs:latest@sha256:a1a657e5403586a6ef074b387971df2b69f05d0e6f4e4a409742fb7f96d7a864
    container_name: reloop-logs
    environment:
      PORT: 8016

  workflow:
    <<: *backend
    image: reloopsh/be-workflow:latest@sha256:fbd91970aef63ad84c38684cee756f2338288b48196142de3aba17f4484b6ff5
    container_name: reloop-workflow
    environment:
      PORT: 8017

  upload:
    <<: *backend
    image: reloopsh/be-upload:latest@sha256:59b534d3a84bc9fd58437e12482b504fc57ba9cf786906e196dc7ffd8ed60efa
    container_name: reloop-upload
    profiles:
      - storage
    environment:
      PORT: 8018

  template:
    <<: *backend
    image: reloopsh/be-template:latest@sha256:cbbd547809131ef6ac19ba7b1d770dd02af6a7d7219182ebf34fa53ca890d4d5
    container_name: reloop-template
    environment:
      PORT: 8019

  campaigns:
    <<: *backend
    image: reloopsh/be-campaigns:latest@sha256:ae783db22e3f7bd6f427bfca4e31ac8f865fe4d173ddaca326377d84278f635f
    container_name: reloop-campaigns
    environment:
      PORT: 8027

  inbox:
    <<: *backend
    image: reloopsh/be-inbox:latest@sha256:6c192ba5ca73407a0be035e94001257c2eb3e40dc5c5fb84795577c3448db37b
    container_name: reloop-inbox
    environment:
      PORT: 8028

  email:
    <<: *backend
    image: reloopsh/be-email:latest@sha256:96e07d32721b7abc97f1a1db7909f1062733d364755c72cd734bb30d6b1e223f
    container_name: reloop-email
    environment:
      PORT: 8022

  spam:
    image: reloopsh/be-spam:latest@sha256:67805ce497b5f047e9044b4f1050d1771062e26cf5aa09106adace1da855045a
    container_name: reloop-spam
    restart: unless-stopped
    environment:
      RSPAMD_REDIS_SERVERS: redis:6379
      RSPAMD_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - rspamd-data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  smtp:
    image: reloopsh/be-smtp:latest@sha256:93540abf9aeabb0c831b7fcb6e976f8db9dc3a63e9408683f1ce0f0d6c148f50
    container_name: reloop-smtp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: ${RELOOP_DOMAIN}
      EGRESS_SOURCE_MAP: ${EGRESS_SOURCE_MAP:-}
      KUMOMTA_MIN_FREE_SPACE: ${KUMOMTA_MIN_FREE_SPACE:-5%}
      KUMOMTA_MIN_FREE_INODES: ${KUMOMTA_MIN_FREE_INODES:-0}
    ports:
      - "465:465"
      - "587:587"
    volumes:
      - smtp-data:/var/spool/kumomta/data
      - smtp-meta:/var/spool/kumomta/meta
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  inbound:
    image: reloopsh/be-inbound:latest@sha256:648f9b5550d06608fab70976903bf57905439ca9adcdb6d923c47dc4a82f9348
    container_name: reloop-inbound
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: ${RELOOP_INBOUND_HOST}
      INBOUND_HOSTNAME: ${RELOOP_INBOUND_HOST}
      KUMOMTA_MIN_FREE_SPACE: ${KUMOMTA_MIN_FREE_SPACE:-5%}
      KUMOMTA_MIN_FREE_INODES: ${KUMOMTA_MIN_FREE_INODES:-0}
    ports:
      - "25:25"
    volumes:
      - inbound-data:/var/spool/kumomta/data
      - inbound-meta:/var/spool/kumomta/meta
    depends_on:
      nats:
        condition: service_healthy
      spam:
        condition: service_started
    networks:
      - reloop
    <<: *logging

  dashboard:
    <<: *frontend
    image: reloopsh/fe-dashboard:latest@sha256:4109db39a399869d01b2b13a964e54d5fcbf67385ef50dc786f83fe4a08d1496
    container_name: reloop-dashboard
    environment:
      NODE_ENV: production
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}

  links:
    <<: *frontend
    image: reloopsh/fe-links:latest@sha256:542132425f5c721d8da99c686edd5fcbf7bb58bc8a3d3379251d6bcff5a4c418
    container_name: reloop-links
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_URL: ${TRACKING_BASE_URL}
      INTERNAL_API_URL: http://contacts:8014/api/contacts
      INTERNAL_MAIL_API_URL: http://mail:8015/api/mail

  migrate:
    image: reloopsh/be-auth:latest@sha256:ae4935fde2d62e67740b63b2e41d90b7fd269cf0caa642d2770f2775d0a1bb7b
    restart: "no"
    working_dir: /app/packages/db
    entrypoint: ["/app/node_modules/.bin/drizzle-kit"]
    command: ["push", "--force"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  mcp:
    image: reloopsh/be-mcp:latest@sha256:fc67e79e30a25daed3306fe3f35693782c78fe1a3f270e22130011e1b4d5de3f
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8029"
      RELOOP_BASE_URL: "${BASE_URL}"
    networks:
      - reloop

networks:
  reloop:
    name: reloop

volumes:
  postgres-data:
  redis-data:
  nats-data:
  caddy-data:
  caddy-config:
  rspamd-data:
  smtp-data:
  smtp-meta:
  inbound-data:
  inbound-meta:
