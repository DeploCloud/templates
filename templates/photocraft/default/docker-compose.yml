services:
  photocraft:
    image: ghcr.io/mikapst/photocraft-web:v0.23.1@sha256:2b62d59ec4dcfff85501569565bb2e9e0e36b3994de9db90b6828ade08cede48
    restart: unless-stopped
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
