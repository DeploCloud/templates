services:
  nexus-repository:
    image: sonatype/nexus3:3.98.3@sha256:53ca1dc9580a3b616814694a28801bbf59c5e5423ad2d9b41e88cf93962c26b0
    restart: unless-stopped
    stop_grace_period: 2m
    expose:
      - 8081
    environment:
      NEXUS_DATASTORE_NEXUS_JDBCURL: jdbc:postgresql://nexus-repository-db:5432/${DB_NAME}
      NEXUS_DATASTORE_NEXUS_USERNAME: ${DB_USER}
      NEXUS_DATASTORE_NEXUS_PASSWORD: ${DB_PASSWORD}
      NEXUS_SECURITY_INITIAL_PASSWORD: ${NEXUS_SECURITY_INITIAL_PASSWORD}
      INSTALL4J_ADD_VM_PARAMS: ${INSTALL4J_ADD_VM_PARAMS}
    volumes:
      - nexus-data:/nexus-data
    depends_on:
      nexus-repository-db:
        condition: service_healthy

  nexus-repository-db:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nexus-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  nexus-data: {}
  nexus-db: {}
