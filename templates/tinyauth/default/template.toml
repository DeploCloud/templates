[variables]
admin_password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "tinyauth"
port = 3_000
host = "${domain}"

[config.env]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "${admin_password}"
TINYAUTH_APPURL = "https://${domain}"
TINYAUTH_AUTH_SECURECOOKIE = "true"
TINYAUTH_AUTH_SUBDOMAINSENABLED = "false"
TINYAUTH_LABELPROVIDER = "none"
