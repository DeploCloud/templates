services:
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.2.0@sha256:220aa235c76393a73fece831d7ba967b8698d3907fd8e3c4c952f699c7b142a5
    restart: unless-stopped
    expose:
      - 3000
    # Users need a bcrypt hash, so the admin is hashed from the generated password at start.
    entrypoint:
      - /bin/sh
      - -c
      - |
        hash=$$(NO_COLOR=1 tinyauth user create --username "$$ADMIN_USERNAME" --password "$$ADMIN_PASSWORD" | grep -o '\$$2[aby]\$$[0-9]*\$$[./A-Za-z0-9]*' | head -n 1)
        export TINYAUTH_AUTH_USERS="$$ADMIN_USERNAME:$$hash$${TINYAUTH_AUTH_USERS:+,$$TINYAUTH_AUTH_USERS}"
        exec tinyauth
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TINYAUTH_APPURL: ${TINYAUTH_APPURL}
      TINYAUTH_AUTH_SECURECOOKIE: ${TINYAUTH_AUTH_SECURECOOKIE}
      TINYAUTH_AUTH_SUBDOMAINSENABLED: ${TINYAUTH_AUTH_SUBDOMAINSENABLED}
      TINYAUTH_LABELPROVIDER: ${TINYAUTH_LABELPROVIDER}
    volumes:
      - tinyauth-data:/data

volumes:
  tinyauth-data: {}
