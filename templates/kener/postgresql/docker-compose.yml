services:
  kener:
    image: rajnandan1/kener:4.2.2@sha256:69352c486147816d5236c42ca55b08747365441f63bbf1a8c13d2941a72a088d
    restart: unless-stopped
    expose:
      - 3000
    environment:
      KENER_SECRET_KEY: ${KENER_SECRET_KEY}
      ORIGIN: ${ORIGIN}
      REDIS_URL: redis://kener-redis:6379
      DATABASE_URL: postgresql://kener:${DB_PASSWORD}@kener-db:5432/kener
    depends_on:
      kener-db:
        condition: service_healthy
      kener-redis:
        condition: service_healthy

  kener-db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_USER: kener
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: kener
    volumes:
      - kener-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kener -d kener"]
      interval: 10s
      timeout: 5s
      retries: 5

  kener-redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    volumes:
      - kener-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kener-postgres: {}
  kener-redis: {}
