services:
  # /opt/Lavalink/plugins is not in the image, so the volume starts root-owned; Lavalink runs as 322
  lavalink-init:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2@sha256:87ae53e60dc147c9dddb28e126ce503a26bc8d1477ed8d99543614677882afff
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "322:322", "/opt/Lavalink/plugins"]
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2@sha256:87ae53e60dc147c9dddb28e126ce503a26bc8d1477ed8d99543614677882afff
    restart: unless-stopped
    expose:
      - 2333
    environment:
      SERVER_PORT: "2333"
      SERVER_ADDRESS: 0.0.0.0
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD}
      LAVALINK_SERVER_SOURCES_YOUTUBE: "false"
      LAVALINK_PLUGINS_0_DEPENDENCY: ${LAVALINK_PLUGINS_0_DEPENDENCY}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins
    depends_on:
      lavalink-init:
        condition: service_completed_successfully

volumes:
  lavalink-plugins: {}
