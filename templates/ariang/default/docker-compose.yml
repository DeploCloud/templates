services:
  ariang:
    image: hurlenko/aria2-ariang:1.3.15@sha256:05d5dd74c8265b24530567da01602c64dd0bbb9b762635d50ef39dccbd543523
    restart: unless-stopped
    expose:
      - 8080
    environment:
      RPC_SECRET: ${RPC_SECRET}
      ARIA2RPCPORT: ${ARIA2RPCPORT}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ariang-data:/aria2/data
      - ariang-conf:/aria2/conf
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ariang-data: {}
  ariang-conf: {}
