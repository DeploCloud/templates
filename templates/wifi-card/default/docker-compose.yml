services:
  wifi-card:
    image: bndw/wifi-card:latest@sha256:1fba80961c623824bfc1528974f662e7b7f0dda3a01d208727e81f7cf6eed04a
    restart: unless-stopped
    expose:
      - 80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
