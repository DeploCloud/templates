[variables]
db_password = "${password:32}"
redis_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "reitti"
port = 8_080
host = "${domain}"

[config.env]
POSTGIS_DB = "reittidb"
POSTGIS_USER = "reitti"
POSTGIS_PASSWORD = "${db_password}"
REDIS_PASSWORD = "${redis_password}"
ADVERTISE_URI = "https://${domain}"
