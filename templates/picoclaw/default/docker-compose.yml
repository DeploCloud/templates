services:
  picoclaw:
    image: docker.io/sipeed/picoclaw:v0.3.1-launcher@sha256:ed830c6cb71f59785062433159c45c2363465cd02046f8dd2822bd24a39510c2
    restart: unless-stopped
    expose:
      - 18800
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:18800/launcher-login || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - picoclaw-data:/root/.picoclaw

volumes:
  picoclaw-data: {}
