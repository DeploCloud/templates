services:
  alist:
    image: xhofe/alist:v3.66.0@sha256:afa909f81817770520df07515287eb3df3d4e3c6631ca28b02cbae8499149b39
    restart: unless-stopped
    expose:
      - 5244
    environment:
      SITE_URL: ${SITE_URL}
      ALIST_ADMIN_PASSWORD: ${ALIST_ADMIN_PASSWORD}
      TZ: ${TZ}
    volumes:
      - alist-data:/opt/alist/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5244/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  alist-data: {}
