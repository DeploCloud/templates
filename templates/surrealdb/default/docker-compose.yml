services:
  surrealdb:
    image: surrealdb/surrealdb:v4.0.1@sha256:408eb8e5c9436670525e2bc2634b1e50ba74ce1b447eaf0094c35f73b67f9cb6
    restart: unless-stopped
    command: ["start", "surrealkv:/data/database.db"]
    expose:
      - 8000
    environment:
      SURREAL_USER: ${SURREAL_USER}
      SURREAL_PASS: ${SURREAL_PASS}
      SURREAL_LOG: ${SURREAL_LOG}
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  surrealdb-data: {}
