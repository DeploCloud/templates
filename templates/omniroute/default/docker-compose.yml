services:
  omniroute:
    image: ghcr.io/cheaper-inference/omniroute:3.8.54@sha256:2c4c755a54f8ce5341bc1856580b71f47a0f16a9afab4a55f84d540810631f68
    restart: unless-stopped
    stop_grace_period: 40s
    expose:
      - 20128
    environment:
      DATA_DIR: /app/data
      OMNIROUTE_PLUGINS_DIR: /app/data/plugins
      REDIS_URL: redis://omniroute-redis:6379
      REQUIRE_API_KEY: "true"
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL}
      BASE_URL: http://omniroute:20128
      AUTH_COOKIE_SECURE: "true"
      LIVE_WS_PUBLIC_URL: ${LIVE_WS_PUBLIC_URL}
      LIVE_WS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB}
    volumes:
      - omniroute-data:/app/data
    depends_on:
      omniroute-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  omniroute-redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  omniroute-data: {}
  omniroute-redis-data: {}
