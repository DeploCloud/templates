services:
  slash:
    image: yourselfhosted/slash:0.5.3@sha256:0658a3ea093c1c88d14f085272246dbbe98336581213dc258eb7c3581ac0f3ab
    restart: unless-stopped
    expose:
      - 5231
    environment:
      SLASH_DRIVER: postgres
      SLASH_DSN: ${SLASH_DSN}
    volumes:
      - slash-data:/var/opt/slash
    depends_on:
      slash-db:
        condition: service_healthy

  slash-db:
    image: postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: slash
      POSTGRES_USER: slash
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slash -d slash"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - slash-db:/var/lib/postgresql

volumes:
  slash-data: {}
  slash-db: {}
