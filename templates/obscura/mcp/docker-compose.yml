services:
  obscura:
    image: h4ckf0r0day/obscura:0.2.7@sha256:e70c2abc925f2194c9338762075432c69328032cae220d77393f1495e90c601a
    restart: unless-stopped
    command: ["mcp", "--http", "--host", "0.0.0.0", "--port", "3000"]
    expose:
      - 3000
    environment:
      OBSCURA_MCP_TOKEN: ${OBSCURA_MCP_TOKEN}
      OBSCURA_STORAGE_DIR: /home/nonroot
    volumes:
      - obscura-data:/home/nonroot

volumes:
  obscura-data: {}
