services:
  obscura:
    image: h4ckf0r0day/obscura:0.2.7@sha256:e70c2abc925f2194c9338762075432c69328032cae220d77393f1495e90c601a
    restart: unless-stopped
    # Port 80: the CDP server rejects requests whose Host port differs from its bind port.
    command: ["serve", "--host", "0.0.0.0", "--port", "80", "--storage-dir", "/home/nonroot"]
    expose:
      - 80
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN}
    volumes:
      - obscura-data:/home/nonroot

volumes:
  obscura-data: {}
