services:
  postgres-mcp-pro:
    image: crystaldba/postgres-mcp:0.3.0@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
    restart: unless-stopped
    command:
      - --access-mode=${POSTGRES_MCP_ACCESS_MODE}
      - --transport=sse
      - --sse-host=0.0.0.0
      - --sse-port=8000
    expose:
      - 8000
    environment:
      DATABASE_URI: ${DATABASE_URI}

  # the server has no authentication, so the public route goes through this token gate
  postgres-mcp-pro-gateway:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    expose:
      - 80
    environment:
      POSTGRES_MCP_TOKEN: ${POSTGRES_MCP_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - postgres-mcp-pro
