[variables]
mcp_token = "${hash:64}"

[config]

[[config.domains]]
serviceName = "postgres-mcp-pro-gateway"
port = 80
host = "${domain}"

[[config.mounts]]
filePath = "Caddyfile"
content = """
{
	admin off
	auto_https off
	servers {
		trusted_proxies static private_ranges
	}
}

:80 {
	@authorized header Authorization "Bearer {$POSTGRES_MCP_TOKEN}"
	handle @authorized {
		reverse_proxy postgres-mcp-pro:8000 {
			flush_interval -1
		}
	}
	handle {
		respond "Unauthorized" 401
	}
}
"""

[config.env]
DATABASE_URI = "postgresql://user:password@db.example.com:5432/dbname"
POSTGRES_MCP_ACCESS_MODE = "restricted"
POSTGRES_MCP_TOKEN = "${mcp_token}"
