[config]

[[config.domains]]
serviceName = "fluxer"
port = 8_080
host = "${domain}"

[config.env]
FLUXER_DOMAIN = "${domain}"
FLUXER_SETUP_TOKEN = "${hash:64}"
POSTGRES_PASSWORD = "${hash:48}"
MEILI_MASTER_KEY = "${hash:64}"
FLUXER_S3_SECRET_KEY = "${hash:64}"
FLUXER_SUDO_MODE_SECRET = "${hash:64}"
FLUXER_CONNECTION_INITIATION_SECRET = "${hash:64}"
FLUXER_PROFILE_PSEUDONYM_SECRET = "${hash:64}"
FLUXER_GATEWAY_RPC_AUTH_TOKEN = "${hash:64}"
FLUXER_ERLANG_COOKIE = "${hash:64}"
FLUXER_MEDIA_PROXY_SECRET_KEY = "${hash:64}"
FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64 = "${hash:64}"
FLUXER_ADMIN_SECRET_KEY_BASE = "${hash:64}"
FLUXER_ADMIN_OAUTH_CLIENT_SECRET = "${hash:64}"
FLUXER_EMAIL_DELIVERY = ""
FLUXER_EMAIL_FROM_EMAIL = "noreply@${domain}"
FLUXER_EMAIL_SMTP_HOST = ""
FLUXER_EMAIL_SMTP_PORT = ""
FLUXER_EMAIL_SMTP_USERNAME = ""
FLUXER_EMAIL_SMTP_PASSWORD = ""
FLUXER_EMAIL_SMTP_TLS_MODE = ""

[[config.mounts]]
filePath = "Caddyfile"
content = """
{
	servers {
		trusted_proxies static private_ranges
		trusted_proxies_strict
	}
}

(upstream) {
	reverse_proxy {args[0]} {
		header_up X-Forwarded-For {client_ip}
		header_up X-Real-IP {client_ip}
		header_up -Forwarded
	}
}

:8080 {
	encode zstd gzip

	handle /_health {
		respond "OK" 200
	}

	handle_path /api/* {
		import upstream fluxer-api:8080
	}

	handle /gateway {
		rewrite * /
		import upstream fluxer-gateway:8080
	}

	handle_path /gateway/* {
		import upstream fluxer-gateway:8080
	}

	handle_path /media/* {
		import upstream fluxer-media-proxy:8080
	}

	handle /admin {
		rewrite * /
		import upstream fluxer-admin:8080
	}

	handle_path /admin/* {
		import upstream fluxer-admin:8080
	}

	@staticAssets path /web/* /emoji/* /libs/* /avatars/* /badges/* /desktop/*
	handle @staticAssets {
		import upstream fluxer-static:8080
	}

	handle /.well-known/fluxer {
		import upstream fluxer-api:8080
	}

	handle /.well-known/webfinger {
		import upstream fluxer-api:8080
	}

	handle {
		import upstream fluxer-app-proxy:8080
	}
}
"""
