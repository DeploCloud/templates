[variables]
db_password = "${password:32}"
redis_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "mastodon"
port = 3_000
host = "${domain}"
primary = true

[[config.domains]]
serviceName = "mastodon-streaming"
port = 4_000
host = "${domain}"
path = "/api/v1/streaming"

[config.env]
LOCAL_DOMAIN = "${domain}"
DB_HOST = "mastodon-db"
DB_PORT = "5432"
DB_USER = "mastodon"
DB_NAME = "mastodon_production"
DB_PASS = "${db_password}"
REDIS_HOST = "mastodon-redis"
REDIS_PORT = "6379"
REDIS_PASSWORD = "${redis_password}"
SECRET_KEY_BASE = "${hash:128}"
ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY = "${password:32}"
ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT = "${password:32}"
ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY = "${password:32}"
VAPID_PRIVATE_KEY = ""
VAPID_PUBLIC_KEY = ""
SMTP_SERVER = ""
SMTP_PORT = "587"
SMTP_LOGIN = ""
SMTP_PASSWORD = ""
SMTP_FROM_ADDRESS = "notifications@${domain}"
