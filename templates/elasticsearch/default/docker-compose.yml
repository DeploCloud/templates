services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6@sha256:79b4f1de4c15e6eca824723086a51e5934406d614d410cc11be77748cafac537
    restart: unless-stopped
    expose:
      - 9200
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --output /dev/null --silent --fail -u "elastic:$${ELASTIC_PASSWORD}" http://localhost:9200/_cluster/health
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  elasticsearch-data: {}
