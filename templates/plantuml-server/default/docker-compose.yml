services:
  plantuml-server:
    image: plantuml/plantuml-server:jetty-v1.2026.10@sha256:3719f4a9b0b061f1aa42d14d130388f831954ca65685d521b6c5b72301e993e6
    restart: unless-stopped
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
