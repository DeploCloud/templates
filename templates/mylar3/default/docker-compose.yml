services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:v0.11.0-ls281@sha256:1964a63fbb7f95e45923e74cf5174e78c8fda92f567f261e51bf8de535418a15
    restart: unless-stopped
    expose:
      - 8090
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - mylar3-config:/config
      - mylar3-comics:/comics
      - mylar3-downloads:/downloads

volumes:
  mylar3-config: {}
  mylar3-comics: {}
  mylar3-downloads: {}
