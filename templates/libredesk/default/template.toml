[variables]
db_password = "${password:32}"
encryption_key = "${hash:32}"
# fixed prefix and suffix satisfy the upper/lower/digit/special password policy
system_password = "Ld-${password:24}9a"

[config]
mounts = []

[[config.domains]]
serviceName = "libredesk"
port = 9_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
ENCRYPTION_KEY = "${encryption_key}"
LIBREDESK_SYSTEM_USER_PASSWORD = "${system_password}"
