services:
  clipcascade:
    image: sathvikrao/clipcascade:3.5.0@sha256:6473a2c6be5e61c4e0b5bce53b615f5d0acb619c8482bfaf1bcde90038187ff3
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - clipcascade-database:/database
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      CC_PORT: "8080"
      CC_MAX_MESSAGE_SIZE_IN_MiB: ${CC_MAX_MESSAGE_SIZE_IN_MiB}
      CC_P2P_ENABLED: ${CC_P2P_ENABLED}
      CC_SIGNUP_ENABLED: ${CC_SIGNUP_ENABLED}
      CC_SESSION_PERSISTENCE_ENABLED: ${CC_SESSION_PERSISTENCE_ENABLED}
      CC_SERVER_DB_PASSWORD: "${DB_FILE_PASSWORD} ${DB_USER_PASSWORD}"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_TOMCAT_REDIRECT_CONTEXT_ROOT: "false"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"

volumes:
  clipcascade-database: {}
