services:
  clipcascade:
    image: sathvikrao/clipcascade:3.5.0@sha256:6473a2c6be5e61c4e0b5bce53b615f5d0acb619c8482bfaf1bcde90038187ff3
    restart: unless-stopped
    expose:
      - 8080
    environment:
      CC_PORT: "8080"
      CC_MAX_MESSAGE_SIZE_IN_MiB: ${CC_MAX_MESSAGE_SIZE_IN_MiB}
      CC_P2P_ENABLED: ${CC_P2P_ENABLED}
      CC_SIGNUP_ENABLED: ${CC_SIGNUP_ENABLED}
      CC_SESSION_PERSISTENCE_ENABLED: ${CC_SESSION_PERSISTENCE_ENABLED}
      CC_SERVER_DB_URL: jdbc:postgresql://clipcascade-db:5432/clipcascade
      CC_SERVER_DB_USERNAME: clipcascade
      CC_SERVER_DB_PASSWORD: ${DB_PASSWORD}
      CC_SERVER_DB_DRIVER: org.postgresql.Driver
      CC_SERVER_DB_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_TOMCAT_REDIRECT_CONTEXT_ROOT: "false"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      clipcascade-db:
        condition: service_healthy

  clipcascade-db:
    image: postgres:17.12-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipcascade
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clipcascade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipcascade -d clipcascade"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - clipcascade-postgres:/var/lib/postgresql/data

volumes:
  clipcascade-postgres: {}
