[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "clipcascade"
port = 8_080
host = "${domain}"

[config.env]
CC_MAX_MESSAGE_SIZE_IN_MiB = "1"
CC_P2P_ENABLED = "false"
CC_SIGNUP_ENABLED = "false"
CC_SESSION_PERSISTENCE_ENABLED = "true"
DB_PASSWORD = "${db_password}"
