services:
  spacetimedb:
    image: clockworklabs/spacetime:v2.15.0@sha256:fee387a5241cdba475901df900a9b8d8bf8407750dab26e24c1b43b272526974
    restart: unless-stopped
    command: ["start"]
    expose:
      - 3000
    volumes:
      # holds both the data dir (~/.local/share/spacetime) and the JWT keys (~/.config/spacetime)
      - spacetimedb-home:/home/spacetime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  spacetimedb-home: {}
