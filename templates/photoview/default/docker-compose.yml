services:
  photoview:
    image: photoview/photoview:2.4.0@sha256:800ac764f2d3adb7387eb4f20d7d72f7a9331542ca279e8e464555a6a46c247e
    restart: unless-stopped
    expose:
      - 80
    depends_on:
      photoview-db:
        condition: service_healthy
    environment:
      PHOTOVIEW_LISTEN_IP: 0.0.0.0
      PHOTOVIEW_LISTEN_PORT: "80"
      PHOTOVIEW_DATABASE_DRIVER: mysql
      PHOTOVIEW_MYSQL_URL: photoview:${DB_PASSWORD}@tcp(photoview-db)/photoview
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
    volumes:
      # the image's home dir is owned by the non-root photoview user, so the media cache stays writable
      - photoview-data:/home/photoview
      - photoview-photos:/photos:ro

  photoview-db:
    image: mariadb:12.3@sha256:4ebbcf100a3ba320766dfa0e1af008df12261301db6ef72798c7650f70794aed
    restart: unless-stopped
    command: mariadbd --innodb-buffer-pool-size=512M --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=512 --innodb-rollback-on-timeout=OFF --innodb-lock-wait-timeout=120
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: photoview
      MARIADB_USER: photoview
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - photoview-db:/var/lib/mysql

volumes:
  photoview-data: {}
  photoview-photos: {}
  photoview-db: {}
