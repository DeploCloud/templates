services:
  photoview:
    image: photoview/photoview:2.4.0@sha256:800ac764f2d3adb7387eb4f20d7d72f7a9331542ca279e8e464555a6a46c247e
    restart: unless-stopped
    expose:
      - 80
    environment:
      PHOTOVIEW_LISTEN_IP: 0.0.0.0
      PHOTOVIEW_LISTEN_PORT: "80"
      PHOTOVIEW_DATABASE_DRIVER: sqlite
      PHOTOVIEW_SQLITE_PATH: /home/photoview/photoview.db
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
    volumes:
      # the image's home dir is owned by the non-root photoview user, so the database and cache stay writable
      - photoview-data:/home/photoview
      - photoview-photos:/photos:ro

volumes:
  photoview-data: {}
  photoview-photos: {}
