[variables]
jwt_secret = "${hash:64}"
redis_password = "${hash:64}"

[config]

[[config.domains]]
serviceName = "erxes-proxy"
port = 80
host = "${domain}"

[config.env]
ERXES_VERSION = "3.4.25"
ERXES_URL = "https://${domain}"
ENABLED_PLUGINS = "frontline,sales,operation"
JWT_TOKEN_SECRET = "${jwt_secret}"
REDIS_PASSWORD = "${redis_password}"

[[config.mounts]]
filePath = "Caddyfile"
content = """# the UI calls the API under /gateway; the gateway itself serves from /
{
	admin off
	auto_https off
	persist_config off
	servers {
		trusted_proxies static private_ranges
	}
}

:80 {
	encode gzip
	handle_path /gateway/* {
		reverse_proxy gateway:4000
	}
	handle {
		reverse_proxy core-ui:80
	}
}
"""
