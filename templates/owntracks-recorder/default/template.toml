[variables]
admin_password = "${password:24}"

[config]

[[config.domains]]
serviceName = "owntracks-recorder-proxy"
port = 80
host = "${domain}"

[[config.mounts]]
filePath = "htpasswd"
content = """owntracks:{PLAIN}${admin_password}
"""

[[config.mounts]]
filePath = "nginx.conf"
content = """
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    client_max_body_size 10m;

    auth_basic "OwnTracks Recorder";
    auth_basic_user_file /etc/nginx/htpasswd;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $recorder http://owntracks-recorder:8083;

    location / {
        proxy_pass $recorder;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
"""

[config.env]
OTR_HTTPPREFIX = "https://${domain}"
