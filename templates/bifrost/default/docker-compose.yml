services:
  bifrost:
    image: maximhq/bifrost:v2.6.0@sha256:5968d007ba4f74ee01bc4ceb071decb9927a0b7bb43dbb9072208f75e2d522e3
    restart: unless-stopped
    expose:
      - 8080
    environment:
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY}
      BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME}
      BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD}
    volumes:
      - bifrost-data:/app/data
      - ./config.json:/app/data/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  bifrost-data: {}
