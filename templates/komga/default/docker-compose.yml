services:
  komga:
    image: ghcr.io/gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
    restart: unless-stopped
    expose:
      - 25600
    environment:
      TZ: ${TZ}
    volumes:
      - komga-config:/config
      - komga-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:25600/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  komga-config: {}
  komga-data: {}
