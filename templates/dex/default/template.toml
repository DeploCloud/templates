[variables]
db_password = "${password:32}"
admin_password = "${password:24}"
client_secret = "${password:48}"

[config]

[[config.domains]]
serviceName = "dex"
port = 5_556
host = "${domain}"

[config.env]
DEX_ISSUER = "https://${domain}"
DEX_DB_PASSWORD = "${db_password}"
DEX_ADMIN_EMAIL = "admin@${domain}"
DEX_ADMIN_PASSWORD = "${admin_password}"
DEX_ADMIN_USER_ID = "${uuid}"
DEX_CLIENT_SECRET = "${client_secret}"

[[config.mounts]]
filePath = "config.yaml"
content = """# Rendered by gomplate at container start; the DEX_* values come from the environment.
issuer: {{ getenv "DEX_ISSUER" }}

storage:
  type: postgres
  config:
    host: dex-db
    port: 5432
    database: dex
    user: dex
    password: {{ getenv "DEX_DB_PASSWORD" | quote }}
    ssl:
      mode: disable

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: false

enablePasswordDB: true

staticPasswords:
  - email: {{ getenv "DEX_ADMIN_EMAIL" | quote }}
    hash: {{ getenv "DEX_ADMIN_PASSWORD" | crypto.Bcrypt | quote }}
    username: admin
    userID: {{ getenv "DEX_ADMIN_USER_ID" | quote }}

# Register every application that signs in through Dex, then redeploy:
# staticClients:
#   - id: my-app
#     secretEnv: DEX_CLIENT_SECRET
#     name: My App
#     redirectURIs:
#       - https://app.example.com/callback

# Upstream identity providers: https://dexidp.io/docs/connectors/
# connectors: []
"""
