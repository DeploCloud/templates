services:
  coder:
    image: ghcr.io/coder/coder:v2.37.6@sha256:b86d7c539bb9fad43dcf6f86131eb149b0d0a72ae5403762b36e2e00dc01f12b
    restart: unless-stopped
    expose:
      - 7080
    depends_on:
      coder-db:
        condition: service_healthy
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL}
      CODER_HTTP_ADDRESS: ${CODER_HTTP_ADDRESS}
      CODER_PG_CONNECTION_URL: ${CODER_PG_CONNECTION_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  coder-db:
    image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: unless-stopped
    environment:
      POSTGRES_DB: coder
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - coder-postgres:/var/lib/postgresql/data

volumes:
  coder-postgres: {}
