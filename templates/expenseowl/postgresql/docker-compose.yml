services:
  expenseowl:
    image: tanq16/expenseowl:v4.1@sha256:f9097cf2890b45e6bbf39311bf0fccaf58c3c7c06ec39dc39d8b013e176391b5
    restart: unless-stopped
    expose:
      - 8080
    environment:
      STORAGE_TYPE: postgres
      STORAGE_URL: expenseowl-db:5432/${DB_NAME}
      STORAGE_SSL: disable
      STORAGE_USER: ${DB_USER}
      STORAGE_PASS: ${DB_PASSWORD}
    depends_on:
      expenseowl-db:
        condition: service_healthy

  expenseowl-db:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - expenseowl-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  expenseowl-db: {}
