services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15@sha256:e098de5c2f8040dc3d4784ed2d5cfdac3b0979f9349afe587ef6a670a14b9f4d
    restart: unless-stopped
    # The inline config after the file enforces Basic auth even if the editable go2rtc.yaml drops it.
    command:
      - go2rtc
      - -config
      - /config/go2rtc.yaml
      - -config
      - '{api: {username: "${GO2RTC_USERNAME}", password: "${GO2RTC_PASSWORD}"}}'
    expose:
      - 1984
    environment:
      TZ: ${TZ}
    volumes:
      - go2rtc-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:1984/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  go2rtc-config: {}
