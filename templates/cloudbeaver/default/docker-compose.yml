services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.5.1@sha256:405c02ef10efa0e0e410ba69f214d65f181fc3708da3d8197052634bed8ee0e7
    restart: unless-stopped
    expose:
      - 8978
    environment:
      CB_SERVER_NAME: ${CB_SERVER_NAME}
      CB_ADMIN_NAME: ${CB_ADMIN_NAME}
      CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD}
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: ${CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED}
      CLOUDBEAVER_APP_FORWARD_PROXY: ${CLOUDBEAVER_APP_FORWARD_PROXY}
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace

volumes:
  cloudbeaver-workspace: {}
