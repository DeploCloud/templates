services:
  anubis:
    image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
    restart: unless-stopped
    expose:
      - 8923
    environment:
      BIND: ":8923"
      TARGET: ${TARGET}
      DIFFICULTY: ${DIFFICULTY}
      SERVE_ROBOTS_TXT: ${SERVE_ROBOTS_TXT}
      ED25519_PRIVATE_KEY_HEX: ${ED25519_PRIVATE_KEY_HEX}
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      - anubis-site

  anubis-site:
    image: nginx:1.31.9-alpine@sha256:90b6bd2aec278b16b98221d64deb1d6d35d164567f507ab0716e6053878315aa
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - anubis-site:/usr/share/nginx/html

volumes:
  anubis-site: {}
