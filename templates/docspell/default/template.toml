[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "docspell"
port = 7_880
host = "${domain}"

[config.env]
TZ = "UTC"
BASE_URL = "https://${domain}"
DB_NAME = "docspell"
DB_USER = "docspell"
DB_PASSWORD = "${db_password}"
SERVER_SECRET = "hex:${hash:64}"
ADMIN_SECRET = "${password:32}"
SIGNUP_MODE = "open"
