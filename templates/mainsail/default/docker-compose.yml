services:
  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:v2.19.0@sha256:adcadcdb6f9f6ede1f347ca4ac5f469dcc07f3677d46f8ffcd23696c66681893
    restart: unless-stopped
    expose:
      - 80
    volumes:
      - ./config.json:/usr/share/nginx/html/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
