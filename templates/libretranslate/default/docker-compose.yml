services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
    restart: unless-stopped
    expose:
      - 5000
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY}
      LT_UPDATE_MODELS: ${LT_UPDATE_MODELS}
    volumes:
      - libretranslate-models:/home/libretranslate
      - libretranslate-db:/app/db
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s

volumes:
  libretranslate-models: {}
  libretranslate-db: {}
