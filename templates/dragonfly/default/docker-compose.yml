services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
    restart: unless-stopped
    expose:
      - 6379
    environment:
      DFLY_requirepass: ${DRAGONFLY_PASSWORD}
      DFLY_expose_http_api: "true"
      DFLY_dbfilename: dump
      DFLY_snapshot_cron: "*/15 * * * *"
      DFLY_proactor_threads: ${DRAGONFLY_THREADS}
    ulimits:
      memlock: -1
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$DFLY_requirepass\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  dragonfly-data: {}
