services:
  stump:
    image: aaronleopold/stump:0.1.14@sha256:3f9ab90b52200b614df2fa14696f1c1e8cb036db8c33998559f0dabdfcdb8230
    restart: unless-stopped
    expose:
      - 10801
    environment:
      PUID: "1000"
      PGID: "1000"
      STUMP_TRUST_PROXY_HEADERS: ${STUMP_TRUST_PROXY_HEADERS}
      STUMP_ALLOWED_ORIGINS: ${STUMP_ALLOWED_ORIGINS}
      STUMP_ENABLE_UPLOAD: ${STUMP_ENABLE_UPLOAD}
      STUMP_MAX_FILE_UPLOAD_SIZE: ${STUMP_MAX_FILE_UPLOAD_SIZE}
    volumes:
      - stump-config:/config
      - stump-data:/data

volumes:
  stump-config: {}
  stump-data: {}
