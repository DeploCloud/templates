services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.30.3@sha256:4bcc8738f154db2664a1897cc9a284015b5f9a83d74741f6c091912f417461a2
    restart: unless-stopped
    stop_grace_period: 75s
    expose:
      - 2785
    environment:
      BASE_URL: ${BASE_URL}
      API_MASTER_KEY: ${API_MASTER_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      AUTO_START_SESSIONS: ${AUTO_START_SESSIONS}
      DATABASE_TYPE: postgres
      DATABASE_HOST: openwa-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - openwa-data:/app/data
    depends_on:
      openwa-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  openwa-db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - openwa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openwa-data: {}
  openwa-db: {}
