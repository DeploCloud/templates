services:
  obsidian-livesync:
    image: couchdb:3.5.3@sha256:907eab5b7e55ab7cfd241d39b90b2a335ea40bef82acee5a37388c08bf201dda
    restart: unless-stopped
    expose:
      - 5984
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - obsidian-livesync-data:/opt/couchdb/data
      - obsidian-livesync-config:/opt/couchdb/etc/local.d
      # not read-only: the entrypoint chowns and chmods every file under /opt/couchdb/etc
      - ./livesync.ini:/opt/couchdb/etc/local.ini
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$${COUCHDB_USER}:$${COUCHDB_PASSWORD}\" http://127.0.0.1:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  obsidian-livesync-data: {}
  obsidian-livesync-config: {}
