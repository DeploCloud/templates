[config]
mounts = []

[[config.domains]]
serviceName = "zeroclaw"
port = 42_617
host = "${domain}"

[config.env]
ZEROCLAW_gateway__host = "0.0.0.0"
ZEROCLAW_gateway__port = "42617"
ZEROCLAW_gateway__allow_public_bind = "true"
ZEROCLAW_gateway__require_pairing = "true"
ZEROCLAW_gateway__trust_forwarded_headers = "true"
