[variables]
password = "${password:24}"

[config]
mounts = []

[[config.domains]]
serviceName = "czkawka"
port = 5_800
host = "${domain}"

[config.env]
TZ = "Etc/UTC"
KEEP_APP_RUNNING = "1"
WEB_AUTHENTICATION = "1"
WEB_AUTHENTICATION_ALLOW_INSECURE = "1"
WEB_AUTHENTICATION_USERNAME = "admin"
WEB_AUTHENTICATION_PASSWORD = "${password}"
WEB_FILE_MANAGER = "1"
