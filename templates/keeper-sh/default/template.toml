[variables]
db_password = "${password:32}"
auth_secret = "${password:48}"
# ENCRYPTION_KEY must be standard base64 decoding to 32 bytes
encryption_key = "${hash:43}="

[config]
mounts = []

[[config.domains]]
serviceName = "keeper-sh"
port = 3_000
host = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
BETTER_AUTH_URL = "https://${domain}"
BETTER_AUTH_SECRET = "${auth_secret}"
ENCRYPTION_KEY = "${encryption_key}"
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
MICROSOFT_CLIENT_ID = ""
MICROSOFT_CLIENT_SECRET = ""
