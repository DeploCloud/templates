services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    restart: unless-stopped
    expose:
      - 51821
    environment:
      PORT: ${PORT}
      INSECURE: ${INSECURE}
      PASSWORD_HASH: ${PASSWORD_HASH}
      WG_HOST: ${WG_HOST}
    volumes:
      - wg-easy-data:/etc/wireguard

volumes:
  wg-easy-data: {}
