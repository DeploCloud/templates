services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    expose:
      - 11434
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_VULKAN: ${OLLAMA_VULKAN}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data: {}
