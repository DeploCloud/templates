[variables]
db_password = "${password}"
db_user = "immich"

[config]
env = [
  "DB_HOSTNAME=immich-database",
  "DB_PORT=5432",
  "DB_USERNAME=${db_user}",
  "DB_PASSWORD=${db_password}",
  "DB_DATABASE_NAME=immich",
  "REDIS_HOSTNAME=immich-redis",
  "REDIS_PORT=6379",
  "REDIS_DBINDEX=0",
  "IMMICH_HOST=0.0.0.0",
  "TZ=UTC",
]
mounts = []

[[config.domains]]
serviceName = "immich-server"
port = 2_283
host = "${domain}"
