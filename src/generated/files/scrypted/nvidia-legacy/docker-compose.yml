services:
  scrypted:
    image: ghcr.io/koush/scrypted:18-jammy-full-v0.94.4
    restart: unless-stopped
    expose:
      - 11080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - scrypted-data:/server/volume

volumes:
  scrypted-data: {}
