services:
  node-red:
    image: nodered/node-red:5.0.8@sha256:b5adb6c9dd29ab80c852d82bc87daed84e729dcff9b00ca1bf958e6de470f2c1
    restart: unless-stopped
    expose:
      - 1880
    environment:
      TZ: ${TZ}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
    volumes:
      - node-red-data:/data

volumes:
  node-red-data: {}
