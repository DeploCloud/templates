services:
  vikunja:
    image: vikunja/vikunja:2.7@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
    user: "0:0"
    restart: unless-stopped
    expose:
      - 3456
    environment:
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_SERVICE_JWTSECRET}
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_SERVICE_PUBLICURL}
      VIKUNJA_DATABASE_TYPE: ${VIKUNJA_DATABASE_TYPE}
      VIKUNJA_DATABASE_PATH: ${VIKUNJA_DATABASE_PATH}
    volumes:
      - vikunja-files:/app/vikunja/files
      - vikunja-db:/db

volumes:
  vikunja-files: {}
  vikunja-db: {}
