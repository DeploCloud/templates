services:
  langflow:
    image: langflowai/langflow:1.13.0@sha256:ff2716e017f4a4bbb9e83556bf66c3d5d70a1d3eb7cffd893312600ba84e303f
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 7860
    environment:
      LANGFLOW_HOST: ${LANGFLOW_HOST}
      LANGFLOW_PORT: ${LANGFLOW_PORT}
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_DATABASE_URL: ${LANGFLOW_DATABASE_URL}
    volumes:
      - langflow-data:/app/data

  postgres:
    image: postgres:16-trixie@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    environment:
      POSTGRES_DB: langflow
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  langflow-data: {}
  postgres-data: {}
