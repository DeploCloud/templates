services:
  langflow:
    image: langflowai/langflow:1.12.6@sha256:a0396e089eb97fa471ef8affc492b8c56abb3758040a5ddaa80814b0abad15bf
    restart: unless-stopped
    expose:
      - 7860
    environment:
      LANGFLOW_HOST: ${LANGFLOW_HOST}
      LANGFLOW_PORT: ${LANGFLOW_PORT}
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
    volumes:
      - langflow-data:/app/data

volumes:
  langflow-data: {}
