x-logging: &x-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"
services:
  init-assets:
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    restart: on-failure
    logging: *x-logging
    entrypoint: /bin/sh
    command:
      - "-c"
      - "set -e\napk add --no-cache git curl brotli >/dev/null\nif [ ! -f /assets/.ok-${POSTHOG_VERSION} ]; then\n  echo \"Fetching PostHog repo assets @ ${POSTHOG_VERSION}\"\n  rm -rf /tmp/ph && mkdir -p /tmp/ph && cd /tmp/ph\n  git init -q .\n  git remote add origin https://github.com/PostHog/posthog.git\n  git sparse-checkout set --no-cone /docker/clickhouse/ /posthog/idl/ /posthog/user_scripts/\n  git -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin ${POSTHOG_VERSION}\n  git checkout -q FETCH_HEAD\n  rm -rf /assets/clickhouse /assets/idl /assets/user_scripts /assets/.ok-*\n  cp -r docker/clickhouse /assets/clickhouse\n  cp -r posthog/idl /assets/idl\n  cp -r posthog/user_scripts /assets/user_scripts\n  touch /assets/.ok-${POSTHOG_VERSION}\n  echo \"Repo assets ready\"\nfi\nif [ ! -s /share/GeoLite2-City.mmdb ]; then\n  echo \"Downloading GeoLite2 database\"\n  curl -sL --http1.1 https://mmdbcdn.posthog.net/ | brotli --decompress --output=/share/GeoLite2-City.mmdb\n  chmod 644 /share/GeoLite2-City.mmdb\nfi\necho \"init-assets done\"\n"
    volumes:
      - posthog-assets:/assets
      - geoip-data:/share
  db:
    image: postgres:15.12-alpine@sha256:ef9d1517df69c4d27dbb9ddcec14f431a2442628603f4e9daa429b92ae6c3cd1
    restart: unless-stopped
    logging: *x-logging
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U posthog
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
  redis7:
    image: redis:7.2-alpine@sha256:35011bb2d34be3185c72935a847f25da61094c8a0a207ee17db6a7f8c3de9eb1
    restart: unless-stopped
    logging: *x-logging
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - redis-data:/data
    environment: {}
  zookeeper:
    image: zookeeper:3.7.0@sha256:341cf7411329fd5a3ea37640073e7b8f063175168c0f0d99179e9606e035a80c
    restart: unless-stopped
    logging: *x-logging
    environment:
      ZOO_AUTOPURGE_PURGEINTERVAL: 1
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
  kafka:
    image: docker.io/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
    restart: unless-stopped
    logging: *x-logging
    command:
      - redpanda
      - start
      - "--kafka-addr internal://0.0.0.0:9092"
      - "--advertise-kafka-addr internal://kafka:9092"
      - "--rpc-addr kafka:33145"
      - "--advertise-rpc-addr kafka:33145"
      - "--mode dev-container"
      - "--smp 1"
      - "--memory 1G"
      - "--reserve-memory 0M"
      - "--overprovisioned"
      - "--set redpanda.empty_seed_starts_cluster=false"
      - "--seeds kafka:33145"
      - "--set redpanda.auto_create_topics_enabled=true"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9644/v1/status/ready || exit 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    environment:
      ALLOW_PLAINTEXT_LISTENER: "true"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_RETENTION_MS: "3600000"
  kafka-init:
    image: docker.io/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
    restart: on-failure
    logging: *x-logging
    entrypoint: /bin/sh
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "-c"
      - "set -x\necho \"Waiting for Kafka broker to accept connections...\"\nTIMEOUT=60\nELAPSED=0\n# Use rpk topic list as the readiness check - it's a simple operation\n# that confirms the broker is accepting Kafka protocol requests\nuntil rpk topic list --brokers kafka:9092 2>/dev/null; do\n    echo \"Kafka broker not ready yet (elapsed: $${ELAPSED}s)...\"\n    sleep 2\n    ELAPSED=$$((ELAPSED + 2))\n    if [ $$ELAPSED -ge $$TIMEOUT ]; then\n        echo \"Timeout waiting for Kafka broker after $${TIMEOUT}s\"\n        echo \"Final attempt to list topics:\"\n        rpk topic list --brokers kafka:9092 || true\n        exit 1\n    fi\ndone\necho \"Kafka broker is accepting requests, creating topics...\"\n# The topic list is docker/kafka/topics.txt, mounted below, shared with\n# docker-compose.dev.yml so the two stacks cannot drift apart. That header\n# explains what needs pre-creating.\n# Note: $$ escapes $ for docker-compose variable substitution\nTOPICS=$$(grep -vE '^[[:space:]]*#|^[[:space:]]*$$' /topics.txt)\nfor topic in $$TOPICS; do\n    if rpk topic create \"$$topic\" --brokers kafka:9092 -p 1 -r 1 2>&1; then\n        echo \"Topic $$topic created successfully\"\n    else\n        if rpk topic list --brokers kafka:9092 | awk '{print $$1}' | grep -qx \"$$topic\"; then\n            echo \"Topic $$topic already exists, continuing\"\n        else\n            echo \"Failed to create topic $$topic\"\n            exit 1\n        fi\n    fi\ndone\necho \"Final topic list:\"\nrpk topic list --brokers kafka:9092\necho \"Topics ready\"\n"
    volumes:
      - ./kafka/topics.txt:/topics.txt:ro
    environment: {}
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.13.15@sha256:04fc72b8a58e58200c706f375ef81ec7112de3515e898de63f6c72843d7a2eeb
    restart: unless-stopped
    logging: *x-logging
    depends_on:
      init-assets:
        condition: service_completed_successfully
      zookeeper:
        condition: service_started
      kafka:
        condition: service_started
    entrypoint: /bin/bash
    command:
      - "-c"
      - "set -e\ncp /assets/clickhouse/config.xml /etc/clickhouse-server/config.xml\ncp /assets/clickhouse/config.d/default.xml /etc/clickhouse-server/config.d/default.xml\ncp /assets/clickhouse/users.xml /etc/clickhouse-server/users.xml\ncp /assets/clickhouse/user_defined_function.xml /etc/clickhouse-server/user_defined_function.xml\nmkdir -p /var/lib/clickhouse/format_schemas /var/lib/clickhouse/user_scripts\ncp -r /assets/idl/. /var/lib/clickhouse/format_schemas/\ncp -r /assets/user_scripts/. /var/lib/clickhouse/user_scripts/\nchmod -R 755 /var/lib/clickhouse/user_scripts\nchown -R clickhouse:clickhouse /var/lib/clickhouse/format_schemas /var/lib/clickhouse/user_scripts || true\n# Materialize system log tables (system.crash_log is required by the\n# custom_metrics ClickHouse migration), mirroring upstream init-db.sh\n(\n  i=0\n  while [ $$i -lt 90 ]; do\n    if clickhouse-client --query \"SELECT 1\" >/dev/null 2>&1; then\n      clickhouse-client --query \"SYSTEM FLUSH LOGS\" && echo \"system logs flushed\" && break\n    fi\n    sleep 2\n    i=$$((i+1))\n  done\n) &\nexec /entrypoint.sh\n"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: kafka:9092
    volumes:
      - posthog-assets:/assets:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
  web:
    image: posthog/posthog:latest@sha256:46866b3613b2cc8583ca602789f72eb75d6112608a52ae8a0a85af8032c5a8b5
    restart: unless-stopped
    logging: *x-logging
    command:
      - sh
      - "-c"
      - ./bin/migrate && exec ./bin/docker-server
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      objectstorage:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      personhog-router:
        condition: service_started
      browserless:
        condition: service_started
      temporal:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SDK_DISABLED: "true"
      API_QUERIES_PER_TEAM: '{"1": 100}'
      LIVESTREAM_HOST: "${POSTHOG_SITE_URL}/livestream"
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags:3001
      CDP_API_URL: http://plugins:6738
      SECURE_COOKIES: "${POSTHOG_SECURE_COOKIES}"
      DISABLE_SECURE_SSL_REDIRECT: "true"
      IS_BEHIND_PROXY: "true"
      DEPLOYMENT: hobby
      ENCRYPTION_SALT_KEYS: "${POSTHOG_ENCRYPTION_SALT_KEYS}"
      SECRET_KEY: "${POSTHOG_SECRET_KEY}"
      SITE_URL: "${POSTHOG_SITE_URL}"
      RECORDING_API_URL: http://recording-api:6738
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "${POSTHOG_OBJECT_STORAGE_SECRET_KEY}"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "${POSTHOG_OBJECT_STORAGE_ACCESS_KEY}"
      SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${POSTHOG_OBJECT_STORAGE_SECRET_KEY}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "${POSTHOG_OBJECT_STORAGE_ACCESS_KEY}"
      OBJECT_STORAGE_PUBLIC_ENDPOINT: "${POSTHOG_SITE_URL}"
      OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
      OBJECT_STORAGE_ENABLED: "true"
      FLAGS_REDIS_ENABLED: "false"
      KAFKA_HOSTS: kafka
      REDIS_URL: redis://redis7:6379/
      CLICKHOUSE_LOGS_CLUSTER_SECURE: "false"
      CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
      CLICKHOUSE_APP_PASSWORD: apppass
      CLICKHOUSE_APP_USER: app
      CLICKHOUSE_API_PASSWORD: apipass
      CLICKHOUSE_API_USER: api
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_HOST: clickhouse
      PERSONS_DB_READER_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_DB_WRITER_URL: postgres://posthog:posthog@db:5432/posthog
      PGPASSWORD: posthog
      PGUSER: posthog
      PGHOST: db
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      NGINX_UNIT_APP_PROCESSES: 2
      PERSONHOG_ADDR: personhog-router:50052
      PERSONHOG_ENABLED: "true"
      INTERNAL_API_SECRET: "${POSTHOG_INTERNAL_API_SECRET}"
      INTERNAL_REQUEST_TOKEN: "${POSTHOG_INTERNAL_REQUEST_TOKEN}"
      BROWSERLESS_CDP_URL: ws://browserless:3000
      BROWSERLESS_TOKEN: "${POSTHOG_BROWSERLESS_SECRET}"
      HEATMAP_BROWSERLESS_URL: http://browserless:3000
      HEATMAP_BROWSERLESS_TOKEN: "${POSTHOG_BROWSERLESS_SECRET}"
      HEATMAP_BROWSERLESS_SCREENSHOT_COOKIES_ENABLED: "false"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CSP_REPORT_ENDPOINT: "${CSP_REPORT_ENDPOINT:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPT_OUT_CAPTURE: "${OPT_OUT_CAPTURE:-false}"
      OTEL_SERVICE_NAME: posthog
      TEMPORAL_HOST: temporal
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:8000/_health || exit 1
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 600s
  worker:
