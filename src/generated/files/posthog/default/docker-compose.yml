        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      web:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      personhog-router:
        condition: service_started
      browserless:
        condition: service_started
      objectstorage:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SDK_DISABLED: "true"
