[variables]
admin_password = "${password:32}"

[config]

[[config.domains]]
serviceName = "stirling-pdf"
port = 8080
host = "${domain}"

[config.env]
SECURITY_ENABLELOGIN = "true"
SYSTEM_DEFAULTLOCALE = "en-US"
SECURITY_INITIALLOGIN_USERNAME = "admin"
SECURITY_INITIALLOGIN_PASSWORD = "${admin_password}"
