services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    expose:
      - 8080
    environment:
      DOCKER_ENABLE_SECURITY: ${DOCKER_ENABLE_SECURITY}
      SYSTEM_DEFAULTLOCALE: ${SYSTEM_DEFAULTLOCALE}
    volumes:
      - stirling-pdf-config:/configs

volumes:
  stirling-pdf-config: {}
