services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.2.1@sha256:f95b691c3df463373258e21a578b404f1eb4c7660e8170a40e3e03c9c8f208a4
    restart: unless-stopped
    expose:
      - 8080
    environment:
      SECURITY_INITIALLOGIN_USERNAME: ${SECURITY_INITIALLOGIN_USERNAME}
      SECURITY_INITIALLOGIN_PASSWORD: ${SECURITY_INITIALLOGIN_PASSWORD}
      SECURITY_ENABLELOGIN: ${SECURITY_ENABLELOGIN}
      SYSTEM_DEFAULTLOCALE: ${SYSTEM_DEFAULTLOCALE}
    volumes:
      - stirling-pdf-config:/configs

volumes:
  stirling-pdf-config: {}
