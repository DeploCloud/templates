services:
  flowise-init:
    image: flowiseai/flowise:3.0.13
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 1000:1000 /home/node/.flowise
    volumes:
      - flowise-data:/home/node/.flowise

  flowise:
    image: flowiseai/flowise:3.0.13
    restart: unless-stopped
    depends_on:
      flowise-init:
        condition: service_completed_successfully
    expose:
      - 3000
    environment:
      PORT: ${PORT}
      DATABASE_PATH: ${DATABASE_PATH}
      SECRETKEY_STORAGE_TYPE: ${SECRETKEY_STORAGE_TYPE}
      SECRETKEY_PATH: ${SECRETKEY_PATH}
      LOG_PATH: ${LOG_PATH}
      STORAGE_TYPE: ${STORAGE_TYPE}
      BLOB_STORAGE_PATH: ${BLOB_STORAGE_PATH}
    volumes:
      - flowise-data:/home/node/.flowise

volumes:
  flowise-data: {}
