services:
  flowise-init:
    image: flowiseai/flowise:3.1.3
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 1000:1000 /home/node/.flowise
    volumes:
      - flowise-data:/home/node/.flowise

  flowise:
    image: flowiseai/flowise:3.1.3
    restart: unless-stopped
    depends_on:
      flowise-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    expose:
      - 3000
    environment:
      PORT: ${PORT}
      DATABASE_PATH: ${DATABASE_PATH}
      SECRETKEY_STORAGE_TYPE: ${SECRETKEY_STORAGE_TYPE}
      SECRETKEY_PATH: ${SECRETKEY_PATH}
      LOG_PATH: ${LOG_PATH}
      STORAGE_TYPE: ${STORAGE_TYPE}
      BLOB_STORAGE_PATH: ${BLOB_STORAGE_PATH}
      DATABASE_TYPE: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: flowise
      DATABASE_USER: flowise
      DATABASE_PASSWORD: ${DB_PASSWORD}
    volumes:
      - flowise-data:/home/node/.flowise

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowise
      POSTGRES_USER: flowise
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowise -d flowise"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - flowise-database:/var/lib/postgresql/data

volumes:
  flowise-data: {}
  flowise-database: {}
