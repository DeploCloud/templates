services:
  docmost:
    image: ghcr.io/docmost/docmost:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 3000
    environment:
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - docmost-data:/app/data

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - docmost-database:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - docmost-redis:/data

volumes:
  docmost-data: {}
  docmost-database: {}
  docmost-redis: {}
