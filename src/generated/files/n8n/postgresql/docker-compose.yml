services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8@sha256:a18edcf018198b33b5488fb47ededafe11e0b10d28f65b9535b7c447c9ce3b2c
    restart: always
    expose:
      - 5678
    environment:
      DB_TYPE: "${DB_TYPE}"
      DB_POSTGRESDB_HOST: "${DB_POSTGRESDB_HOST}"
      DB_POSTGRESDB_PORT: "${DB_POSTGRESDB_PORT}"
      DB_POSTGRESDB_DATABASE: "${DB_POSTGRESDB_DATABASE}"
      DB_POSTGRESDB_USER: "${DB_POSTGRESDB_USER}"
      DB_POSTGRESDB_PASSWORD: "${DB_POSTGRESDB_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_HOST: "${N8N_HOST}"
      N8N_PORT: "${N8N_PORT}"
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: "https://${N8N_HOST}/"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE}"
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
  n8n-db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "${DB_POSTGRESDB_PASSWORD}"
      POSTGRES_DB: n8n
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U n8n -d n8n
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - n8n-postgres:/var/lib/postgresql
  n8n-runners:
    image: n8nio/runners:2.43.8@sha256:d86fc414c241561fc00bcad1f8d16e9af7288fd321cdc7b4a9854260f617287c
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
    depends_on:
      - n8n
volumes:
  n8n_data: {}
  n8n-postgres: {}
