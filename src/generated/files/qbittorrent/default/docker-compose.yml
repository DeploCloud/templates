services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:version-14.3.5.99202106151345-7374-667d4e421ubuntu20.04.1
    restart: unless-stopped
    expose:
      - 8080
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - qbittorrent-config:/config
      - qbittorrent-downloads:/downloads

volumes:
  qbittorrent-config: {}
  qbittorrent-downloads: {}
