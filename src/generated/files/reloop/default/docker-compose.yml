name: reloop

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

x-backend-depends: &backend-depends
  <<: *infra-ready
  migrate:
    condition: service_completed_successfully

x-backend: &backend
  restart: unless-stopped
  env_file:
    - .env
  depends_on: *backend-depends
  dns:
    - 1.1.1.1
    - 8.8.8.8
  networks:
    - reloop
  <<: *logging

x-frontend: &frontend
  restart: unless-stopped
  environment:
    NODE_ENV: production
  networks:
    - reloop
  <<: *logging

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: reloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - reloop
    <<: *logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: reloop-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --dir
      - /data
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - reloop
    <<: *logging

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: reloop-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - reloop
    <<: *logging

  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: reloop-proxy
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      reloop:
        aliases:
          - ${RELOOP_DOMAIN}
          - ${RELOOP_TRACKING_HOST}
    <<: *logging

  auth:
    <<: *backend
    image: reloopsh/be-auth:latest@sha256:ec27e41b0d5a8936681b5ef5757ca5e9e265667340f679f3b52d140f747155cb
    container_name: reloop-auth
    environment:
      PORT: 8000
    volumes:
      - ./admin-setup.key:/run/reloop/admin-setup.key
      - ./.env:/run/reloop/.env

  domain:
    <<: *backend
    image: reloopsh/be-domain:latest@sha256:c53debdeb8cfec67dd3282f0ec2c4529458875af7b46ca0958bcd94610b308da
    container_name: reloop-domain
    environment:
      PORT: 8011

  api-key:
    <<: *backend
    image: reloopsh/be-api-key:latest@sha256:bc6b9648afa546f7ca2478179f1e3dca434ce0e16aa03024ce9904ee78d9e567
    container_name: reloop-api-key
    environment:
      PORT: 8012

  webhook:
    <<: *backend
    image: reloopsh/be-webhook:latest@sha256:b394e8fae6b7b61861c6d0af49b33a55ae612d06b98ed3ea669e369ea337b7cb
    container_name: reloop-webhook
    environment:
      PORT: 8013

  contacts:
    <<: *backend
    image: reloopsh/be-contacts:latest@sha256:adbccf8ba13b5221a07c5a3d7de1bed66081549f03366ea2d8d5447cf3fc1bbb
    container_name: reloop-contacts
    environment:
      PORT: 8014

  mail:
    <<: *backend
    image: reloopsh/be-mail:latest@sha256:9828c8ba025e71f58e7af1d728790cae6d82dc812c6d9f7a9ddfe3bb03c5fe06
    container_name: reloop-mail
    environment:
      PORT: 8015
      KUMOMTA_HTTP_URL: http://smtp:8000

  logs:
    <<: *backend
    image: reloopsh/be-logs:latest@sha256:ff5acd51732b2c22e01d02e56d489cbbfc302d5a5ca052d0b48f58f231109534
    container_name: reloop-logs
    environment:
      PORT: 8016

  workflow:
    <<: *backend
    image: reloopsh/be-workflow:latest@sha256:47e76a6ffe509c9818d9259c712052521910cc780e5086564d426265e1e29b2f
    container_name: reloop-workflow
    environment:
      PORT: 8017

  upload:
    <<: *backend
    image: reloopsh/be-upload:latest@sha256:bfb32f1aba04381d8bdbc079655e2c0bb7eb7df3eb424fecd8f4b8ef25764563
    container_name: reloop-upload
    profiles:
      - storage
    environment:
      PORT: 8018

  template:
    <<: *backend
    image: reloopsh/be-template:latest@sha256:d6e99a60e571c533a6d25fc1e303d67eadd0a7a8a9eae334cea4f5a21f696539
    container_name: reloop-template
    environment:
      PORT: 8019

  campaigns:
    <<: *backend
    image: reloopsh/be-campaigns:latest@sha256:bfcd8b1ec465f4d0d43bbb6b906076b40616dd9062a2f3368959dab3675c7eb9
    container_name: reloop-campaigns
    environment:
      PORT: 8027

  inbox:
    <<: *backend
    image: reloopsh/be-inbox:latest@sha256:504475e6399b95b7d48958634900c010dd12a8873b7ce0c1d26117f0202b5e6c
    container_name: reloop-inbox
    environment:
      PORT: 8028

  email:
    <<: *backend
    image: reloopsh/be-email:latest@sha256:23064cf03b01fd8fe8a4a7aab6b8c980e548a14a227e2b63af5fb2ee70277eac
    container_name: reloop-email
    environment:
      PORT: 8022

  spam:
    image: reloopsh/be-spam:latest@sha256:67805ce497b5f047e9044b4f1050d1771062e26cf5aa09106adace1da855045a
    container_name: reloop-spam
    restart: unless-stopped
    environment:
      RSPAMD_REDIS_SERVERS: redis:6379
      RSPAMD_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - rspamd-data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  smtp:
    image: reloopsh/be-smtp:latest@sha256:049416803aa46acb3ae7be543e2159285a00f41bbdbc6a7504cdf5e062fc217b
    container_name: reloop-smtp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: ${RELOOP_DOMAIN}
      KUMOMTA_MIN_FREE_SPACE: ${KUMOMTA_MIN_FREE_SPACE:-5%}
      KUMOMTA_MIN_FREE_INODES: ${KUMOMTA_MIN_FREE_INODES:-0}
    ports:
      - "465:465"
      - "587:587"
    volumes:
      - smtp-data:/var/spool/kumomta/data
      - smtp-meta:/var/spool/kumomta/meta
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  inbound:
    image: reloopsh/be-inbound:latest@sha256:648f9b5550d06608fab70976903bf57905439ca9adcdb6d923c47dc4a82f9348
    container_name: reloop-inbound
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: ${RELOOP_INBOUND_HOST}
      INBOUND_HOSTNAME: ${RELOOP_INBOUND_HOST}
      KUMOMTA_MIN_FREE_SPACE: ${KUMOMTA_MIN_FREE_SPACE:-5%}
      KUMOMTA_MIN_FREE_INODES: ${KUMOMTA_MIN_FREE_INODES:-0}
    ports:
      - "25:25"
    volumes:
      - inbound-data:/var/spool/kumomta/data
      - inbound-meta:/var/spool/kumomta/meta
    depends_on:
      nats:
        condition: service_healthy
      spam:
        condition: service_started
    networks:
      - reloop
    <<: *logging

  dashboard:
    <<: *frontend
    image: reloopsh/fe-dashboard:latest@sha256:4fa5e4fbc04cd035a04ff522bcaf28d27d2858dd0b09b9823557fb72d3d36aee
    container_name: reloop-dashboard
    environment:
      NODE_ENV: production
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}

  links:
    <<: *frontend
    image: reloopsh/fe-links:latest@sha256:fe3d4eeb1a629a3943f5a72bfa6468648596d5347b43c9600362a900d9b81d7d
    container_name: reloop-links
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_URL: ${TRACKING_BASE_URL}
      INTERNAL_API_URL: http://contacts:8014/api/contacts
      INTERNAL_MAIL_API_URL: http://mail:8015/api/mail

  migrate:
    image: reloopsh/be-auth:latest@sha256:ec27e41b0d5a8936681b5ef5757ca5e9e265667340f679f3b52d140f747155cb
    restart: "no"
    working_dir: /app/packages/db
    entrypoint: ["/app/node_modules/.bin/drizzle-kit"]
    command: ["push", "--force"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  mcp:
    image: reloopsh/be-mcp:latest@sha256:7c3dcfc6830886d252228038176fed583f64e41db2198a284d810babcb31eb9e
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8029"
      RELOOP_BASE_URL: "${BASE_URL}"
    networks:
      - reloop

networks:
  reloop:
    name: reloop

volumes:
  postgres-data:
  redis-data:
  nats-data:
  caddy-data:
  caddy-config:
  rspamd-data:
  smtp-data:
  smtp-meta:
  inbound-data:
  inbound-meta:
