[variables]
postgres_password = "${password:32}"
redis_password = "${password:32}"
auth_secret = "${password:48}"
internal_secret = "${password:48}"
tracking_secret = "${password:48}"
preferences_secret = "${password:48}"
webhook_key = "${hash:32}"
workbench_password = "${password:32}"
admin_setup_key = "${password:40}"

[config]

[[config.domains]]
serviceName = "proxy"
port = 80
host = "${domain}"

[[config.domains]]
serviceName = "proxy"
port = 80
host = "link.${domain}"

[config.env]
AUTH_INTERNAL_BASE_URL = "http://auth:8000"
RELOOP_DOMAIN = "${domain}"
RELOOP_TRACKING_HOST = "link.${domain}"
RELOOP_INBOUND_HOST = "inbound.${domain}"
RELOOP_SITE_ADDRESS = "http://${domain}"
RELOOP_TRACKING_SITE_ADDRESS = "http://link.${domain}"
RELOOP_ADMIN_EMAIL = "${email}"
RELOOP_ACME_EMAIL = "${email}"
RELOOP_HTTPS = "true"
RELOOP_EXTERNAL_PROXY = "yes"
RELOOP_PROXY_PORT = "80"
POSTGRES_DB = "reloop"
POSTGRES_USER = "reloop"
POSTGRES_PASSWORD = "${postgres_password}"
REDIS_PASSWORD = "${redis_password}"
BETTER_AUTH_SECRET = "${auth_secret}"
RELOOP_INTERNAL_SECRET = "${internal_secret}"
TRACKING_SECRET = "${tracking_secret}"
PREFERENCES_SECRET = "${preferences_secret}"
WEBHOOK_ENCRYPTION_KEY = "${webhook_key}"
WORKBENCH_USER = "admin"
WORKBENCH_PASS = "${workbench_password}"
DISABLE_SIGNUP = "false"
DISABLE_ORG_CREATION = "false"
SETUP_MODE = "true"
ADMIN_SETUP_KEY = "${admin_setup_key}"
BASE_URL = "https://${domain}"
HOST_DOMAIN = "${domain}"
TRACKING_DOMAIN = "link.${domain}"
TRACKING_BASE_URL = "https://link.${domain}"
INBOUND_HOSTNAME = "inbound.${domain}"
SMTP_HOSTNAME = "${domain}"
DKIM_SELECTOR = "reloop"
PG_URL = "postgresql://reloop:${postgres_password}@postgres:5432/reloop"
REDIS_URL = "redis://:${redis_password}@redis:6379"
NATS_URL = "nats://nats:4222"
S3_FORCE_PATH_STYLE = "true"
ADMIN_SETUP_KEY_FILE = "/run/reloop/admin-setup.key"
RELOOP_ENV_FILE = "/run/reloop/.env"
APP_NAME = "Reloop"
NODE_ENV = "production"
SELF_HOSTED = "true"
KUMOMTA_MIN_FREE_SPACE = "5%"
KUMOMTA_MIN_FREE_INODES = "0"
KUMOMTA_RSPAMD_URL = "http://spam:11333/checkv2"
KUMOMTA_CHECK_RECIPIENT_URL = "http://domain:8011/api/domain"
KUMOMTA_WEBHOOK_URL = "http://domain:8011/api/domain"
RSPAMD_REDIS_SERVERS = "redis:6379"
RSPAMD_REDIS_PASSWORD = "${redis_password}"
DNS_RESOLVERS = "8.8.8.8,8.8.4.4"
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_USER = ""
SMTP_PASSWORD = ""
SMTP_SECURE = "false"

[[config.mounts]]
filePath = "admin-setup.key"
content = """${admin_setup_key}"""

[[config.mounts]]
filePath = "Caddyfile"
content = """
http://${domain} {
  encode zstd gzip
  handle /dashboard* {
    reverse_proxy dashboard:3000
  }
  handle /preferences* {
    reverse_proxy links:3005
  }
  handle /redirect* {
    reverse_proxy links:3005
  }
  handle /api/auth* {
    reverse_proxy auth:8000
  }
  handle /api/domain* {
    reverse_proxy domain:8011
  }
  handle /api/api-key* {
    reverse_proxy api-key:8012
  }
  handle /api/webhook* {
    reverse_proxy webhook:8013
  }
  handle /api/contacts* {
    reverse_proxy contacts:8014
  }
  handle /api/mail* {
    reverse_proxy mail:8015
  }
  handle /api/logs* {
    reverse_proxy logs:8016
  }
  handle /api/workflow* {
    reverse_proxy workflow:8017
  }
  handle /api/upload* {
    reverse_proxy upload:8018
  }
  handle /api/template* {
    reverse_proxy template:8019
  }
  handle /api/campaigns* {
    reverse_proxy campaigns:8027
  }
  handle /api/inbox* {
    reverse_proxy inbox:8028
  }
  handle /api/email* {
    reverse_proxy email:8022
  }
  handle {
    redir /* /dashboard 302
  }
}

http://link.${domain} {
  encode zstd gzip
  handle /api/mail* {
    reverse_proxy mail:8015
  }
  handle {
    reverse_proxy links:3005
  }
}
"""
