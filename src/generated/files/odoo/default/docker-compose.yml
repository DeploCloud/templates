services:
  odoo:
    image: odoo:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - odoo
      - --db_host=db
      - --db_port=5432
      - --db_user=odoo
      - --db_password=${DB_PASSWORD}
    expose:
      - 8069
    volumes:
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - odoo-database:/var/lib/postgresql

volumes:
  odoo-data: {}
  odoo-database: {}
