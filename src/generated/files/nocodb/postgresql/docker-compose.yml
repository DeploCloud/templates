services:
  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    expose:
      - 8080
    environment:
      NC_DB: "pg://db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_REDIS_URL: redis://redis:6379
      NC_SITE_URL: ${NC_SITE_URL}
      NC_DISABLE_MUX: "true"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_APP_DATA_DIR: /usr/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - nocodb-data:/usr/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 --spider http://localhost:8080/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    environment:
      NC_DB: "pg://db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_REDIS_URL: redis://redis:6379
      NC_SITE_URL: ${NC_SITE_URL}
      NC_WORKER_CONTAINER: "true"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_APP_DATA_DIR: /usr/app/data
    depends_on:
      nocodb:
        condition: service_healthy
    volumes:
      - nocodb-data:/usr/app/data

  db:
    image: postgres:17.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nocodb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - nocodb-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nocodb-data: {}
  nocodb-postgres: {}
  nocodb-redis: {}
