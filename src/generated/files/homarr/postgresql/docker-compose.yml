services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v2.9.1@sha256:9421086c541f0e83057eaac7b6181c6d3044835227017bea9fc4d0fffee49aa6
    restart: unless-stopped
    expose:
      - 7575
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      DB_DRIVER: ${DB_DRIVER}
      DB_DIALECT: ${DB_DIALECT}
      DB_URL: ${DB_URL}
    volumes:
      - homarr-appdata:/appdata
    depends_on:
      homarr-db:
        condition: service_healthy

  homarr-db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: homarr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: homarr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homarr -d homarr"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - homarr-postgres:/var/lib/postgresql

volumes:
  homarr-appdata: {}
  homarr-postgres: {}
