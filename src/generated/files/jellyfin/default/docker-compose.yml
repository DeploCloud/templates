services:
  jellyfin:
    image: jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
    expose:
      - 8096
    volumes:
      - config:/config
      - cache:/cache
      - media:/media
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=https://${JELLYFIN_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  config:
  cache:
  media:
