services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    expose:
      - 8096
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - config:/config
      - cache:/cache
      - media:/media
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=https://${JELLYFIN_HOST}
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  config:
  cache:
  media:
