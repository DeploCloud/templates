services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3
    restart: unless-stopped
    expose:
      - 3000
    environment:
      USER_UID: ${USER_UID}
      USER_GID: ${USER_GID}
      FORGEJO__database__DB_TYPE: ${FORGEJO__database__DB_TYPE}
      FORGEJO__database__HOST: ${FORGEJO__database__HOST}
      FORGEJO__database__NAME: ${FORGEJO__database__NAME}
      FORGEJO__database__USER: ${FORGEJO__database__USER}
      FORGEJO__database__PASSWD: ${FORGEJO__database__PASSWD}
      FORGEJO__server__ROOT_URL: ${FORGEJO__server__ROOT_URL}
      FORGEJO__server__DOMAIN: ${FORGEJO__server__DOMAIN}
      FORGEJO__server__DISABLE_SSH: ${FORGEJO__server__DISABLE_SSH}
    volumes:
      - forgejo-data:/data
    depends_on:
      forgejo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  forgejo-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
      POSTGRES_DB: forgejo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - forgejo-postgres:/var/lib/postgresql/data

volumes:
  forgejo-data: {}
  forgejo-postgres: {}
