services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17.4
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8123/ping",
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_USER: default
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ./clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/resource-limits.xml:/etc/clickhouse-server/config.d/resource-limits.xml:ro
      - ./clickhouse/user-settings.xml:/etc/clickhouse-server/users.d/user-settings.xml:ro

  postgres:
    image: postgres:17.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.6.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

  backend:
    image: ghcr.io/rybbit-io/rybbit-backend:v2.8.0
    restart: unless-stopped
    expose:
      - 3001
    environment:
      NODE_ENV: production
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BASE_URL: ${BASE_URL}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY}
      LITE_DASHBOARD: ${LITE_DASHBOARD}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS}
      DEPLOYMENT: ${DEPLOYMENT}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/api/health",
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    image: ghcr.io/rybbit-io/rybbit-client:v2.8.0
    restart: unless-stopped
    expose:
      - 3002
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${BASE_URL}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      NEXT_PUBLIC_DEPLOYMENT: ${DEPLOYMENT}
      NEXT_PUBLIC_LITE_DASHBOARD: ${LITE_DASHBOARD}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
  redis-data:
