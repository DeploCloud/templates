services:
  authentik:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    restart: unless-stopped
    command: server
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 9000
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_POSTGRESQL__HOST: "${AUTHENTIK_POSTGRESQL__HOST}"
      AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRESQL__NAME}"
      AUTHENTIK_POSTGRESQL__USER: "${AUTHENTIK_POSTGRESQL__USER}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRESQL__PASSWORD}"
    volumes:
      - authentik-media:/data
    shm_size: 512mb
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U authentik -d authentik
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - authentik-database:/var/lib/postgresql/data
  worker:
    image: ghcr.io/goauthentik/server:2026.8.4@sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
    restart: unless-stopped
    command: worker
    shm_size: 512mb
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_POSTGRESQL__HOST: "${AUTHENTIK_POSTGRESQL__HOST}"
      AUTHENTIK_POSTGRESQL__NAME: "${AUTHENTIK_POSTGRESQL__NAME}"
      AUTHENTIK_POSTGRESQL__USER: "${AUTHENTIK_POSTGRESQL__USER}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_POSTGRESQL__PASSWORD}"
    volumes:
      - authentik-media:/data
volumes:
  authentik-media: {}
  authentik-database: {}
