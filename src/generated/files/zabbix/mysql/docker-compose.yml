services:
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.4.15@sha256:ab81fc2301f3aa4c2cac617f943dd2fc91e0e76d0bf0b6f1d386e027b8608efb
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    expose:
      - 10051
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${DB_PASSWORD}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.4.15@sha256:d5df1afe94dd8a328c9a0a779064c8d08a620d727dcf02ff76aa73c3f918a7c1
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
      zabbix-db:
        condition: service_healthy
    expose:
      - 8080
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${DB_PASSWORD}
      PHP_TZ: Europe/Rome

  zabbix-db:
    image: mysql:8.4-oracle@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - zabbix-database:/var/lib/mysql

volumes:
  zabbix-database: {}
