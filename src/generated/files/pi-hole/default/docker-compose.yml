services:
  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    expose:
      - 80
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${FTLCONF_WEB_PASSWORD}
      FTLCONF_dns_listeningMode: all
    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d

volumes:
  pihole-etc: {}
  pihole-dnsmasq: {}
