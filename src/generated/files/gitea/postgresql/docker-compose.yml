services:
  gitea:
    image: docker.gitea.com/gitea:1.27.2
    restart: unless-stopped
    expose:
      - 3000
    environment:
      USER_UID: ${USER_UID}
      USER_GID: ${USER_GID}
      GITEA__database__DB_TYPE: ${GITEA__database__DB_TYPE}
      GITEA__database__HOST: ${GITEA__database__HOST}
      GITEA__database__NAME: ${GITEA__database__NAME}
      GITEA__database__USER: ${GITEA__database__USER}
      GITEA__database__PASSWD: ${GITEA__database__PASSWD}
      GITEA__server__ROOT_URL: ${GITEA__server__ROOT_URL}
      GITEA__server__DOMAIN: ${GITEA__server__DOMAIN}
      GITEA__server__DISABLE_SSH: ${GITEA__server__DISABLE_SSH}
    volumes:
      - gitea-data:/data
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  gitea-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_DB: gitea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - gitea-postgres:/var/lib/postgresql/data

volumes:
  gitea-data: {}
  gitea-postgres: {}
