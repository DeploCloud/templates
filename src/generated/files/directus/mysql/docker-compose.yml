services:
  directus:
    image: directus/directus:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8055
    environment:
      DB_CLIENT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET: ${SECRET}
    volumes:
      - directus-uploads:/directus/uploads

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: directus
      MYSQL_USER: directus
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - directus-database:/var/lib/mysql

volumes:
  directus-uploads: {}
  directus-database: {}
