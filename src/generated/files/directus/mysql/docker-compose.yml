services:
  directus:
    image: directus/directus:12.5.0@sha256:7de5d6898b955dab1672619aed590035dcade4f8d7396d913e55543e114d1331
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8055
    environment:
      DB_CLIENT: mysql2
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET: ${SECRET}
    volumes:
      - directus-uploads:/directus/uploads

  db:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: directus
      MYSQL_USER: directus
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - directus-database:/var/lib/mysql

volumes:
  directus-uploads: {}
  directus-database: {}
