[variables]
db_password = "${password:32}"

[config]
mounts = []

[[config.domains]]
serviceName = "metabase"
port = 3_000
host = "${domain}"

[config.env]
MB_DB_TYPE = "postgres"
MB_DB_DBNAME = "metabaseappdb"
MB_DB_PORT = "5432"
MB_DB_USER = "metabase"
MB_DB_PASS = "${db_password}"
MB_DB_HOST = "metabase-db"
MB_SITE_URL = "https://${domain}"
