services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.76.2
    restart: unless-stopped
    expose:
      - 7575
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      DB_DRIVER: ${DB_DRIVER}
      DB_DIALECT: ${DB_DIALECT}
      DB_URL: ${DB_URL}
    volumes:
      - homarr-appdata:/appdata
    depends_on:
      homarr-db:
        condition: service_healthy

  homarr-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homarr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: homarr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homarr -d homarr"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - homarr-postgres:/var/lib/postgresql

volumes:
  homarr-appdata: {}
  homarr-postgres: {}
