services:
  documenso:
    image: docker.io/documenso/documenso:v2.17.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 3000
    environment:
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PRIVATE_DATABASE_URL: ${NEXT_PRIVATE_DATABASE_URL}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: ${NEXT_PRIVATE_DIRECT_DATABASE_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - documenso-storage:/opt/documenso/storage

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - documenso-database:/var/lib/postgresql

volumes:
  documenso-storage: {}
  documenso-database: {}
