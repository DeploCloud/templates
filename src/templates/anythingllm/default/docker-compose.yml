    image: mintplexlabs/anythingllm:1.18.0@sha256:5461782e7db41318a516925949a8f8366e258dd576411fca7961fe77dff054cc
    restart: unless-stopped
    expose:
      - 3001
    environment:
      STORAGE_DIR: ${STORAGE_DIR}
    volumes:
      - anythingllm-storage:/app/server/storage

volumes:
  anythingllm-storage: {}
