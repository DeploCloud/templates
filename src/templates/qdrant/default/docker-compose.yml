services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    expose:
      - 6333
      - 6334
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant-data: {}
