services:
  coder:
    image: ghcr.io/coder/coder:latest
    restart: unless-stopped
    expose:
      - 7080
    depends_on:
      coder-db:
        condition: service_healthy
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL}
      CODER_HTTP_ADDRESS: ${CODER_HTTP_ADDRESS}
      CODER_PG_CONNECTION_URL: ${CODER_PG_CONNECTION_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  coder-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coder
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - coder-postgres:/var/lib/postgresql

volumes:
  coder-postgres: {}
