services:
  coder:
    image: ghcr.io/coder/coder:v2.37.4@sha256:48e36bcb1a4c78a99973ac63a9710f2d705d5cac51d86131e88a9942515a6839
    restart: unless-stopped
    expose:
      - 7080
    depends_on:
      coder-db:
        condition: service_healthy
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL}
      CODER_HTTP_ADDRESS: ${CODER_HTTP_ADDRESS}
      CODER_PG_CONNECTION_URL: ${CODER_PG_CONNECTION_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  coder-db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: coder
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - coder-postgres:/var/lib/postgresql/data

volumes:
  coder-postgres: {}
