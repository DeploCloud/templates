services:
  odoo:
    image: odoo:20@sha256:61e3c71b0503c5f658e604c3e340bede20b97d05f726179fa006eae50a32fd23
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - odoo
      - --db_host=db
      - --db_port=5432
      - --db_user=odoo
      - --db_password=${DB_PASSWORD}
    expose:
      - 8069
    volumes:
      - odoo-data:/var/lib/odoo

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - odoo-database:/var/lib/postgresql

volumes:
  odoo-data: {}
  odoo-database: {}
