services:
  strapi:
    image: elestio/strapi-production:v5.57.0@sha256:d98bb855fe23e7fafe87f94f4ba21e9ba7536ad45ce5b4ae2d2fce881d11db9a
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 1337
    environment:
      NODE_ENV: production
      STRAPI_TELEMETRY_DISABLED: true
      STRAPI_PLUGIN_I18N_INIT_LOCALE_CODE: en
      FAST_REFRESH: true
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - strapi-data:/srv/app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1337"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - strapi-database:/var/lib/postgresql/data

volumes:
  strapi-data: {}
  strapi-database: {}
