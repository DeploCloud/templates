services:
  signoz:
    image: signoz/signoz:latest
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    expose:
      - 8080
    environment:
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: ${SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN}
      SIGNOZ_SQLSTORE_SQLITE_PATH: ${SIGNOZ_SQLSTORE_SQLITE_PATH}
      SIGNOZ_TELEMETRYSTORE_PROVIDER: ${SIGNOZ_TELEMETRYSTORE_PROVIDER}
      SIGNOZ_ALERTMANAGER_PROVIDER: ${SIGNOZ_ALERTMANAGER_PROVIDER}
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_TOKENIZER_JWT_SECRET}
    volumes:
      - signoz-data:/var/lib/signoz

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    restart: unless-stopped
    expose:
      - 9000
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  signoz-data: {}
  clickhouse-data: {}
