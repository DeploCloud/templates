services:
  signoz:
    image: signoz/signoz:v0.146.0@sha256:cd3ca6950df3b3681b4629c1b2cea4d3bcd5fece57445a3ec2a1a20466ab14ca
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    expose:
      - 8080
    environment:
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: ${SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN}
      SIGNOZ_SQLSTORE_SQLITE_PATH: ${SIGNOZ_SQLSTORE_SQLITE_PATH}
      SIGNOZ_TELEMETRYSTORE_PROVIDER: ${SIGNOZ_TELEMETRYSTORE_PROVIDER}
      SIGNOZ_ALERTMANAGER_PROVIDER: ${SIGNOZ_ALERTMANAGER_PROVIDER}
      SIGNOZ_TOKENIZER_JWT_SECRET: ${SIGNOZ_TOKENIZER_JWT_SECRET}
    volumes:
      - signoz-data:/var/lib/signoz

  clickhouse:
    image: clickhouse/clickhouse-server:25.5.6@sha256:4536143e22dc9bddb217c7e610f6b7ed5e6efd8fefdbc61acdeadb5d8022213a
    restart: unless-stopped
    expose:
      - 9000
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  signoz-data: {}
  clickhouse-data: {}
