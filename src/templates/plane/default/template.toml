[variables]
db_password = "${password:32}"
minio_password = "${password:32}"
rabbitmq_password = "${password:32}"
secret_key = "${base64:48}"

[config.env]
WEB_URL = "https://${domain}"
POSTGRES_USER = "plane"
POSTGRES_PASSWORD = "${db_password}"
POSTGRES_DB = "plane"
DATABASE_URL = "postgresql://plane:${db_password}@plane-db:5432/plane"
REDIS_URL = "redis://plane-redis:6379/"
MINIO_ROOT_USER = "access-key"
MINIO_ROOT_PASSWORD = "${minio_password}"
RABBITMQ_DEFAULT_USER = "plane"
RABBITMQ_DEFAULT_PASS = "${rabbitmq_password}"
RABBITMQ_DEFAULT_VHOST = "plane"
AMQP_URL = "amqp://plane:${rabbitmq_password}@plane-mq:5672/plane"
SECRET_KEY = "${secret_key}"
USE_MINIO = "1"
AWS_ACCESS_KEY_ID = "access-key"
AWS_SECRET_ACCESS_KEY = "${minio_password}"
AWS_S3_ENDPOINT_URL = "http://plane-minio:9000"
AWS_S3_BUCKET_NAME = "uploads"
MINIO_ENDPOINT_SSL = "0"
API_BASE_URL = "http://api:8000"
GUNICORN_WORKERS = "1"
CORS_ALLOWED_ORIGINS = "https://${domain}"

[[config.domains]]
serviceName = "proxy"
port = 80
host = "${domain}"

[[config.mounts]]
filePath = ".env"
content = """APP_RELEASE=v0.27.1
WEB_URL=https://${domain}
POSTGRES_USER=plane
POSTGRES_PASSWORD=${db_password}
POSTGRES_DB=plane
DATABASE_URL=postgresql://plane:${db_password}@plane-db:5432/plane
REDIS_URL=redis://plane-redis:6379/
MINIO_ROOT_USER=access-key
MINIO_ROOT_PASSWORD=${minio_password}
RABBITMQ_DEFAULT_USER=plane
RABBITMQ_DEFAULT_PASS=${rabbitmq_password}
RABBITMQ_DEFAULT_VHOST=plane
AMQP_URL=amqp://plane:${rabbitmq_password}@plane-mq:5672/plane
SECRET_KEY=${secret_key}
USE_MINIO=1
AWS_ACCESS_KEY_ID=access-key
AWS_SECRET_ACCESS_KEY=${minio_password}
AWS_S3_ENDPOINT_URL=http://plane-minio:9000
AWS_S3_BUCKET_NAME=uploads
MINIO_ENDPOINT_SSL=0
API_BASE_URL=http://api:8000
GUNICORN_WORKERS=1
CORS_ALLOWED_ORIGINS=https://${domain}
"""
