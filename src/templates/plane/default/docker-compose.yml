services:
  web:
    image: makeplane/plane-frontend:v1.4.2@sha256:22fd2434fb8d6658439f669ab72f999ce0773abe587663da21a77d70bd63ff61
    depends_on:
      - api
      - worker
    env_file: .env
    restart: unless-stopped
  space:
    image: makeplane/plane-space:v1.4.2@sha256:f8f842f05f41a16e9fe8c4f5e17a3bb175338ccdc094620e58ae49764ffbd671
    depends_on:
      - api
      - worker
      - web
    env_file: .env
    restart: unless-stopped
  admin:
    image: makeplane/plane-admin:v1.4.2@sha256:6e1bb1d800d3c7ce84a09f810d5588db8613b35d4464e722a1bec12556ca0ebb
    depends_on:
      - api
      - web
    env_file: .env
    restart: unless-stopped
  live:
    image: makeplane/plane-live:v1.4.2@sha256:cbb630ccaea24bb9998040cb45c11619a7501e8b6c75d449df2f8fd9b9cddbd0
    depends_on:
      - api
      - web
    env_file: .env
    restart: unless-stopped
  api:
    image: makeplane/plane-backend:v1.4.2@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    command: ./bin/docker-entrypoint-api.sh
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    env_file: .env
    volumes:
      - plane-api-logs:/code/plane/logs
    restart: unless-stopped
  worker:
    image: makeplane/plane-backend:v1.4.2@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    env_file: .env
    volumes:
      - plane-worker-logs:/code/plane/logs
    restart: unless-stopped
  beat-worker:
    image: makeplane/plane-backend:v1.4.2@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    env_file: .env
    volumes:
      - plane-beat-logs:/code/plane/logs
    restart: unless-stopped
  migrator:
    image: makeplane/plane-backend:v1.4.2@sha256:90032ce088708889b60c00d491897916f4deb882facda27db59fd10fb68729ef
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
      - plane-db
      - plane-redis
    env_file: .env
    volumes:
      - plane-migrator-logs:/code/plane/logs
    restart: unless-stopped
  plane-db:
    image: postgres:15.7-alpine@sha256:468d34fefd6338031787c7b8e94078975b3aaf4d66c7ead25c39cd3ba46a15c6
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U plane -d plane
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - plane-postgres:/var/lib/postgresql/data
    restart: unless-stopped
  plane-redis:
    image: valkey/valkey:7.2.11-alpine@sha256:10328d00120dc14fbc87b2ed61b7677ddbb0d011e705361b4788329a0ec69a93
    volumes:
      - plane-redis:/data
    restart: unless-stopped
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine@sha256:611107e29cce05c2acd968325d5dcbde7e2fee404970f1ead75fdb22be2821b3
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - plane-rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
  plane-minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: 'server /export --console-address ":9090"'
    environment:
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - plane-uploads:/export
    restart: unless-stopped
  proxy:
    image: makeplane/plane-proxy:v1.4.2@sha256:47e651c56749c287710cc26f82dc5d1046a2af76a332aa048ab7adb881cc4cd0
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    env_file: .env
    environment:
      BUCKET_NAME: "${AWS_S3_BUCKET_NAME:-uploads}"
      FILE_SIZE_LIMIT: "${FILE_SIZE_LIMIT:-5242880}"
    expose:
      - 80
    restart: unless-stopped
volumes:
  plane-api-logs: {}
  plane-worker-logs: {}
  plane-beat-logs: {}
  plane-migrator-logs: {}
  plane-postgres: {}
  plane-redis: {}
  plane-rabbitmq: {}
  plane-uploads: {}
