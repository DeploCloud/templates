[variables]
main_domain = "${domain}"
secret_key = "${password:64}"
salt_keys = "${hash:32}"
object_storage_access_key = "${hash:32}"
object_storage_secret_key = "${password:64}"
internal_api_secret = "${password:64}"
internal_request_token = "${password:64}"
browserless_secret = "${password:64}"

[config]
[[config.domains]]
serviceName = "proxy"
port = 80
host = "${main_domain}"
path = "/"

[config.env]
# The application image and downloaded assets use the same upstream commit.
POSTHOG_VERSION = "25e202725e333a0f3cd748fb9c79336a8a6dc8d0"
POSTHOG_SITE_URL = "https://${main_domain}"
POSTHOG_SECURE_COOKIES = "true"
POSTHOG_SECRET_KEY = "${secret_key}"
POSTHOG_ENCRYPTION_SALT_KEYS = "${salt_keys}"
POSTHOG_OBJECT_STORAGE_ACCESS_KEY = "${object_storage_access_key}"
POSTHOG_OBJECT_STORAGE_SECRET_KEY = "${object_storage_secret_key}"
POSTHOG_INTERNAL_API_SECRET = "${internal_api_secret}"
POSTHOG_INTERNAL_REQUEST_TOKEN = "${internal_request_token}"
POSTHOG_BROWSERLESS_SECRET = "${browserless_secret}"

[[config.mounts]]
filePath = "db-init/create-extra-dbs.sh"
content = """
#!/bin/bash
# Creates the auxiliary databases PostHog services can point at
# (mirrors docker/postgres-init-scripts in the PostHog repo)
set -e
set -u

for db in cyclotron posthog_persons behavioral_cohorts; do
    DB_EXISTS=$(psql -U "$POSTGRES_USER" -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")
    if [ -z "$DB_EXISTS" ]; then
        echo "Creating database '$db'..."
        psql -U "$POSTGRES_USER" -c "CREATE DATABASE $db;"
        psql -U "$POSTGRES_USER" -c "GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;"
    fi
done
"""

[[config.mounts]]
filePath = "livestream/configs.yml"
content = '''
debug: false
kafka:
    brokers: 'kafka:9092'
    topic: 'events_plugin_ingestion'
    group_id: 'livestream'
    security_protocol: 'PLAINTEXT'
    session_recording_enabled: true
    session_recording_security_protocol: 'PLAINTEXT'
consumers:
    event:
        enabled: true
        brokers: 'kafka:9092'
        topic: 'events_plugin_ingestion'
        security_protocol: 'PLAINTEXT'
        group_id: 'livestream'
    session_recording:
        enabled: true
        brokers: 'kafka:9092'
        topic: 'session_recording_snapshot_item_events'
        security_protocol: 'PLAINTEXT'
        group_id: 'livestream-session-recordings'
    notification:
        enabled: false
mmdb:
    path: 'GeoLite2-City.mmdb'
'''

