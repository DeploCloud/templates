services:
  mattermost:
    image: mattermost/mattermost-team-edition:12.0.0@sha256:c213d4eb01c2973a3814f57dab4e0629287b92896cb2f98d27134aa62ee5c3cc
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8065
    environment:
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL}
      MM_SQLSETTINGS_DRIVERNAME: ${MM_SQLSETTINGS_DRIVERNAME}
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQLSETTINGS_DATASOURCE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mattermost-data:/mattermost/data

  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mattermost-database:/var/lib/postgresql

volumes:
  mattermost-data: {}
  mattermost-database: {}
