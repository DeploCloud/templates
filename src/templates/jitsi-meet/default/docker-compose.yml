services:
  jitsi-web:
    image: ghcr.io/jitsi/web:stable-11248@sha256:615d9882b7bc2bc0b648fb48c153ce2b9c503f37a15e6aaf4f1c8e40f5cf8ca4
    restart: unless-stopped
    expose:
      - 8000
    environment:
      CONFIG: ${CONFIG}
      ENABLE_AUTH: ${ENABLE_AUTH}
      ENABLE_GUESTS: ${ENABLE_GUESTS}
      AUTH_TYPE: ${AUTH_TYPE}
      DISABLE_HTTPS: ${DISABLE_HTTPS}
      ENABLE_HTTP_REDIRECT: ${ENABLE_HTTP_REDIRECT}
      ENABLE_LETSENCRYPT: ${ENABLE_LETSENCRYPT}
      PUBLIC_URL: ${PUBLIC_URL}
      TZ: ${TZ}
      XMPP_DOMAIN: ${XMPP_DOMAIN}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN}
      XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN}
      XMPP_GUEST_DOMAIN: ${XMPP_GUEST_DOMAIN}
      XMPP_RECORDER_DOMAIN: ${XMPP_RECORDER_DOMAIN}
      XMPP_PORT: ${XMPP_PORT}
    volumes:
      - jitsi-web-config:/config
      - jitsi-web-storage:/storage
    depends_on:
      - jitsi-jvb
    networks:
      - meet-jitsi

  jitsi-prosody:
    image: ghcr.io/jitsi/prosody:stable-11248@sha256:a7a58090d93412f7ecd6692330631519833b2e8c8b06ff433089fb54b7149bb2
    restart: unless-stopped
    expose:
      - 5222
      - 5269
      - 5280
      - 5347
    environment:
      AUTH_TYPE: ${AUTH_TYPE}
      ENABLE_AUTH: ${ENABLE_AUTH}
      ENABLE_GUESTS: ${ENABLE_GUESTS}
      XMPP_DOMAIN: ${XMPP_DOMAIN}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN}
      XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN}
      XMPP_GUEST_DOMAIN: ${XMPP_GUEST_DOMAIN}
      XMPP_RECORDER_DOMAIN: ${XMPP_RECORDER_DOMAIN}
      XMPP_SERVER: ${XMPP_SERVER}
      XMPP_PORT: ${XMPP_PORT}
      JICOFO_AUTH_USER: ${JICOFO_AUTH_USER}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JVB_AUTH_USER: ${JVB_AUTH_USER}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_BREWERY_MUC: ${JVB_BREWERY_MUC}
      TZ: ${TZ}
    volumes:
      - jitsi-prosody-config:/config
      - jitsi-prosody-data:/var/lib/prosody
    networks:
      - meet-jitsi

  jitsi-jicofo:
    image: ghcr.io/jitsi/jicofo:stable-11248@sha256:c4c1ad331d4d942bc433e5452d75c25758dab7058e3fe07b970ced54cb7f5e47
    restart: unless-stopped
    expose:
      - 8888
    environment:
      ENABLE_AUTH: ${ENABLE_AUTH}
      AUTH_TYPE: ${AUTH_TYPE}
      XMPP_DOMAIN: ${XMPP_DOMAIN}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN}
      XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN}
      XMPP_RECORDER_DOMAIN: ${XMPP_RECORDER_DOMAIN}
      XMPP_SERVER: ${XMPP_SERVER}
      XMPP_PORT: ${XMPP_PORT}
      JICOFO_AUTH_USER: ${JICOFO_AUTH_USER}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JVB_BREWERY_MUC: ${JVB_BREWERY_MUC}
      TZ: ${TZ}
    volumes:
      - jitsi-jicofo-config:/config
    depends_on:
      - jitsi-prosody
    networks:
      - meet-jitsi

  jitsi-jvb:
    image: ghcr.io/jitsi/jvb:stable-11248@sha256:55cf534aa12931c524835269475c1ea63e5e884a43540f9b318378fd080a335c
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment:
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN}
      XMPP_SERVER: ${XMPP_SERVER}
      XMPP_PORT: ${XMPP_PORT}
      JVB_AUTH_USER: ${JVB_AUTH_USER}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_BREWERY_MUC: ${JVB_BREWERY_MUC}
      JVB_PORT: ${JVB_PORT}
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS}
      TZ: ${TZ}
    volumes:
      - jitsi-jvb-config:/config
    depends_on:
      - jitsi-prosody
    networks:
      - meet-jitsi

volumes:
  jitsi-web-config: {}
  jitsi-web-storage: {}
  jitsi-prosody-config: {}
  jitsi-prosody-data: {}
  jitsi-jicofo-config: {}
  jitsi-jvb-config: {}

networks:
  meet-jitsi: {}
