x-logging:
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 10m
services:
  traefik:
    image: traefik:3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    command:
      - "--providers.file.directory=/storage/config"
      - "--providers.file.watch=true"
      - "--entrypoints.appwrite_web.address=:80"
      - "--entrypoints.appwrite_websecure.address=:443"
      - "--entrypoints.appwrite_mqtt.address=:8883"
      - "--entrypoints.appwrite_mqtt_ws.address=:8084"
    expose:
      - "80"
      - "443"
      - "8883"
      - "8084"
    volumes:
      - appwrite-config:/storage/config:ro
      - ./traefik-routes.yml:/storage/config/deplo-routes.yml:ro
      - appwrite-certificates:/storage/certificates:ro
    environment:
      - _APP_DOMAIN=${_APP_DOMAIN:-localhost}
      - _APP_CONSOLE_DOMAIN=${_APP_CONSOLE_DOMAIN:-localhost}
    depends_on:
      - appwrite
    networks:
      - gateway
      - appwrite
  appwrite:
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    image: appwrite/appwrite:2.6.1@sha256:1e8dda54b5908874a95d49044f41603de4c4933b8b21ee7de09126f7af56f904
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -f /tmp/.appwrite-ready && curl -fsS -o /dev/null -H "Host: ${_APP_DOMAIN:-localhost}" http://localhost/v1/health/version'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - appwrite
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-imports:/storage/imports:rw
      - appwrite-cache:/storage/cache:rw
      - appwrite-config:/storage/config:rw
      - appwrite-certificates:/storage/certificates:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - appwrite-builds:/storage/builds:rw
    depends_on:
      - redis
      - "${_APP_DB_HOST:-postgresql}"
      - appwrite-geo
      - appwrite-autogravity
      - appwrite-exiftool
