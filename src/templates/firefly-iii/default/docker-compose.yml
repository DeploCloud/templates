services:
  firefly-app:
    image: fireflyiii/core:version-6.7.9@sha256:a2b53539338d1cd04d341b229c3806cb178cf64c72459060e3ed34bec4167bd8
    restart: unless-stopped
    expose:
      - 8080
    environment:
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      SITE_OWNER: ${SITE_OWNER}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
      TZ: ${TZ}
    volumes:
      - firefly-upload:/var/www/html/storage/upload
    depends_on:
      firefly-db:
        condition: service_healthy

  firefly-db:
    image: mariadb:lts@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: firefly
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - firefly-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  firefly-cron:
    image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: unless-stopped
    environment:
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
    command:
      - sh
      - -c
      - apk add --no-cache wget && while true; do wget -qO- http://firefly-app:8080/api/v1/cron/$$STATIC_CRON_TOKEN; sleep 3600; done
    depends_on:
      firefly-app:
        condition: service_started

volumes:
  firefly-upload: {}
  firefly-mariadb: {}
