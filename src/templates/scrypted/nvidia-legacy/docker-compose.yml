services:
  scrypted:
    image: ghcr.io/koush/scrypted:v0.147.0-noble-nvidia-legacy@sha256:11df23c5cb89599a5fe16ad73093363a9fef2ae90aa205baffdd19e08cab5ab3
    restart: unless-stopped
    expose:
      - 11080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - scrypted-data:/server/volume

volumes:
  scrypted-data: {}
