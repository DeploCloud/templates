services:
  nocodb:
    image: nocodb/nocodb:2026.09.1@sha256:27d2fd14670db892ac721849d4f071edce47e386a1e74c921a0162644b9c213d
    restart: unless-stopped
    expose:
      - 8080
    environment:
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_SITE_URL: ${NC_SITE_URL}
      NC_APP_DATA_DIR: /usr/app/data
    volumes:
      - nocodb-data:/usr/app/data

volumes:
  nocodb-data: {}
