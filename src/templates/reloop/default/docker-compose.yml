name: reloop

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_healthy

x-backend-depends: &backend-depends
  <<: *infra-ready
  migrate:
    condition: service_completed_successfully

x-backend: &backend
  restart: unless-stopped
  env_file:
    - .env
  depends_on: *backend-depends
  dns:
    - 1.1.1.1
    - 8.8.8.8
  networks:
    - reloop
  <<: *logging

x-frontend: &frontend
  restart: unless-stopped
  environment:
    NODE_ENV: production
  networks:
    - reloop
  <<: *logging

services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: reloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - reloop
    <<: *logging

  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: reloop-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --dir
      - /data
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - reloop
    <<: *logging

  nats:
    image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    container_name: reloop-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - reloop
    <<: *logging

  proxy:
    image: caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    container_name: reloop-proxy
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      reloop:
        aliases:
          - ${RELOOP_DOMAIN}
          - ${RELOOP_TRACKING_HOST}
    <<: *logging

  auth:
    <<: *backend
    image: reloopsh/be-auth@sha256:de157dbd7a74514f2519db1cfd436aa7f5f98f8a3ac56893b2b465b88c1ed588
    container_name: reloop-auth
    environment:
      PORT: 8000
    volumes:
      - ./admin-setup.key:/run/reloop/admin-setup.key
      - ./.env:/run/reloop/.env

  domain:
    <<: *backend
    image: reloopsh/be-domain@sha256:9b62e4e8826f60400c5f3cac6e63a377b3cf5f2763dfa146fb9c2cb30bbcad59
    container_name: reloop-domain
    environment:
      PORT: 8011

  api-key:
    <<: *backend
    image: reloopsh/be-api-key@sha256:535f9837d39acdd7e155a14752b1ab6e3cbef06331cf26634577ff82a0156572
    container_name: reloop-api-key
    environment:
      PORT: 8012

  webhook:
    <<: *backend
    image: reloopsh/be-webhook@sha256:644a6b79756f57c045c8572c42bee6dfb6b31663ee08d21f2565cead4dfc1ca9
    container_name: reloop-webhook
    environment:
      PORT: 8013

  contacts:
    <<: *backend
    image: reloopsh/be-contacts@sha256:43da0b373e2777fdc7af97d92fdb916320a27e2ffdea61df69bca477722b2dfa
    container_name: reloop-contacts
    environment:
      PORT: 8014

  mail:
    <<: *backend
    image: reloopsh/be-mail@sha256:0231070e83b9e40d3e1c865ca0f9c67d8e5a154c4f12a682fedd69fa0102ac50
    container_name: reloop-mail
    environment:
      PORT: 8015
      KUMOMTA_HTTP_URL: http://smtp:8000

  logs:
    <<: *backend
    image: reloopsh/be-logs@sha256:ad38ab5d93a3af671d6ac7344daba1bdadd84ac1a10123e694d98801bfa01545
    container_name: reloop-logs
    environment:
      PORT: 8016

  workflow:
    <<: *backend
    image: reloopsh/be-workflow@sha256:a2bf13906f5dafb93068fcb4cd9ee2bea0a00f3de952afb7b62cd75b9c4fc001
    container_name: reloop-workflow
    environment:
      PORT: 8017

  upload:
    <<: *backend
    image: reloopsh/be-upload@sha256:22632cbbc686fa0c766a0ecd316b4bdeb3097fe5652d3b8e183133ff8055a299
    container_name: reloop-upload
    profiles:
      - storage
    environment:
      PORT: 8018

  template:
    <<: *backend
    image: reloopsh/be-template@sha256:b6c9c02f8e0489bd86330312e797f5773156e6ca92c04e6e2f4fc51f25728e25
    container_name: reloop-template
    environment:
      PORT: 8019

  campaigns:
    <<: *backend
    image: reloopsh/be-campaigns@sha256:446287b0dc88f77ca5ac12199bda637e1e2216a38a47e281be161dba4fea3624
    container_name: reloop-campaigns
    environment:
      PORT: 8027

  inbox:
    <<: *backend
    image: reloopsh/be-inbox@sha256:5174f629bf7d2c3da0818a2ef44a779213cd456ce4e85f6ae6cf24ac909b064c
    container_name: reloop-inbox
    environment:
      PORT: 8028

  email:
    <<: *backend
    image: reloopsh/be-email@sha256:6931a0cebb8247ddbe1ba9a6b46d6eb477df06d9cfebeef3a139374077691778
    container_name: reloop-email
    environment:
      PORT: 8022

  spam:
    image: reloopsh/be-spam@sha256:4fcd262354ddb11ed67d8ce8f4b5f08b274f22a8da6987233fb1486d9150a540
    container_name: reloop-spam
    restart: unless-stopped
    environment:
      RSPAMD_REDIS_SERVERS: redis:6379
      RSPAMD_REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - rspamd-data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  smtp:
    image: reloopsh/be-smtp@sha256:9980dbea67a5c7eb55ee1e7d591734c0b967fdda8178e9b260ba4e7f859031b0
    container_name: reloop-smtp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: ${RELOOP_DOMAIN}
      KUMOMTA_MIN_FREE_SPACE: ${KUMOMTA_MIN_FREE_SPACE:-5%}
      KUMOMTA_MIN_FREE_INODES: ${KUMOMTA_MIN_FREE_INODES:-0}
    ports:
      - "465:465"
      - "587:587"
    volumes:
      - smtp-data:/var/spool/kumomta/data
      - smtp-meta:/var/spool/kumomta/meta
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

  inbound:
    image: reloopsh/be-inbound@sha256:28c6ca80d51d3c83319ddc3c00b370668a1779af134a2c60e7daedd23e7691fc
    container_name: reloop-inbound
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: ${RELOOP_INBOUND_HOST}
      INBOUND_HOSTNAME: ${RELOOP_INBOUND_HOST}
      KUMOMTA_MIN_FREE_SPACE: ${KUMOMTA_MIN_FREE_SPACE:-5%}
      KUMOMTA_MIN_FREE_INODES: ${KUMOMTA_MIN_FREE_INODES:-0}
    ports:
      - "25:25"
    volumes:
      - inbound-data:/var/spool/kumomta/data
      - inbound-meta:/var/spool/kumomta/meta
    depends_on:
      nats:
        condition: service_healthy
      spam:
        condition: service_started
    networks:
      - reloop
    <<: *logging

  dashboard:
    <<: *frontend
    image: reloopsh/fe-dashboard@sha256:a1a6bcf83ed3c995611269e2b13fa9535adde84c21fd65aff76694fd08eab903
    container_name: reloop-dashboard
    environment:
      NODE_ENV: production
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}

  links:
    <<: *frontend
    image: reloopsh/fe-links@sha256:de1a8465a1e66fb1d0ea09882ed7550c0d11e0c6289c43a708b6ab903d090b4e
    container_name: reloop-links
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_URL: ${TRACKING_BASE_URL}
      INTERNAL_API_URL: http://contacts:8014/api/contacts
      INTERNAL_MAIL_API_URL: http://mail:8015/api/mail

  migrate:
    image: reloopsh/be-auth@sha256:de157dbd7a74514f2519db1cfd436aa7f5f98f8a3ac56893b2b465b88c1ed588
    restart: "no"
    working_dir: /app/packages/db
    entrypoint: ["/app/node_modules/.bin/drizzle-kit"]
    command: ["push", "--force"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reloop
    <<: *logging

networks:
  reloop:
    name: reloop

volumes:
  postgres-data:
  redis-data:
  nats-data:
  caddy-data:
  caddy-config:
  rspamd-data:
  smtp-data:
  smtp-meta:
  inbound-data:
  inbound-meta:
