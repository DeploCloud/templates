services:
  gitea:
    image: docker.gitea.com/gitea:1.27.2
    restart: unless-stopped
    expose:
      - 3000
    environment:
      USER_UID: ${USER_UID}
      USER_GID: ${USER_GID}
      GITEA__database__DB_TYPE: ${GITEA__database__DB_TYPE}
      GITEA__database__PATH: ${GITEA__database__PATH}
      GITEA__server__ROOT_URL: ${GITEA__server__ROOT_URL}
      GITEA__server__DOMAIN: ${GITEA__server__DOMAIN}
      GITEA__server__DISABLE_SSH: ${GITEA__server__DISABLE_SSH}
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  gitea-data: {}
