[variables]
postgres_password = "${password:32}"
minio_access_key = "${username}"
minio_secret_key = "${password:32}"
gotrue_admin_password = "${password:32}"
gotrue_jwt_secret = "${hash:64}"

[config]
[[config.mounts]]
filePath = "nginx.conf"
content = """
events {}
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 80;
    client_max_body_size 2G;
    location /gotrue/ {
      proxy_pass http://gotrue:9999/;
      proxy_set_header Host $http_host;
    }
    location /ws {
      proxy_pass http://appflowy-cloud:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }
    location /api {
      proxy_pass http://appflowy-cloud:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $request_id;
    }
    location /minio/ {
      proxy_pass http://minio:9001/;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /minio-api/ {
      proxy_pass http://minio:9000/;
      proxy_set_header Host minio:9000;
      client_max_body_size 0;
    }
    location /console {
      proxy_pass http://admin-frontend:3000;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Scheme $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }
    location /ai/ {
      proxy_pass http://appflowy-ai:5001/;
      proxy_set_header Host $http_host;
    }
    location / {
      proxy_pass http://appflowy-web:80;
      proxy_set_header Host $host;
    }
  }
}
"""

[[config.domains]]
serviceName = "appflowy-gateway"
port = 80
host = "${domain}"

[config.env]
POSTGRES_PASSWORD = "${postgres_password}"
MINIO_ROOT_USER = "${minio_access_key}"
MINIO_ROOT_PASSWORD = "${minio_secret_key}"
GOTRUE_ADMIN_EMAIL = "${email}"
GOTRUE_ADMIN_PASSWORD = "${gotrue_admin_password}"
GOTRUE_JWT_SECRET = "${gotrue_jwt_secret}"
APPFLOWY_BASE_URL = "https://${domain}"
APPFLOWY_WEBSOCKET_BASE_URL = "wss://${domain}/ws"
APPFLOWY_DATABASE_URL = "postgresql://appflowy:${postgres_password}@postgres:5432/appflowy"
APPFLOWY_REDIS_URI = "redis://redis:6379"
GOTRUE_DATABASE_URL = "postgresql://appflowy:${postgres_password}@postgres:5432/appflowy?search_path=auth"
API_EXTERNAL_URL = "https://${domain}/gotrue"
ADMIN_FRONTEND_PATH_PREFIX = "/console"
APPFLOWY_S3_ACCESS_KEY = "${minio_access_key}"
APPFLOWY_S3_SECRET_KEY = "${minio_secret_key}"
APPFLOWY_S3_BUCKET = "appflowy"
APPFLOWY_S3_REGION = "us-east-1"
APPFLOWY_S3_MINIO_URL = "http://minio:9000"
APPFLOWY_S3_PRESIGNED_URL_ENDPOINT = "https://${domain}/minio-api"
APPFLOWY_SEARCH_SERVICE_URL = "http://appflowy-search:4002"
AI_ENABLED = "true"
AI_SERVER_HOST = "appflowy-ai"
AI_SERVER_PORT = "5001"
AI_OPENAI_API_KEY = ""
