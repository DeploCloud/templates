services:
  langflow:
    image: langflowai/langflow:1.12.7@sha256:d2df4bb593c49ce385a3862d74278cf119bb9c7672ba69ee6e727530911a12f9
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - 7860
    environment:
      LANGFLOW_HOST: ${LANGFLOW_HOST}
      LANGFLOW_PORT: ${LANGFLOW_PORT}
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_DATABASE_URL: ${LANGFLOW_DATABASE_URL}
    volumes:
      - langflow-data:/app/data

  postgres:
    image: postgres:16-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    environment:
      POSTGRES_DB: langflow
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  langflow-data: {}
  postgres-data: {}
