services:
  langflow:
    image: langflowai/langflow:1.12.7@sha256:d2df4bb593c49ce385a3862d74278cf119bb9c7672ba69ee6e727530911a12f9
    restart: unless-stopped
    expose:
      - 7860
    environment:
      LANGFLOW_HOST: ${LANGFLOW_HOST}
      LANGFLOW_PORT: ${LANGFLOW_PORT}
      LANGFLOW_AUTO_LOGIN: ${LANGFLOW_AUTO_LOGIN}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
    volumes:
      - langflow-data:/app/data

volumes:
  langflow-data: {}
