services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    restart: unless-stopped
    expose:
      - 51821
    environment:
      PORT: ${PORT}
      INSECURE: ${INSECURE}
      PASSWORD_HASH: ${PASSWORD_HASH}
      WG_HOST: ${WG_HOST}
    volumes:
      - wg-easy-data:/etc/wireguard

volumes:
  wg-easy-data: {}
