services:
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    restart: unless-stopped
    expose:
      - 3080
    environment:
      HOST: ${HOST}
      PORT: ${PORT}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - librechat-uploads:/app/uploads

volumes:
  librechat-uploads: {}
