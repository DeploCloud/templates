services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:v2.1.6-ls232@sha256:122a5e733332c20bfd516d88cd38d7d973c3dad52c52a389d992651acc074df5
    restart: unless-stopped
    expose:
      - 8384
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - syncthing-config:/config
      - syncthing-data:/var/syncthing
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

volumes:
  syncthing-config: {}
  syncthing-data: {}
