services:
  freshrss:
    image: freshrss/freshrss:1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
    restart: unless-stopped
    depends_on:
      freshrss-db:
        condition: service_healthy
    expose:
      - 80
    environment:
      TZ: ${TZ}
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url https://${FRESHRSS_DOMAIN}
        --db-base freshrss
        --db-host freshrss-db
        --db-password ${DB_PASSWORD}
        --db-type pgsql
        --db-user freshrss
        --default-user admin
        --language en
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD}
        --email ${ADMIN_EMAIL}
        --language en
        --password ${ADMIN_PASSWORD}
        --user admin
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - freshrss-extensions:/var/www/FreshRSS/extensions

  freshrss-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: freshrss
      POSTGRES_USER: freshrss
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshrss -d freshrss"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - freshrss-database:/var/lib/postgresql/data

volumes:
  freshrss-data: {}
  freshrss-extensions: {}
  freshrss-database: {}
